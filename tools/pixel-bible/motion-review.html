<!doctype html><meta charset="utf-8"><title>Pixel Bible motion review</title>
<style>body{margin:0;background:#d4dcc9}canvas{display:block}</style><canvas id="sheet"></canvas>
<script type="module">
import {OBJECT_CATALOG} from '../../js/features/pixel-bible/object-catalog.js';
import {drawPixelCharacter,drawWorldObject,characterStyle} from '../../js/features/pixel-bible/art.js';
import {interactionPose,interactionOptions} from '../../js/features/pixel-bible/interaction-motion.js';
import {objectBehavior} from '../../js/features/pixel-bible/object-behavior.js';
import {interactionAnchor,heldObject,objectWorn,objectInteractionFrame,drawObjectResponse} from '../../js/features/pixel-bible/object-response.js';
import {drawInteractionEffects} from '../../js/features/pixel-bible/interaction-effects.js';
const params=new URLSearchParams(location.search),page=Number(params.get('page')||0),all=Object.keys(OBJECT_CATALOG),kinds=params.has('kind')?[params.get('kind')]:all.slice(page*12,page*12+12),facing=params.get('direction')||'right';
const canvas=document.querySelector('canvas');canvas.width=Math.max(2400,...kinds.map(k=>interactionOptions(k).length*400));canvas.height=kinds.length*150;
const c=canvas.getContext('2d');c.fillStyle='#d4dcc9';c.fillRect(0,0,canvas.width,canvas.height);
let frames=0;const errors=[];
function render(kind,gesture,t,context,x,y,direction='right'){
 context.save();context.translate(x,y);
 const o={kind,x:0,y:0},routine={kind,category:objectBehavior(kind).category,gesture,period:4,phase:0,variant:0};
 const n={name:'룻',x:-1,y:0,direction,usingObject:o,interaction:routine,interactionStart:0};
 const pose=interactionPose(routine,t),anchor=interactionAnchor(n),held=heldObject(n,t),frame=objectInteractionFrame(o,[n],t);
 for(const value of Object.values(pose))if(typeof value==='number'&&!Number.isFinite(value))throw Error(kind+': invalid pose');
 if(!held&&!objectWorn(n,t)){drawWorldObject(context,o,24,frame);drawObjectResponse(context,o,frame);}
 drawPixelCharacter(context,characterStyle(n.name),anchor.x,anchor.y,{scale:2,direction,interaction:{...pose,heldObject:!!held||pose.wearing}});
 if(held)drawWorldObject(context,held,24,held.frame);
 drawInteractionEffects(context,n,pose,anchor.x,anchor.y,t);context.restore();frames++;
}
if(params.has('kind')){
 const kind=kinds[0],options=interactionOptions(kind);canvas.width=960;canvas.height=options.length*150;
 options.forEach(([gesture],row)=>{
  c.fillStyle=row%2?'#d4dcc9':'#e5dfcc';c.fillRect(0,row*150,960,150);
  c.fillStyle='#203d3b';c.font='14px sans-serif';c.fillText(kind+' / '+gesture+' / '+facing,8,row*150+18);
  for(let i=0;i<8;i++){render(kind,gesture,i*.5+.1,c,60+i*120,row*150+115,facing);c.fillStyle='#203d3b';c.fillText(String(i+1),8+i*120,row*150+140);}
 });
}else{
kinds.forEach((kind,row)=>{
 c.fillStyle=row%2?'#d4dcc9':'#e5dfcc';c.fillRect(0,row*150,canvas.width,150);
 c.font='bold 14px sans-serif';c.fillStyle='#203d3b';c.fillText(OBJECT_CATALOG[kind].name+' / '+kind,8,row*150+18);
 interactionOptions(kind).forEach(([gesture],option)=>{
  for(let phase=0;phase<4;phase++){
   const x=(option*4+phase)*100;
   render(kind,gesture,phase+.45,c,x+52,row*150+118,facing);
   c.fillStyle='#203d3b';c.font='10px sans-serif';c.fillText(gesture+' '+phase,x+2,row*150+143);
  }
 });
});
}
// Audit all frames, all directions and transition boundaries as well as the visible sheet.
const scratch=document.createElement('canvas');scratch.width=1024;scratch.height=768;const g=scratch.getContext('2d');
const audit=[],tiny=document.createElement('canvas');tiny.width=128;tiny.height=96;
const tc=tiny.getContext('2d',{willReadFrequently:true});tc.imageSmoothingEnabled=false;
for(const kind of kinds){
 const actions=[];
 for(const [gesture]of interactionOptions(kind)){
  const signatures=[],bounds=[];
  for(const direction of ['down','left','right','up'])for(let step=0;step<32;step++){
   try{
    g.clearRect(0,0,1024,768);render(kind,gesture,step/8,g,512,500,direction);
    if(step%4===0){
     tc.clearRect(0,0,128,96);tc.drawImage(scratch,0,0,128,96);
     const data=tc.getImageData(0,0,128,96).data;let hash=2166136261,minX=128,minY=96,maxX=-1,maxY=-1;
     for(let i=0;i<data.length;i+=4){hash=Math.imul(hash^data[i],16777619);hash=Math.imul(hash^data[i+1],16777619);hash=Math.imul(hash^data[i+2],16777619);hash=Math.imul(hash^data[i+3],16777619);if(data[i+3]){const x=(i/4)%128,y=Math.floor(i/512);minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);}}
     signatures.push(hash>>>0);bounds.push([minX,minY,maxX,maxY]);
    }
   }catch(error){errors.push(error.message);}
  }
  actions.push({gesture,signature:signatures.join(','),distinctFrames:new Set(signatures).size,clipped:bounds.some(b=>b[0]===0||b[1]===0||b[2]===127||b[3]===95)});
 }
 const groups=new Map();for(const a of actions){const list=groups.get(a.signature)||[];list.push(a.gesture);groups.set(a.signature,list);}
 audit.push({kind,actions:actions.map(({signature,...a})=>a),identicalActions:[...groups.values()].filter(g=>g.length>1)});
}
window.review={objects:kinds,frames,errors,total:all.length,audit};window.reviewReady=true;
</script>
