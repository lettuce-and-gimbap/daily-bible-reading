<!doctype html><html lang="ko"><meta charset="utf-8"><title>KST 시간별 도안</title><style>body{font:18px sans-serif;background:#e9e5d8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.logo{height:190px;display:flex;align-items:center;justify-content:center;gap:30px}.logo img{border-radius:20px}.logo span{font-size:48px;color:#fff0ca}canvas{width:100%;image-rendering:pixelated}</style><div class="grid"></div><script src="../../js/shared/daylight.js"></script><script type="module">
import {drawWholeBackground} from '../../js/features/pixel-bible/landscape.js';
const colors={dawn:['#827da8','#f2d3ad'],day:['#cbe4e1','#fff0c4'],dusk:['#847291','#f1c5a3'],night:['#233151','#506280']};
for(const hour of [6,12,18,23]){const p=KstLight.at(new Date(Date.UTC(2026,9,24,hour-9))),section=document.createElement('section');section.innerHTML=`<h3>KST ${hour}시 · ${p.label}</h3><div class="logo"><img width="112" src="../../icons/icon-192.png"><span>${p.sun}</span></div><canvas width="960" height="540"></canvas>`;section.querySelector('.logo').style.background=`linear-gradient(155deg,${colors[p.key][0]},${colors[p.key][1]})`;const c=section.querySelector('canvas').getContext('2d');c.scale(.5,.5);drawWholeBackground(c,'meadow',1920,1080);c.globalAlpha=p.alpha;c.fillStyle=p.shade;c.fillRect(0,0,1920,1080);document.querySelector('.grid').append(section);}
window.ready=true;
</script></html>
