<svg xmlns="http://www.w3.org/2000/svg" width="960" height="598" viewBox="0 0 960 598" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">발람과 나귀</title><desc id="desc">본문 읽기 · 창작 도식 / 민수기 22장  /  1–6 · 7–21 · 22–35 · 36–41절 / 장소는 본문 표기를 따릅니다. 도식에 현대 좌표는 표시하지 않았습니다.</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="598" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">발람과 나귀</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">민수기 22장  /  1–6 · 7–21 · 22–35 · 36–41절</text>
<rect x="40" y="189" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="221" r="15" fill="#225d50"/>
<text x="68" y="227" font-size="17" font-weight="750" fill="white" text-anchor="middle">1</text>
<text x="94" y="228" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">발락이 사신을 브돌에 보냄</text>
<rect x="40" y="272" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="304" r="15" fill="#225d50"/>
<text x="68" y="310" font-size="17" font-weight="750" fill="white" text-anchor="middle">2</text>
<text x="94" y="311" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">발람이 허락을 받고 길을 떠남</text>
<rect x="40" y="355" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="387" r="15" fill="#225d50"/>
<text x="68" y="393" font-size="17" font-weight="750" fill="white" text-anchor="middle">3</text>
<text x="94" y="394" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">나귀가 사자를 먼저 보고 세 번 멈춤</text>
<rect x="40" y="438" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="470" r="15" fill="#225d50"/>
<text x="68" y="476" font-size="17" font-weight="750" fill="white" text-anchor="middle">4</text>
<text x="94" y="477" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">발락이 발람을 맞이함</text>
<text x="570" y="188" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">장소</text>
<text x="570" y="221" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">모압 평지 · 브돌 · 아르논</text>
<text x="570" y="251" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">변경 · 기럇후솟 · 바알의</text>
<text x="570" y="281" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">산당</text>
<text x="570" y="314" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">물건·표지</text>
<text x="570" y="347" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">복채 · 나귀 · 칼 · 지팡이 ·</text>
<text x="570" y="377" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">소와 양</text>
<text x="570" y="410" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">함께 읽기</text>
<text x="570" y="443" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">사자가 발람에게 받은 말만</text>
<text x="570" y="473" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">전하라고 함</text>
<path d="M40 534L920 534" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="568" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">장소는 본문 표기를 따릅니다. 도식에 현대 좌표는 표시하지 않았습니다.</text>
</g></svg>
