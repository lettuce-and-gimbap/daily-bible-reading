<title id="title">은 나팔의 신호</title><desc id="desc">본문 읽기 · 창작 도식 / 10:1–10 / 비교 유물 · 투탕카멘의 은 나팔, 이집트 박물관 JE 62007</desc>
<metadata>https://www.globalegyptianmuseum.org/detail.aspx?id=15043</metadata>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="709" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">은 나팔의 신호</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">10:1–10</text>
<rect x="40" y="160" width="880" height="90" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="194" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">두 개를 함께 · 10:3</text>
<text x="62" y="226" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">회중 전체가 회막 문에 모임</text>
<rect x="40" y="262" width="880" height="90" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="296" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">한 개만 · 10:4</text>
<text x="62" y="328" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">지휘관들이 모임</text>
<rect x="40" y="364" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="398" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">출발 신호 · 10:5–7</text>
<text x="62" y="430" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">첫 경보에 동쪽 진영이 출발</text>
<text x="62" y="462" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">둘째 경보에 남쪽 진영이 출발</text>
<rect x="40" y="498" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="532" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">전쟁과 기쁨의 날 · 10:9–10</text>
<text x="62" y="564" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">적과 싸울 때 경보를 울림</text>
<text x="62" y="596" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">절기와 월삭에는 제물 위에 나팔을 붊</text>
<path d="M40 645L920 645" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="679" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">비교 유물 · 투탕카멘의 은 나팔, 이집트 박물관 JE 62007</text>
