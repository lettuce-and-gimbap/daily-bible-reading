<svg xmlns="http://www.w3.org/2000/svg" width="960" height="598" viewBox="0 0 960 598" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">브올에서 본 진영과 야곱의 별</title><desc id="desc">본문 읽기 · 창작 도식 / 민수기 24장  /  1–9 · 10–14 · 15–19 · 20–25절 / 장소는 본문 표기를 따릅니다. 도식에 현대 좌표는 표시하지 않았습니다.</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="598" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">브올에서 본 진영과 야곱의 별</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">민수기 24장  /  1–9 · 10–14 · 15–19 · 20–25절</text>
<rect x="40" y="189" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="221" r="15" fill="#225d50"/>
<text x="68" y="227" font-size="17" font-weight="750" fill="white" text-anchor="middle">1</text>
<text x="94" y="228" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">세 번째 축복</text>
<rect x="40" y="272" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="304" r="15" fill="#225d50"/>
<text x="68" y="310" font-size="17" font-weight="750" fill="white" text-anchor="middle">2</text>
<text x="94" y="311" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">발락이 노하여 발람을 돌려보내려 함</text>
<rect x="40" y="355" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="387" r="15" fill="#225d50"/>
<text x="68" y="393" font-size="17" font-weight="750" fill="white" text-anchor="middle">3</text>
<text x="94" y="394" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">야곱의 별과 규</text>
<rect x="40" y="438" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="470" r="15" fill="#225d50"/>
<text x="68" y="476" font-size="17" font-weight="750" fill="white" text-anchor="middle">4</text>
<text x="94" y="477" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">주변 민족들에 대한 예언</text>
<text x="570" y="188" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">장소</text>
<text x="570" y="221" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">브올 산 · 광야 쪽 이스라엘</text>
<text x="570" y="251" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">진영</text>
<text x="570" y="284" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">물건·표지</text>
<text x="570" y="317" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">제단과 제물 · 별과 규의</text>
<text x="570" y="347" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">이미지</text>
<text x="570" y="380" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">함께 읽기</text>
<text x="570" y="413" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">모압과 에돔, 아말렉과 겐</text>
<text x="570" y="443" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">족속 등을 언급함</text>
<path d="M40 534L920 534" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="568" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">장소는 본문 표기를 따릅니다. 도식에 현대 좌표는 표시하지 않았습니다.</text>
</g></svg>
