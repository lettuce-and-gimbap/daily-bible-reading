<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1041" viewBox="0 0 960 1041" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">광야의 이동과 멈춤</title><desc id="desc">본문 읽기 · 창작 도식 / 9:15–23 · 10–14장 · 20–21장 · 33장 / 시간 순서 개념도 · 이동 거리와 현대 좌표는 표시하지 않았습니다.</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="1041" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">광야의 이동과 멈춤</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">9:15–23 · 10–14장 · 20–21장 · 33장</text>
<rect x="40" y="160" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="194" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">시내 광야 · 9–10장</text>
<text x="62" y="226" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">유월절을 지킴</text>
<text x="62" y="258" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">구름과 은 나팔 신호로 출발</text>
<rect x="40" y="294" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="328" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">다베라와 기브롯 핫다아와 · 11장</text>
<text x="62" y="360" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">진 가장자리의 불</text>
<text x="62" y="392" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">장로 70명과 메추라기</text>
<rect x="40" y="428" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="462" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">하세롯과 바란 광야 · 12장</text>
<text x="62" y="494" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">미리암이 돌아오기를 기다림</text>
<text x="62" y="526" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">바란 광야에 진을 침</text>
<rect x="40" y="562" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="596" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">가데스와 가나안 정탐 · 13–14장</text>
<text x="62" y="628" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">에스골의 열매와 40일 정탐</text>
<text x="62" y="660" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">반역 뒤 호르마에서 패배</text>
<rect x="40" y="696" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="730" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">가데스에서 호르 산까지 · 20장</text>
<text x="62" y="762" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">므리바 사건과 에돔의 거절</text>
<text x="62" y="794" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">아론에서 엘르아살로</text>
<rect x="40" y="830" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="864" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">호르 산에서 모압 변경까지 · 21장</text>
<text x="62" y="896" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">에돔 우회 중 놋뱀 사건</text>
<text x="62" y="928" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">브엘의 우물과 동편 전투</text>
<path d="M40 977L920 977" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="1011" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">시간 순서 개념도 · 이동 거리와 현대 좌표는 표시하지 않았습니다.</text>
</g></svg>
