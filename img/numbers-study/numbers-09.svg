<svg xmlns="http://www.w3.org/2000/svg" width="960" height="541" viewBox="0 0 960 541" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">두 유월절 날짜와 구름의 신호</title><desc id="desc">본문 읽기 · 창작 도식 / 민수기 9장  /  1–5 · 6–14 · 15–23절 / 장소는 본문 표기를 따릅니다. 도식에 현대 좌표는 표시하지 않았습니다.</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="541" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">두 유월절 날짜와 구름의 신호</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">민수기 9장  /  1–5 · 6–14 · 15–23절</text>
<rect x="40" y="189" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="221" r="15" fill="#225d50"/>
<text x="68" y="227" font-size="17" font-weight="750" fill="white" text-anchor="middle">1</text>
<text x="94" y="228" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">첫째 달 14일 유월절</text>
<rect x="40" y="272" width="492" height="99" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="304" r="15" fill="#225d50"/>
<text x="68" y="310" font-size="17" font-weight="750" fill="white" text-anchor="middle">2</text>
<text x="94" y="311" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">시신으로 부정하거나 먼 길에 있으면</text>
<text x="94" y="340" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">둘째 달 14일</text>
<rect x="40" y="381" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="413" r="15" fill="#225d50"/>
<text x="68" y="419" font-size="17" font-weight="750" fill="white" text-anchor="middle">3</text>
<text x="94" y="420" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">구름이 들리면 출발, 머물면 진을 침</text>
<text x="570" y="188" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">장소</text>
<text x="570" y="221" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">시내 광야 · 성막</text>
<text x="570" y="254" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">물건·표지</text>
<text x="570" y="287" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">유월절 제물 · 무교병과 쓴</text>
<text x="570" y="317" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">나물 · 구름과 불 모양</text>
<text x="570" y="350" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">함께 읽기</text>
<text x="570" y="383" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">해가 진 뒤에는 성막 위 구름이</text>
<text x="570" y="413" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">불처럼 보임</text>
<path d="M40 477L920 477" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="511" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">장소는 본문 표기를 따릅니다. 도식에 현대 좌표는 표시하지 않았습니다.</text>
</g></svg>
