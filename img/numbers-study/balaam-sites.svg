<svg xmlns="http://www.w3.org/2000/svg" width="960" height="907" viewBox="0 0 960 907" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">발락이 발람을 데려간 세 장소</title><desc id="desc">본문 읽기 · 창작 도식 / 22:41–24:25 / 본문에 등장하는 순서이며 각 지점의 현대 좌표는 표시하지 않았습니다.</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="907" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">발락이 발람을 데려간 세 장소</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">22:41–24:25</text>
<rect x="40" y="160" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="194" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">바알의 산당 · 22:41–23:12</text>
<text x="62" y="226" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">이스라엘 진영의 일부를 봄</text>
<text x="62" y="258" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">첫 번째 발언에서 이스라엘을 저주하지 못함</text>
<rect x="40" y="294" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="328" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">소빔 들 비스가 · 23:13–26</text>
<text x="62" y="360" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">발락이 다른 자리로 옮김</text>
<text x="62" y="392" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">두 번째 발언에서도 축복함</text>
<rect x="40" y="428" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="462" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">브올 꼭대기 · 23:27–24:9</text>
<text x="62" y="494" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">광야가 내려다보이는 곳</text>
<text x="62" y="526" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">세 번째 발언에서 진영을 바라보고 축복함</text>
<rect x="40" y="562" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="596" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">세 자리의 공통점 · 23:1,14,29–30</text>
<text x="62" y="628" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">각 자리에서 제단 일곱</text>
<text x="62" y="660" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">수송아지와 숫양을 한 마리씩 제단마다 바침</text>
<rect x="40" y="696" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="730" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">브올 이후 · 24:10–25:18</text>
<text x="62" y="762" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">야곱의 별과 주변 민족에 대한 예언</text>
<text x="62" y="794" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">싯딤에서 일어난 바알브올 사건은 25장</text>
<path d="M40 843L920 843" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="877" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">본문에 등장하는 순서이며 각 지점의 현대 좌표는 표시하지 않았습니다.</text>
</g></svg>
