<svg xmlns="http://www.w3.org/2000/svg" width="960" height="515" viewBox="0 0 960 515" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">회막을 둘러싼 네 진영</title><desc id="desc">본문 읽기 · 창작 도식 / 민수기 2장  /  1–16 · 17 · 18–34절 / 장소는 본문 표기를 따릅니다. 도식에 현대 좌표는 표시하지 않았습니다.</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="515" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">회막을 둘러싼 네 진영</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">민수기 2장  /  1–16 · 17 · 18–34절</text>
<rect x="40" y="189" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="221" r="15" fill="#225d50"/>
<text x="68" y="227" font-size="17" font-weight="750" fill="white" text-anchor="middle">1</text>
<text x="94" y="228" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">동쪽 유다와 남쪽 르우벤</text>
<rect x="40" y="272" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="304" r="15" fill="#225d50"/>
<text x="68" y="310" font-size="17" font-weight="750" fill="white" text-anchor="middle">2</text>
<text x="94" y="311" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">가운데 회막과 레위인</text>
<rect x="40" y="355" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="387" r="15" fill="#225d50"/>
<text x="68" y="393" font-size="17" font-weight="750" fill="white" text-anchor="middle">3</text>
<text x="94" y="394" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">서쪽 에브라임과 북쪽 단</text>
<text x="570" y="188" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">장소</text>
<text x="570" y="221" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">성막을 중심으로 동·남·서·북</text>
<text x="570" y="254" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">물건·표지</text>
<text x="570" y="287" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">진영의 기 · 가문별 표지</text>
<text x="570" y="320" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">함께 읽기</text>
<text x="570" y="353" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">진영별 배치와 출발 순서가</text>
<text x="570" y="383" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">함께 제시됨</text>
<path d="M40 451L920 451" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="485" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">장소는 본문 표기를 따릅니다. 도식에 현대 좌표는 표시하지 않았습니다.</text>
</g></svg>
