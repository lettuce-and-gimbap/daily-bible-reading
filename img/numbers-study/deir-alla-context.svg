<svg xmlns="http://www.w3.org/2000/svg" width="960" height="671" viewBox="0 0 960 671" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">데이르 알라의 발람 비문 · 고고학 참고</title><desc id="desc">고고학 자료 · 연구 안내 / 민수기 22–24장과 데이르 알라 출토 자료 / 고고학 참고 카드 · 사진과 글자 복원도는 생략했습니다.</desc>
<metadata>https://www.degruyterbrill.com/document/isbn/9789004666351/html</metadata>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="671" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">고고학 자료 · 연구 안내</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">데이르 알라의 발람 비문 · 고고학 참고</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">민수기 22–24장과 데이르 알라 출토 자료</text>
<rect x="40" y="160" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="194" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">출토 자료</text>
<text x="62" y="226" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">요르단 데이르 알라 발굴에서</text>
<text x="62" y="258" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">글씨가 적힌 회반죽 조각이 발견됨</text>
<rect x="40" y="294" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="328" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">본문과의 접점</text>
<text x="62" y="360" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">비문에도 브올의 아들 발람이라는</text>
<text x="62" y="392" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">이름이 등장함</text>
<rect x="40" y="428" width="880" height="154" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="462" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">범위</text>
<text x="62" y="494" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">비문은 발람 전승의 비교 자료</text>
<text x="62" y="526" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">민수기의 사건이나 이동 경로는</text>
<text x="62" y="558" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">이 비문만으로 확정할 수 없음</text>
<path d="M40 607L920 607" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="641" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">고고학 참고 카드 · 사진과 글자 복원도는 생략했습니다.</text>
</g></svg>
