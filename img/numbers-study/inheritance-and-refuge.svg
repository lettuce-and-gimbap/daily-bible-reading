<svg xmlns="http://www.w3.org/2000/svg" width="960" height="907" viewBox="0 0 960 907" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">기업 분배와 도피성</title><desc id="desc">본문 읽기 · 창작 도식 / 26:52–56 · 27:1–23 · 32–36장 / 본문의 관계와 순서를 읽기 쉽게 배치했습니다.</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="907" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">기업 분배와 도피성</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">26:52–56 · 27:1–23 · 32–36장</text>
<rect x="40" y="160" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="194" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">분배 기준 · 26:52–56</text>
<text x="62" y="226" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">인구가 많으면 넓게, 적으면 좁게</text>
<text x="62" y="258" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">제비로 기업을 배정</text>
<rect x="40" y="294" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="328" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">개인의 상속 · 27:1–11</text>
<text x="62" y="360" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">아들 없음 → 딸 → 형제</text>
<text x="62" y="392" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">그다음 아버지의 형제 → 가까운 친족</text>
<rect x="40" y="428" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="462" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">동편과 서편 · 32장, 34장</text>
<text x="62" y="494" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">동편 2지파 반 · 가나안 9지파 반</text>
<text x="62" y="526" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">엘르아살·여호수아와 지파 대표</text>
<rect x="40" y="562" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="596" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">성읍과 피신 · 35장</text>
<text x="62" y="628" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">레위인에게 48성읍과 목초지</text>
<text x="62" y="660" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">그중 도피성 6곳, 요단 양쪽에 3곳씩</text>
<rect x="40" y="696" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="730" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">기업의 보존 · 36장</text>
<text x="62" y="762" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">기업을 받는 딸의 혼인은 아버지 지파 안에서</text>
<text x="62" y="794" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">슬로브핫의 딸들은 친족과 혼인</text>
<path d="M40 843L920 843" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="877" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">본문의 관계와 순서를 읽기 쉽게 배치했습니다.</text>
</g></svg>
