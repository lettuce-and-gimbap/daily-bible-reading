<svg xmlns="http://www.w3.org/2000/svg" width="960" height="907" viewBox="0 0 960 907" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">에돔 우회에서 모압 평지와 바산까지</title><desc id="desc">본문 읽기 · 창작 도식 / 20:14–29 · 21장 · 22:1 · 32장 / 21장의 이동과 전투를 본문 순서로 읽는 도식입니다.</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="907" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">에돔 우회에서 모압 평지와 바산까지</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">20:14–29 · 21장 · 22:1 · 32장</text>
<rect x="40" y="160" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="194" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">에돔 변경 · 20:14–21:9</text>
<text x="62" y="226" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">가데스 → 호르 산 → 홍해 길로 에돔 우회</text>
<text x="62" y="258" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">아랏 왕과 호르마 사건도 이 구간에 서술</text>
<rect x="40" y="294" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="328" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">모압 변경 · 21:10–16</text>
<text x="62" y="360" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">오봇 → 이예아바림 → 세렛 골짜기</text>
<text x="62" y="392" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">아르논 건너편 → 브엘 우물</text>
<rect x="40" y="428" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="462" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">모압 들 · 21:18–20</text>
<text x="62" y="494" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">맛다나 → 나할리엘 → 바못</text>
<text x="62" y="526" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">모압 들 골짜기와 비스가 꼭대기</text>
<rect x="40" y="562" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="596" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">시혼과 옥 · 21:21–35</text>
<text x="62" y="628" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">야하스·헤스본·야셀 → 바산의 에드레이</text>
<text x="62" y="660" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">아르논~얍복은 시혼에게서 차지한 구간</text>
<rect x="40" y="696" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="730" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">모압 평지 · 22:1</text>
<text x="62" y="762" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">요단 건너 여리고 맞은편에 진을 침</text>
<text x="62" y="794" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">32장에서 동편 기업을 요청하고 배정받음</text>
<path d="M40 843L920 843" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="877" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">21장의 이동과 전투를 본문 순서로 읽는 도식입니다.</text>
</g></svg>
