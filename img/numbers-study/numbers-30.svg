<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">서원 효력과 책임</title><desc id="desc">본문 읽기 · 창작 도식 / 민수기 30장  /  1–2 · 3–5 · 6–8 · 9 · 10–16절 / 장소는 본문 표기를 따릅니다. 도식에 현대 좌표는 표시하지 않았습니다.</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="624" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">서원 효력과 책임</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">민수기 30장  /  1–2 · 3–5 · 6–8 · 9 · 10–16절</text>
<rect x="40" y="189" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="221" r="15" fill="#225d50"/>
<text x="68" y="227" font-size="17" font-weight="750" fill="white" text-anchor="middle">1</text>
<text x="94" y="228" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">남자가 한 서원을 지킴</text>
<rect x="40" y="272" width="492" height="99" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="304" r="15" fill="#225d50"/>
<text x="68" y="310" font-size="17" font-weight="750" fill="white" text-anchor="middle">2</text>
<text x="94" y="311" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">아버지나 남편이 들은 날 승인 또는</text>
<text x="94" y="340" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">취소</text>
<rect x="40" y="381" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="413" r="15" fill="#225d50"/>
<text x="68" y="419" font-size="17" font-weight="750" fill="white" text-anchor="middle">3</text>
<text x="94" y="420" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">과부나 이혼한 여인의 서원은 유효</text>
<rect x="40" y="464" width="492" height="73" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<circle cx="68" cy="496" r="15" fill="#225d50"/>
<text x="68" y="502" font-size="17" font-weight="750" fill="white" text-anchor="middle">4</text>
<text x="94" y="503" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">나중에 취소한 남편이 책임을 짐</text>
<text x="570" y="188" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">장소</text>
<text x="570" y="221" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">아버지 집 · 혼인 가정</text>
<text x="570" y="254" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">물건·표지</text>
<text x="570" y="287" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">말로 한 서원과 맹세</text>
<text x="570" y="320" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">함께 읽기</text>
<text x="570" y="353" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">들은 날 잠잠한 경우 서원이</text>
<text x="570" y="383" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">효력을 유지함</text>
<path d="M40 560L920 560" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="594" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">장소는 본문 표기를 따릅니다. 도식에 현대 좌표는 표시하지 않았습니다.</text>
</g></svg>
