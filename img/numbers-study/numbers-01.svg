<svg xmlns="http://www.w3.org/2000/svg" width="960" height="523" viewBox="0 0 960 523" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">시내 광야의 첫 계수</title><desc id="desc">본문 읽기 · 창작 도식 / 민수기 1장  /  1–16 · 17–46 · 47–54절 / 장소는 본문 표기를 따릅니다. 도식에 현대 좌표는 표시하지 않았습니다.</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="523" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
