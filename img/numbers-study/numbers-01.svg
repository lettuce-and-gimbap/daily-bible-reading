<text x="94" y="394" font-size="23" font-weight="650" fill="#19342f" text-anchor="start">합계 603,550명</text>
<text x="570" y="188" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">장소</text>
<text x="570" y="221" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">시내 광야 · 회막</text>
<text x="570" y="254" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">물건·표지</text>
<text x="570" y="287" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">족보와 계수 · 증거의 성막과</text>
<text x="570" y="317" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">기구</text>
<text x="570" y="350" font-size="20" font-weight="750" fill="#225d50" text-anchor="start">함께 읽기</text>
<text x="570" y="383" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">레위인은 별도로 성막을 맡고</text>
<text x="570" y="413" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">그 둘레에 진을 침</text>
