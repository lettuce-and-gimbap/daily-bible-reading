<svg xmlns="http://www.w3.org/2000/svg" width="960" height="901" viewBox="0 0 960 901" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">민수기 33장의 진영 목록</title><desc id="desc">본문 읽기 · 창작 도식 / 33:3–49 / 비하히롯은 바알스본 앞, 믹돌 앞에 있는 진으로 나옵니다 (33:7).</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="901" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">민수기 33장의 진영 목록</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">33:3–49</text>
<rect x="40" y="160" width="880" height="154" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="194" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">애굽에서 시내 광야까지 · 33:3–15</text>
<text x="62" y="226" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">라암셋 → 숙곳 → 에담 → 비하히롯</text>
<text x="62" y="258" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">바다 통과 → 마라 → 엘림 → 홍해 가</text>
<text x="62" y="290" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">신 광야 → 돕가 → 알루스 → 르비딤 → 시내 광야</text>
<rect x="40" y="326" width="880" height="154" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="360" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">시내에서 광야 중간까지 · 33:16–26</text>
<text x="62" y="392" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">기브롯 핫다아와 → 하세롯 → 릿마 → 림몬베레스</text>
<text x="62" y="424" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">립나 → 릿사 → 그헬라다 → 세벨 산</text>
<text x="62" y="456" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">하라다 → 막헬롯 → 다핫</text>
<rect x="40" y="492" width="880" height="154" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="526" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">광야 중간에서 가데스까지 · 33:27–36</text>
<text x="62" y="558" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">데라 → 밋가 → 하스모나 → 모세롯</text>
<text x="62" y="590" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">브네야아간 → 홀하깃갓 → 욧바다</text>
<text x="62" y="622" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">아브로나 → 에시온게벨 → 신 광야(가데스)</text>
<rect x="40" y="658" width="880" height="154" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="692" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">호르 산에서 모압 평지까지 · 33:37–49</text>
<text x="62" y="724" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">호르 산 → 살모나 → 부논 → 오봇</text>
<text x="62" y="756" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">이예아바림 → 디본갓 → 알몬디블라다임</text>
<text x="62" y="788" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">아바림 산 → 모압 평지(벧여시못~아벨싯딤)</text>
<path d="M40 837L920 837" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="871" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">비하히롯은 바알스본 앞, 믹돌 앞에 있는 진으로 나옵니다 (33:7).</text>
</g></svg>
