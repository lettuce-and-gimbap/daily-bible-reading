<svg xmlns="http://www.w3.org/2000/svg" width="960" height="741" viewBox="0 0 960 741" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">가나안 사방 경계의 지명 순서</title><desc id="desc">본문 읽기 · 창작 도식 / 34:1–15 / 북쪽 경계의 호르 산과 에돔 변경의 호르 산은 각각 등장하는 문맥을 따랐습니다.</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="741" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">가나안 사방 경계의 지명 순서</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">34:1–15</text>
<rect x="40" y="160" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="194" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">남쪽 · 34:3–5</text>
<text x="62" y="226" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">염해 끝 → 아그랍빔 남쪽 → 신 → 가데스바네아 남쪽</text>
<text x="62" y="258" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">하살아달 → 아스몬 → 애굽 시내 → 바다</text>
<rect x="40" y="294" width="880" height="90" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="328" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">서쪽 · 34:6</text>
<text x="62" y="360" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">대해가 경계</text>
<rect x="40" y="396" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="430" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">북쪽 · 34:7–9</text>
<text x="62" y="462" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">대해 → 북쪽 경계의 호르 산 → 하맛 어귀</text>
<text x="62" y="494" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">스닷 → 시브론 → 하살에난</text>
<rect x="40" y="530" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="564" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">동쪽 · 34:10–12</text>
<text x="62" y="596" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">하살에난 → 스밤 → 리블라 → 아인 동쪽</text>
<text x="62" y="628" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">긴네렛 동쪽 해변 → 요단 → 염해</text>
<path d="M40 677L920 677" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="711" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">북쪽 경계의 호르 산과 에돔 변경의 호르 산은 각각 등장하는 문맥을 따랐습니다.</text>
</g></svg>
