<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1041" viewBox="0 0 960 1041" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">제사와 절기의 달력</title><desc id="desc">본문 읽기 · 창작 도식 / 9:1–14 · 15:1–21 · 28–29장 / 본문의 관계와 순서를 읽기 쉽게 배치했습니다.</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="1041" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">제사와 절기의 달력</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">9:1–14 · 15:1–21 · 28–29장</text>
<rect x="40" y="160" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="194" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">매일 · 28:1–8</text>
<text x="62" y="226" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">아침과 저녁에 어린양 한 마리씩</text>
<text x="62" y="258" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">소제와 전제를 함께 드림</text>
<rect x="40" y="294" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="328" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">매주와 매달 · 28:9–15</text>
<text x="62" y="360" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">안식일의 추가 어린양 두 마리</text>
<text x="62" y="392" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">매달 첫날 수송아지·숫양·어린양·숫염소</text>
<rect x="40" y="428" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="462" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">첫째 달 · 28:16–25</text>
<text x="62" y="494" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">14일 유월절</text>
<text x="62" y="526" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">15일부터 7일간 무교절</text>
<rect x="40" y="562" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="596" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">칠칠절 · 28:26–31</text>
<text x="62" y="628" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">첫 열매의 새 소제를 드림</text>
<text x="62" y="660" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">성회로 모임</text>
<rect x="40" y="696" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="730" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">일곱째 달 · 29:1–11</text>
<text x="62" y="762" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">1일 나팔을 부는 날</text>
<text x="62" y="794" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">10일 자신을 낮추는 날</text>
<rect x="40" y="830" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="864" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">일곱째 달 · 29:12–38</text>
<text x="62" y="896" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">15일부터 7일간 초막절</text>
<text x="62" y="928" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">여덟째 날 별도의 대회</text>
<path d="M40 977L920 977" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="1011" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">본문의 관계와 순서를 읽기 쉽게 배치했습니다.</text>
</g></svg>
