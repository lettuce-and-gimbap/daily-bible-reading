<svg xmlns="http://www.w3.org/2000/svg" width="960" height="671" viewBox="0 0 960 671" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">포도송이·싹 난 지팡이·놋뱀</title><desc id="desc">본문 읽기 · 창작 도식 / 민수기 13:23 · 17:8–10 · 21:4–9 / 창작 삽화 · 물건의 실제 형태와 재질을 재현한 그림으로 쓰지 않습니다.</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="671" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">포도송이·싹 난 지팡이·놋뱀</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">민수기 13:23 · 17:8–10 · 21:4–9</text>
<rect x="40" y="164" width="880" height="130" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="202" font-size="25" font-weight="750" fill="#225d50" text-anchor="start">에스골의 포도송이 · 13:23</text>
<text x="62" y="239" font-size="22" font-weight="500" fill="#19342f" text-anchor="start">정탐꾼 둘이 포도송이를 막대에 메었습니다.</text>
<text x="62" y="270" font-size="22" font-weight="500" fill="#19342f" text-anchor="start">석류와 무화과도 함께 가져왔습니다.</text>
<path d="M730 208h160m-80 0v23m-15 4l15-4l16 4" stroke="#765235" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="790" cy="240" r="10" fill="#775585"/><circle cx="810" cy="240" r="10" fill="#775585"/><circle cx="830" cy="240" r="10" fill="#775585"/><circle cx="800" cy="258" r="10" fill="#775585"/><circle cx="820" cy="258" r="10" fill="#775585"/><circle cx="810" cy="276" r="10" fill="#775585"/>
<rect x="40" y="307" width="880" height="130" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="345" font-size="25" font-weight="750" fill="#225d50" text-anchor="start">아론의 지팡이 · 17:8–10</text>
<text x="62" y="382" font-size="22" font-weight="500" fill="#19342f" text-anchor="start">지팡이에 싹이 나고 꽃이 피고 열매가 맺혔습니다.</text>
<text x="62" y="413" font-size="22" font-weight="500" fill="#19342f" text-anchor="start">아론의 지팡이를 증거궤 앞에 남겼습니다.</text>
<path d="M770 402l58-82m-29 42l-30-18m37 7l37-9m-55 32l-25 2" stroke="#765235" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M761 376q-31-30 1-26q22 7-1 26m74-33q-10-29 19-26q16 10-19 26" fill="#39765e"/><circle cx="768" cy="340" r="9" fill="#d6819c"/><ellipse cx="824" cy="326" rx="9" ry="12" fill="#d0863f"/>
<rect x="40" y="450" width="880" height="130" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="488" font-size="25" font-weight="750" fill="#225d50" text-anchor="start">장대에 단 놋뱀 · 21:4–9</text>
<text x="62" y="525" font-size="22" font-weight="500" fill="#19342f" text-anchor="start">에돔을 우회하는 길에 불뱀 사건이 일어났습니다.</text>
<text x="62" y="556" font-size="22" font-weight="500" fill="#19342f" text-anchor="start">뱀에 물린 사람이 장대 위 놋뱀을 보고 살았습니다.</text>
<path d="M809 468v108" stroke="#765235" stroke-width="8" stroke-linecap="round"/><path d="M773 540c71 19 98-10 38-24c-52-13-35-44 25-34" fill="none" stroke="#a55c31" stroke-width="11" stroke-linecap="round"/><circle cx="839" cy="482" r="7" fill="#a55c31"/>
<path d="M40 607L920 607" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="641" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">창작 삽화 · 물건의 실제 형태와 재질을 재현한 그림으로 쓰지 않습니다.</text>
