<svg xmlns="http://www.w3.org/2000/svg" width="960" height="901" viewBox="0 0 960 901" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">성막 운반과 수레 배정</title><desc id="desc">본문 읽기 · 창작 도식 / 3:21–38 · 4장 · 7:1–9 · 10:17,21 / 본문의 관계와 순서를 읽기 쉽게 배치했습니다.</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="901" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">성막 운반과 수레 배정</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">3:21–38 · 4장 · 7:1–9 · 10:17,21</text>
<rect x="40" y="160" width="880" height="154" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="194" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">고핫 · 남쪽</text>
<text x="62" y="226" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">궤·상·등잔대·제단과 기구</text>
<text x="62" y="258" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">제사장이 먼저 덮음 (4:5–20)</text>
<text x="62" y="290" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">어깨에 멤 · 수레 배정 없음 (7:9)</text>
<rect x="40" y="326" width="880" height="154" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="360" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">게르손 · 서쪽</text>
<text x="62" y="392" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">휘장·덮개·뜰의 막과 줄</text>
<text x="62" y="424" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">이다말이 감독 (4:21–28)</text>
<text x="62" y="456" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">수레 2대와 소 4마리 (7:7)</text>
<rect x="40" y="492" width="880" height="154" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="526" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">므라리 · 북쪽</text>
<text x="62" y="558" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">널판·띠·기둥·받침·말뚝·줄</text>
<text x="62" y="590" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">이다말이 감독 (4:29–33)</text>
<text x="62" y="622" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">수레 4대와 소 8마리 (7:8)</text>
<rect x="40" y="658" width="880" height="154" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="692" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">행진 중 · 10:17,21</text>
<text x="62" y="724" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">게르손과 므라리가 먼저 성막을 운반</text>
<text x="62" y="756" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">고핫이 성물을 가지고 도착하기 전</text>
<text x="62" y="788" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">성막을 세워 둠</text>
<path d="M40 837L920 837" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="871" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">본문의 관계와 순서를 읽기 쉽게 배치했습니다.</text>
</g></svg>
