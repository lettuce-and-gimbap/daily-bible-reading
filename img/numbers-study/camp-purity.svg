<svg xmlns="http://www.w3.org/2000/svg" width="960" height="907" viewBox="0 0 960 907" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">진 안과 밖, 정결 규례</title><desc id="desc">본문 읽기 · 창작 도식 / 5:1–10 · 6:9–12 · 12:10–16 · 19장 · 31:19–24 / 본문의 관계와 순서를 읽기 쉽게 배치했습니다.</desc>

<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<rect x="0" y="0" width="960" height="907" rx="0" fill="#f6f3e9" stroke="none"/>
<rect x="39" y="33" width="8" height="102" rx="4" fill="#225d50" stroke="none"/>
<text x="62" y="55" font-size="20" font-weight="700" fill="#225d50" text-anchor="start">본문 읽기 · 창작 도식</text>
<text x="60" y="101" font-size="35" font-weight="750" fill="#19342f" text-anchor="start">진 안과 밖, 정결 규례</text>
<text x="62" y="135" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">5:1–10 · 6:9–12 · 12:10–16 · 19장 · 31:19–24</text>
<rect x="40" y="160" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="194" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">진 밖에서 기다림 · 5:1–4</text>
<text x="62" y="226" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">피부병·유출·시신 접촉으로</text>
<text x="62" y="258" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">부정해진 사람을 진 밖에 둠</text>
<rect x="40" y="294" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="328" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">서원을 다시 시작 · 6:9–12</text>
<text x="62" y="360" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">나실인이 시신으로 부정해짐</text>
<text x="62" y="392" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">7일째 삭발, 8일째 제물</text>
<rect x="40" y="428" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="462" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">공동체가 멈춤 · 12:10–16</text>
<text x="62" y="494" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">미리암을 진 밖에 7일 둠</text>
<text x="62" y="526" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">다시 들어온 뒤 행진을 재개</text>
<rect x="40" y="562" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="596" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">재와 정결의 물 · 19장</text>
<text x="62" y="628" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">재와 흐르는 물, 우슬초</text>
<text x="62" y="660" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">시신 접촉 후 제3일과 제7일</text>
<rect x="40" y="696" width="880" height="122" rx="14" fill="#fffdf6" stroke="#b8c9be"/>
<text x="62" y="730" font-size="24" font-weight="750" fill="#225d50" text-anchor="start">전쟁 뒤 · 31:19–24</text>
<text x="62" y="762" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">진 밖에 7일 머묾</text>
<text x="62" y="794" font-size="23" font-weight="500" fill="#19342f" text-anchor="start">사람과 물건을 정결하게 함</text>
<path d="M40 843L920 843" stroke="#b8c9be" stroke-width="2"/>
<text x="40" y="877" font-size="20" font-weight="500" fill="#405a51" text-anchor="start">본문의 관계와 순서를 읽기 쉽게 배치했습니다.</text>
</g></svg>
