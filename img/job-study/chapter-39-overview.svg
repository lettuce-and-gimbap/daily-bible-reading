<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">욥기 39장 장별 도해</title><desc id="desc">들짐승의 출산과 자유 → 타조와 군마 → 매와 독수리의 삶. 장소: 하나님의 질문 속 광야·산. 사물: 산염소·들나귀·타조·말·새.</desc><rect width="1000" height="620" fill="#fbfaf6"/><rect x="24" y="24" width="952" height="572" rx="24" fill="white" stroke="#d9e2db"/><text x="50" y="76" font-family="Malgun Gothic, sans-serif" font-size="32" font-weight="700" fill="#24483e">욥기 39장 · 흐름과 이미지</text><text x="50" y="112" font-family="Malgun Gothic, sans-serif" font-size="18" fill="#62766d">본문 1–30절 · 설명을 위한 창작 도해</text><path d="M50 140H950" stroke="#dce6df"/><g font-family="Malgun Gothic, sans-serif"><rect x="50" y="190" width="275" height="156" rx="18" fill="#edf3ef"/><circle cx="82" cy="220" r="16" fill="#31584e"/><text x="82" y="226" text-anchor="middle" fill="white" font-size="17">1</text><text x="72" y="269" font-size="21" fill="#243d39"><tspan x="72" dy="0">들짐승의 출산과 자유</tspan></text><path d="M332 268h15m-6-6 6 6-6 6" fill="none" stroke="#9d7843" stroke-width="3"/><rect x="355" y="190" width="275" height="156" rx="18" fill="#f9f1e3"/><circle cx="387" cy="220" r="16" fill="#31584e"/><text x="387" y="226" text-anchor="middle" fill="white" font-size="17">2</text><text x="377" y="269" font-size="21" fill="#243d39"><tspan x="377" dy="0">타조와 군마</tspan></text><path d="M637 268h15m-6-6 6 6-6 6" fill="none" stroke="#9d7843" stroke-width="3"/><rect x="660" y="190" width="275" height="156" rx="18" fill="#edf1f7"/><circle cx="692" cy="220" r="16" fill="#31584e"/><text x="692" y="226" text-anchor="middle" fill="white" font-size="17">3</text><text x="682" y="269" font-size="21" fill="#243d39"><tspan x="682" dy="0">매와 독수리의 삶</tspan></text><text x="50" y="397" font-size="19" font-weight="700" fill="#a27637">장소 / 장면</text><text x="50" y="430" font-size="19" fill="#394b46">하나님의 질문 속 광야·산</text><text x="510" y="397" font-size="19" font-weight="700" fill="#a27637">사물 / 시적 이미지</text><text x="510" y="430" font-size="19" fill="#394b46">산염소·들나귀·타조·말·새</text><text x="50" y="553" font-size="16" fill="#687b72">표현은 이해를 돕는 도식이며 현장 복원이나 유물 사진이 아닙니다.</text></g></svg>