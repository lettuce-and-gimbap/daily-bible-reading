<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img"><title>인장과 진흙의 비교 도식</title><rect width="1000" height="500" fill="#fbfaf6"/><g font-family="Malgun Gothic, sans-serif" fill="#24483e"><text x="45" y="65" font-size="30" font-weight="bold">인장과 진흙 · 욥기 38:14</text><text x="45" y="105" font-size="19">빛에 드러나는 땅을 인장 아래 변하는 진흙에 비유합니다.</text><rect x="120" y="185" width="120" height="150" rx="30" fill="#b08a61"/><path d="M150 205v110m28-110v110m28-110v110" stroke="#fff5e7" stroke-width="5"/><path d="M275 260h100m-15-12 15 12-15 12" fill="none" stroke="#9d7843" stroke-width="4"/><rect x="410" y="200" width="390" height="115" rx="18" fill="#d8b995"/><path d="M440 225h330m-330 30h330m-330 30h330" stroke="#a17b55" stroke-width="4"/><text x="110" y="375" font-size="20">원통 인장 (도식)</text><text x="410" y="375" font-size="20">진흙에 남은 무늬 (도식)</text><text x="45" y="450" font-size="17">실제 유물의 모사 아님 · 메트 소장품은 별도 비교 자료</text></g></svg>