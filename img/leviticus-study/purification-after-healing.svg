<svg xmlns="http://www.w3.org/2000/svg" width="720" height="599" viewBox="0 0 720 599" role="img" aria-labelledby="title caption" xml:lang="ko">
  <title id="title">피부 질환이 나은 뒤의 정결 예식</title>
  <desc id="caption">레위기 14:1–32에 근거한 피부 질환이 나은 뒤의 정결 예식 도식</desc>
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <rect x="0" y="0" width="720" height="599" rx="0" fill="#fcfaf4" stroke="none"/>
  <rect x="28" y="28" width="8" height="40" rx="4" fill="#21675e" stroke="none"/>
  <text x="50" y="61" font-size="39" font-weight="780" fill="#24342f" text-anchor="start">피부 질환이 나은 뒤의 정결 예식</text>
  <rect x="28" y="88" width="664" height="86" rx="15" fill="#e8f3ee" stroke="none"/>
  <text x="48" y="122" font-size="26" font-weight="750" fill="#21675e" text-anchor="start">진영 밖에서 확인</text>
  <text x="48" y="154" font-size="22" font-weight="500" fill="#24342f" text-anchor="start">제사장이 피부 질환이 나았는지 살핌 · 1–3절</text>
  <path d="M360 177v18m-6-6 6 6 6-6" fill="none" stroke="#21675e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="28" y="198" width="664" height="116" rx="15" fill="#f8efd9" stroke="none"/>
  <text x="48" y="232" font-size="26" font-weight="750" fill="#76561d" text-anchor="start">진영으로 들어옴</text>
  <text x="48" y="264" font-size="22" font-weight="500" fill="#24342f" text-anchor="start">새 두 마리를 쓰는 예식 뒤 옷을 빨고 털을 밀고 씻음</text>
  <text x="48" y="295" font-size="22" font-weight="500" fill="#24342f" text-anchor="start">진영에 들어오되 자기 장막 밖에 7일 머묾 · 4–8절</text>
  <path d="M360 317v18m-6-6 6 6 6-6" fill="none" stroke="#21675e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="28" y="338" width="664" height="86" rx="15" fill="#e8f3ee" stroke="none"/>
  <text x="48" y="372" font-size="26" font-weight="750" fill="#21675e" text-anchor="start">일곱째 날</text>
  <text x="48" y="404" font-size="22" font-weight="500" fill="#24342f" text-anchor="start">다시 털을 밀고 옷을 빨고 몸을 씻음 · 9절</text>
  <path d="M360 427v18m-6-6 6 6 6-6" fill="none" stroke="#21675e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="28" y="448" width="664" height="86" rx="15" fill="#f8efd9" stroke="none"/>
  <text x="48" y="482" font-size="26" font-weight="750" fill="#76561d" text-anchor="start">여덟째 날</text>
  <text x="48" y="514" font-size="22" font-weight="500" fill="#24342f" text-anchor="start">회막 입구에서 형편에 따라 예물을 드림 · 10–32절</text>
  <path d="M28 541H692" fill="none" stroke="#c2c7be" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="28" y="575" font-size="22" font-weight="650" fill="#24342f" text-anchor="start">레위기 14:1–32</text>
  </g>
</svg>
