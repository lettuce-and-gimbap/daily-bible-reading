<svg xmlns="http://www.w3.org/2000/svg" width="720" height="545" viewBox="0 0 720 545" role="img" aria-labelledby="title caption" xml:lang="ko">
  <title id="title">안식일과 여호와의 절기</title>
  <desc id="caption">레위기 23:1–44에 근거한 안식일과 여호와의 절기 도식</desc>
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <rect x="0" y="0" width="720" height="545" rx="0" fill="#fcfaf4" stroke="none"/>
  <rect x="28" y="28" width="8" height="40" rx="4" fill="#21675e" stroke="none"/>
  <text x="50" y="61" font-size="39" font-weight="780" fill="#24342f" text-anchor="start">안식일과 여호와의 절기</text>
  <rect x="28" y="84" width="664" height="82" rx="15" fill="#e8f3ee" stroke="none"/>
  <text x="48" y="118" font-size="26" font-weight="750" fill="#21675e" text-anchor="start">매주 · 안식일</text>
  <text x="48" y="150" font-size="22" font-weight="500" fill="#24342f" text-anchor="start">일곱째 날에는 일을 쉬고 성회로 모임 · 3절</text>
  <rect x="28" y="181" width="328" height="138" rx="15" fill="#f8efd9" stroke="none"/>
  <text x="48" y="215" font-size="26" font-weight="750" fill="#76561d" text-anchor="start">첫째 달</text>
  <text x="48" y="247" font-size="22" font-weight="500" fill="#24342f" text-anchor="start">14일 저녁 · 유월절</text>
  <text x="48" y="278" font-size="22" font-weight="500" fill="#24342f" text-anchor="start">15일부터 7일 · 무교절</text>
  <rect x="364" y="181" width="328" height="138" rx="15" fill="#e8f3ee" stroke="none"/>
  <text x="384" y="215" font-size="26" font-weight="750" fill="#21675e" text-anchor="start">곡식 수확</text>
  <text x="384" y="247" font-size="22" font-weight="500" fill="#24342f" text-anchor="start">첫 이삭 한 단을 흔들어 바침</text>
  <text x="384" y="278" font-size="22" font-weight="500" fill="#24342f" text-anchor="start">50일째 · 새 소제</text>
  <rect x="28" y="331" width="328" height="138" rx="15" fill="#f8ebe6" stroke="none"/>
  <text x="48" y="365" font-size="26" font-weight="750" fill="#923f31" text-anchor="start">일곱째 달</text>
  <text x="48" y="397" font-size="22" font-weight="500" fill="#24342f" text-anchor="start">1일 · 나팔을 불어 기념</text>
  <text x="48" y="428" font-size="22" font-weight="500" fill="#24342f" text-anchor="start">10일 · 속죄일</text>
  <rect x="364" y="331" width="328" height="138" rx="15" fill="#f8ebe6" stroke="none"/>
  <text x="384" y="365" font-size="26" font-weight="750" fill="#923f31" text-anchor="start">일곱째 달</text>
  <text x="384" y="397" font-size="22" font-weight="500" fill="#24342f" text-anchor="start">15일부터 7일 · 초막절</text>
  <text x="384" y="428" font-size="22" font-weight="500" fill="#24342f" text-anchor="start">여덟째 날에도 성회</text>
  <path d="M28 487H692" fill="none" stroke="#c2c7be" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="28" y="521" font-size="22" font-weight="650" fill="#24342f" text-anchor="start">레위기 23:1–44</text>
  </g>
</svg>
