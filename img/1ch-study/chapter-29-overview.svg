<title id="title">역대상 29장 · 헌물과 솔로몬의 즉위</title>
<desc id="description">주요 장소 예루살렘·헤브론. 본문의 흐름 1–9절 다윗과 지도자들이 자원해 바침 / 10–19절 다윗이 회중 앞에서 하나님을 찬송함 / 20–25절 회중이 제사하고 솔로몬을 왕으로 세움 / 26–30절 다윗의 통치와 죽음을 기록함. 주요 기물과 표지 금·은·놋·철·보석·기름·제물(2–8, 21–22절). </desc>
