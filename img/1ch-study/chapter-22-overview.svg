<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대상 22장 · 성전 자재와 솔로몬의 임무</title>
<desc id="description">주요 장소 성전 터·두로·시돈. 본문의 흐름 1절 다윗이 제단과 성전 자리를 밝힘 / 2–5절 석수와 여러 재료를 준비함 / 6–16절 솔로몬에게 성전 건축을 맡김 / 17–19절 지도자들에게 솔로몬을 돕게 함. 주요 기물과 표지 다듬은 돌·철 못·놋·백향목·은금(2–4, 14절). </desc>
