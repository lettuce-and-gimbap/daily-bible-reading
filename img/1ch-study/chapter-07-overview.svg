<desc id="description">주요 장소 가드·벧호론·벧엘·세겜. 본문의 흐름 1–12절 잇사갈과 베냐민의 계보 / 13–19절 납달리와 므낫세의 계보 / 20–29절 에브라임의 상실과 후손의 거주지 / 30–40절 아셀의 자손과 군인 명단. 주요 기물과 표지 가드 사람의 가축(21절). 가드의 정확한 지점은 이 장에서 특정하지 않음.</desc>
