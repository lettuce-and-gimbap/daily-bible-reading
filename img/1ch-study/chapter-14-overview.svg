<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대상 14장 · 왕궁 건축과 블레셋과의 두 전투</title>
<desc id="description">주요 장소 예루살렘·르바임 골짜기·바알브라심·기브온에서 게셀까지. 본문의 흐름 1–2절 히람이 재목과 일꾼을 보냄 / 3–7절 예루살렘에서 다윗의 자녀가 태어남 / 8–12절 첫 전투 뒤 블레셋 우상을 불태움 / 13–17절 나무 위 소리를 신호로 두 번째로 공격함. 주요 기물과 표지 백향목·블레셋의 우상(1, 12절). 14–15절의 나무 이름과 실제 수종은 구분해 읽을 필요가 있음.</desc>
