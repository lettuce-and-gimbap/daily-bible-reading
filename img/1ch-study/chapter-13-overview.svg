<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대상 13장 · 기럇여아림에서 떠난 언약궤</title>
<desc id="description">주요 장소 기럇여아림·아비나답의 집·기돈의 타작마당·오벧에돔의 집. 본문의 흐름 1–4절 다윗이 백성과 궤 운반을 의논함 / 5–8절 궤를 새 수레에 싣고 출발함 / 9–12절 타작마당에서 궤를 붙든 웃사가 죽음 / 13–14절 궤가 오벧에돔 집에 석 달 머묾. 주요 기물과 표지 언약궤·새 수레·수금·비파·나팔(6–8절). 기돈 타작마당과 오벧에돔 집의 좌표는 제시하지 않음.</desc>
