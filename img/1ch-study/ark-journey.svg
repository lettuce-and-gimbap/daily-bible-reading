<svg xmlns="http://www.w3.org/2000/svg" width="820" height="355" viewBox="0 0 820 355" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">기럇여아림에서 다윗성까지</title>
<desc id="description">언약궤의 이동 · 역대상 13:5–14, 15:12–29, 16:1. 기럇여아림 새 수레로 출발. 오벧에돔의 집 석 달 동안 머묾. 다윗성의 장막 레위인이 채로 메어 옮김. 첫 이동 때 기돈의 타작마당에서 웃사가 죽었어요(13:9–10).. 장소 상자는 이동 순서를 나타내며 거리와 방향에는 축척이 없어요.</desc>
<rect x="0" y="0" width="820" height="355" rx="20" fill="#f6f3ea"/>
<text x="36" y="43" font-size="18" fill="#8a422c" font-weight="700" text-anchor="start">언약궤의 이동 · 역대상 13:5–14, 15:12–29, 16:1</text>
<text x="36" y="85" font-size="32" fill="#182c37" font-weight="700" text-anchor="start">기럇여아림에서 다윗성까지</text>
