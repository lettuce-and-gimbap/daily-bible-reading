<text x="668" y="195" font-size="23" fill="#182c37" font-weight="700" text-anchor="middle">다윗성의 장막</text>
<text x="668" y="228" font-size="17" fill="#8a422c" font-weight="400" text-anchor="middle">레위인이 채로 메어 옮김</text>
<text x="40" y="288" font-size="17" fill="#415560" font-weight="400" text-anchor="start">첫 이동 때 기돈의 타작마당에서 웃사가 죽었어요(13:9–10).</text>
