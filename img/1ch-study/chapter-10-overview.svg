<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대상 10장 · 길보아에서 사울의 통치가 끝나다</title>
<desc id="description">주요 장소 길보아산·다곤 신전·길르앗 야베스. 본문의 흐름 1–6절 길보아 전투에서 사울과 아들들이 죽음 / 7–10절 블레셋이 갑옷과 머리를 가져감 / 11–12절 야베스 사람들이 시신을 거두어 장사함 / 13–14절 사울의 죽음과 다윗에게 넘어간 나라. 주요 기물과 표지 활·칼·갑옷(3–10절). </desc>
