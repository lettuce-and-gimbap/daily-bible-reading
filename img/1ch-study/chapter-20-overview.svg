<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대상 20장 · 랍바의 왕관과 블레셋 전투</title>
<desc id="description">주요 장소 랍바·게셀·가드. 본문의 흐름 1–3절 랍바에서 왕관과 전리품을 가져옴 / 4–5절 십브개와 엘하난이 블레셋 용사들을 물리침 / 6–8절 가드에서 요나단이 거인을 물리침. 주요 기물과 표지 금 왕관과 보석·철제 도구·베틀채 같은 창 자루(2–5절). 본문은 3절의 철제 도구가 사용된 방식을 상세히 설명하지 않음.</desc>
