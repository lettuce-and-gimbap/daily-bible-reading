<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대상 15장 · 레위인이 궤를 메고 오다</title>
<desc id="description">주요 장소 오벧에돔의 집·다윗성. 본문의 흐름 1–15절 레위인이 규례에 따라 궤를 멜 준비를 함 / 16–24절 찬양대와 문지기를 편성함 / 25–28절 제사를 드리며 다윗성으로 궤를 옮김 / 29절 미갈이 창에서 다윗을 보고 업신여김. 주요 기물과 표지 언약궤·채·수금·비파·제금·나팔·세마포 옷(15–28절). </desc>
