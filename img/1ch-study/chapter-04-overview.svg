<desc id="description">주요 장소 모압·그돌 어귀·세일산. 본문의 흐름 1–8절 유다의 여러 집안 / 9–10절 야베스의 기도 / 11–23절 직업과 거처가 기록된 집안들 / 24–43절 시므온의 계보와 목초지 확보. 주요 기물과 표지 세마포·토기(21–23절). 그돌 어귀의 현대 위치는 확정하기 어려움.</desc>
