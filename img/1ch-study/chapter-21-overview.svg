<title id="title">역대상 21장 · 인구 조사와 오르난의 타작마당</title>
<desc id="description">주요 장소 브엘세바에서 단까지·예루살렘·오르난의 타작마당·기브온. 본문의 흐름 1–6절 요압이 인구를 조사함 / 7–13절 갓이 세 가지 재앙의 선택을 전함 / 14–17절 예루살렘에서 천사가 멈추고 다윗이 간구함 / 18–30절 다윗이 타작마당을 사서 제단을 쌓음. 주요 기물과 표지 천사의 칼·금·소·타작 도구·밀·제단(16–26절). </desc>
