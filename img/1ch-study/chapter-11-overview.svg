<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대상 11장 · 다윗의 즉위와 용사들</title>
<desc id="description">주요 장소 헤브론·시온 산성·베들레헴 성문. 본문의 흐름 1–3절 헤브론에서 다윗을 왕으로 세움 / 4–9절 시온 산성을 점령해 다윗성으로 삼음 / 10–19절 세 용사가 떠 온 우물물을 하나님께 부음 / 20–47절 아비새와 브나야 및 다른 용사들. 주요 기물과 표지 기름·창·우물물(3, 11, 17–19절). </desc>
