<title id="title">역대상 17장 · 다윗의 성전 계획과 왕조 약속</title>
<desc id="description">주요 장소 다윗의 궁·언약궤가 있는 장막. 본문의 흐름 1–2절 다윗이 궤를 위한 집을 생각함 / 3–15절 나단을 통해 후손과 왕위의 약속을 받음 / 16–27절 다윗이 약속에 감사하며 기도함. 주요 기물과 표지 백향목·장막 휘장·왕좌(1, 12절). </desc>
