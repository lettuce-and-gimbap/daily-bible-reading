<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 22장 · 아하시야의 죽음과 숨겨진 요아스</title>
<desc id="description">주요 장소 길르앗 라못·이스르엘·사마리아·예루살렘 성전. 본문의 흐름 1–4절 아하시야가 아합 집안의 영향을 받음 / 5–6절 요람과 출전하고 부상한 요람을 방문함 / 7–9절 예후의 심판 때 아하시야가 죽음 / 10–12절 아달랴를 피해 요아스가 성전에 숨음. 주요 기물과 표지 요아스와 유모가 몸을 숨긴 침실(11절). 2절의 즉위 나이는 열왕기하 8:26과 차이가 있어 생략함.</desc>
