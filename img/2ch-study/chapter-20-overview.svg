<svg xmlns="http://www.w3.org/2000/svg" width="820" height="644" viewBox="0 0 820 644" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 20장 · 연합군 앞의 기도와 찬양</title>
<desc id="description">주요 장소 엔게디·시스 고개·드고아 들·브라가 골짜기·에시온게벨. 본문의 흐름 1–4절 연합군 소식에 유다가 금식하고 모임 / 5–13절 여호사밧이 성전 앞에서 간구함 / 14–19절 야하시엘이 하나님의 말씀으로 회중을 격려함 / 20–30절 찬양대를 앞세워 나가고 승리 후 돌아옴 / 31–37절 여호사밧의 통치와 실패한 선단을 기록함. 주요 기물과 표지 전리품·비파·수금·나팔·부서진 배(25, 28, 36–37절). </desc>
