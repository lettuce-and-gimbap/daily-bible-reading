<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 28장 · 아하스의 패배와 돌아온 포로들</title>
<desc id="description">주요 장소 힌놈 골짜기·사마리아·여리고·예루살렘. 본문의 흐름 1–4절 아하스가 우상 제사를 행함 / 5–8절 아람과 이스라엘이 유다를 치고 포로를 잡음 / 9–15절 오뎃의 말에 포로를 돌보아 여리고로 돌려보냄 / 16–27절 아하스가 앗수르에 도움을 구하고 성전 문을 닫음. 주요 기물과 표지 바알 주상·옷·신·기름·나귀·성전 기구(2, 15, 24절). </desc>
