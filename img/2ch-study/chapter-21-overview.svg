<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 21장 · 여호람과 에돔의 반란</title>
<desc id="description">주요 장소 에돔·립나·유다 산지·다윗성. 본문의 흐름 1–7절 여호람이 형제들을 죽이고 왕권을 굳힘 / 8–11절 에돔과 립나가 이탈하고 산당이 세워짐 / 12–15절 엘리야의 편지가 심판을 예고함 / 16–20절 침공과 질병 뒤 여호람이 죽음. 주요 기물과 표지 칼·병거·엘리야의 편지(4, 9, 12절). </desc>
