<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 34장 · 율법책을 발견하고 언약을 갱신하다</title>
<desc id="description">주요 장소 예루살렘 성전·둘째 구역·므낫세에서 납달리까지. 본문의 흐름 1–7절 요시야가 하나님을 찾고 우상을 없앰 / 8–18절 성전을 수리할 때 힐기야가 율법책을 찾음 / 19–28절 훌다가 심판과 요시야에 대한 말씀을 전함 / 29–33절 왕이 책을 읽고 백성과 언약을 새로 세움. 주요 기물과 표지 우상과 제단·수리비·율법책·찢은 왕의 옷(4, 9, 14, 19절). </desc>
<rect x="0" y="0" width="820" height="562" rx="22" fill="#f6f3ea"/>
<rect x="26" y="25" width="6" height="95" rx="3" fill="#634078"/>
