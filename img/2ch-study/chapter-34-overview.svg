<text x="111" y="268" font-size="16" fill="#634078" font-weight="700" text-anchor="start">8–18절</text>
<text x="111" y="293" font-size="19" fill="#182c37" font-weight="400" text-anchor="start">성전을 수리할 때 힐기야가 율법책을 찾음</text>
