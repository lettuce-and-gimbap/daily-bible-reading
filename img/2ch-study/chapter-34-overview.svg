<text x="111" y="350" font-size="16" fill="#634078" font-weight="700" text-anchor="start">19–28절</text>
<text x="111" y="375" font-size="19" fill="#182c37" font-weight="400" text-anchor="start">훌다가 심판과 요시야에 대한 말씀을 전함</text>
