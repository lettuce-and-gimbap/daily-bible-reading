<text x="47" y="106" font-size="34" fill="#182c37" font-weight="700" text-anchor="start">율법책을 발견하고 언약을 갱신하다</text>
<rect x="720" y="33" width="62" height="62" rx="14" fill="#eee5f3"/>
<path d="M11 6h27a4 4 0 0 1 0 8H17v24a5 5 0 0 1-10 0V14m5-8a4 4 0 1 0 0 8h5m0 24h25m-20-17h14m-14 7h14" transform="translate(732 45) scale(0.8)" fill="none" stroke="#634078" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="42" y="151" font-size="18" fill="#634078" font-weight="700" text-anchor="start">본문의 흐름</text>
<rect x="548" y="162" width="236" height="136" rx="13" fill="#eee5f3"/>
<text x="564" y="189" font-size="17" fill="#634078" font-weight="700" text-anchor="start">주요 장소</text>
<text x="564" y="217" font-size="18" fill="#182c37" font-weight="400" text-anchor="start">예루살렘 성전 · 둘째</text>
<text x="564" y="240" font-size="18" fill="#182c37" font-weight="400" text-anchor="start">구역 · 므낫세에서</text>
<text x="564" y="263" font-size="18" fill="#182c37" font-weight="400" text-anchor="start">납달리까지</text>
<rect x="548" y="313" width="236" height="136" rx="13" fill="#eee5f3"/>
<text x="564" y="340" font-size="17" fill="#634078" font-weight="700" text-anchor="start">주요 기물과 표지</text>
<text x="564" y="368" font-size="18" fill="#182c37" font-weight="400" text-anchor="start">우상과 제단 · 수리비</text>
<text x="564" y="391" font-size="18" fill="#182c37" font-weight="400" text-anchor="start">· 율법책 · 찢은 왕의</text>
<text x="564" y="414" font-size="18" fill="#182c37" font-weight="400" text-anchor="start">옷(4, 9, 14, 19절)</text>
<path d="M71 236v8m-4-5 4 4 4-4" fill="none" stroke="#634078" stroke-width="2"/>
<rect x="36" y="162" width="494" height="74" rx="12" fill="#fffdf8"/>
