<text x="111" y="432" font-size="16" fill="#634078" font-weight="700" text-anchor="start">29–33절</text>
<text x="111" y="457" font-size="19" fill="#182c37" font-weight="400" text-anchor="start">왕이 책을 읽고 백성과 언약을 새로 세움</text>
<text x="40" y="518" font-size="17" fill="#415560" font-weight="400" text-anchor="start">장면과 기물은 본문을 따라 기호로 표시했어요.</text>
