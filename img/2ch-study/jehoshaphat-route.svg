<svg xmlns="http://www.w3.org/2000/svg" width="820" height="355" viewBox="0 0 820 355" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">회중의 기도와 찬양대의 행렬</title>
<desc id="description">여호사밧과 유다 회중 · 역대하 20:5–30. 성전 앞 새 뜰 왕이 회중 앞에서 간구함. 드고아 들 찬양대를 앞세워 나아감. 브라가 골짜기 하나님을 송축하고 돌아감. 회중은 비파·수금·나팔을 연주하며 예루살렘 성전으로 돌아왔어요(20:27–28).. 장소 상자는 본문의 순서를 나타내며 거리와 방향에는 축척이 없어요.</desc>
<rect x="0" y="0" width="820" height="355" rx="20" fill="#f6f3ea"/>
<text x="36" y="43" font-size="18" fill="#8a422c" font-weight="700" text-anchor="start">여호사밧과 유다 회중 · 역대하 20:5–30</text>
<text x="36" y="85" font-size="32" fill="#182c37" font-weight="700" text-anchor="start">회중의 기도와 찬양대의 행렬</text>
<rect x="42" y="113" width="220" height="142" rx="15" fill="#f6e6da"/>
<path d="M4 15 24 4l20 11v5H4v-5m4 9v12m11-12v12m10-12v12m11-12v12M4 41h40" transform="translate(132 126) scale(0.85)" fill="none" stroke="#8a422c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="152" y="195" font-size="23" fill="#182c37" font-weight="700" text-anchor="middle">성전 앞 새 뜰</text>
<text x="152" y="228" font-size="17" fill="#8a422c" font-weight="400" text-anchor="middle">왕이 회중 앞에서 간구함</text>
<path d="M268 180h24m-6-5 6 5-6 5" fill="none" stroke="#8a422c" stroke-width="2"/>
<rect x="300" y="113" width="220" height="142" rx="15" fill="#f6e6da"/>
<path d="M15 35V12l24-6v25M15 19l24-6M15 35c0 6-12 8-12 2s12-8 12-2zm24-4c0 6-12 8-12 2s12-8 12-2z" transform="translate(390 126) scale(0.85)" fill="none" stroke="#8a422c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="410" y="195" font-size="23" fill="#182c37" font-weight="700" text-anchor="middle">드고아 들</text>
<text x="410" y="228" font-size="17" fill="#8a422c" font-weight="400" text-anchor="middle">찬양대를 앞세워 나아감</text>
<path d="M526 180h24m-6-5 6 5-6 5" fill="none" stroke="#8a422c" stroke-width="2"/>
<rect x="558" y="113" width="220" height="142" rx="15" fill="#f6e6da"/>
<path d="M10 12h17a7 7 0 0 1 0 14h-6a6 6 0 0 0 0 12h16m-5-5 5 5-5 5M10 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" transform="translate(648 126) scale(0.85)" fill="none" stroke="#8a422c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="668" y="195" font-size="23" fill="#182c37" font-weight="700" text-anchor="middle">브라가 골짜기</text>
<text x="668" y="228" font-size="17" fill="#8a422c" font-weight="400" text-anchor="middle">하나님을 송축하고 돌아감</text>
<text x="40" y="288" font-size="17" fill="#415560" font-weight="400" text-anchor="start">회중은 비파·수금·나팔을 연주하며 예루살렘 성전으로 돌아왔어요(20:27–28).</text>
<text x="40" y="312" font-size="17" fill="#415560" font-weight="400" text-anchor="start">장소 상자는 본문의 순서를 나타내며 거리와 방향에는 축척이 없어요.</text>
</svg>
