<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 19장 · 여호사밧이 세운 재판 제도</title>
<desc id="description">주요 장소 브엘세바에서 에브라임 산지까지·유다 요새·예루살렘. 본문의 흐름 1–3절 예후가 여호사밧의 동맹을 책망함 / 4절 왕이 여러 지역에서 백성을 하나님께 돌이킴 / 5–7절 요새마다 재판관을 세움 / 8–11절 예루살렘의 재판과 책임을 정함. 주요 기물과 표지 별도 기물 기록 없음. </desc>
