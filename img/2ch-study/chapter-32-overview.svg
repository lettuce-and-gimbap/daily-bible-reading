<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 32장 · 산헤립의 침공과 히스기야의 대응</title>
<desc id="description">주요 장소 예루살렘·라기스·기혼 윗샘. 본문의 흐름 1–8절 히스기야가 성벽을 보강하고 물을 막음 / 9–19절 라기스에 있던 산헤립이 사절과 편지로 위협함 / 20–23절 히스기야와 이사야의 기도 뒤 앗수르 군대가 물러남 / 24–33절 히스기야의 병·겸손·치적과 죽음을 기록함. 주요 기물과 표지 성벽·무기와 방패·산헤립의 편지·보물(5, 17, 27절). 이 장은 물길의 전체 경로와 공사 방법을 상세히 밝히지 않음.</desc>
