<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 8장 · 솔로몬의 성읍과 교역</title>
<desc id="description">주요 장소 하맛소바·다드몰·벧호론·에시온게벨·엘롯·오빌. 본문의 흐름 1–6절 성읍과 저장 시설을 건축함 / 7–10절 노역 인원과 이스라엘 관리의 역할을 구분함 / 11절 바로의 딸을 위해 지은 집으로 옮김 / 12–18절 제사 직무를 갖추고 오빌에서 금을 가져옴. 주요 기물과 표지 성벽·문·빗장·제물·배·금(5, 12–13, 18절). 다드몰과 오빌의 정확한 위치는 도해에서 특정하지 않음.</desc>
