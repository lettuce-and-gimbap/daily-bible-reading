<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 4장 · 놋 바다와 성전 기물</title>
<desc id="description">주요 장소 제사장의 뜰·큰 뜰·숙곳과 스레다 사이. 본문의 흐름 1–6절 놋 제단과 바다, 물두멍을 만듦 / 7–10절 등잔대와 상을 들이고 뜰을 만듦 / 11–18절 후람의 놋 기물을 주조함 / 19–22절 금 제단과 여러 금 기물을 갖춤. 주요 기물과 표지 놋 제단·놋 바다와 열두 소·물두멍·등잔대·상(1–10절). 놋 바다의 치수는 이 장의 기록을 따르며, 열왕기상과 용량 표기가 다름.</desc>
