<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 17장 · 율법을 가르친 여호사밧의 사절</title>
<desc id="description">주요 장소 유다 여러 성읍·에브라임 성읍·예루살렘. 본문의 흐름 1–6절 여호사밧이 수비대를 두고 하나님을 찾음 / 7–9절 관리와 레위인과 제사장이 율법을 가르침 / 10–13절 이웃 나라에서 조공이 들어옴 / 14–19절 왕을 섬기는 군 지휘관과 군대를 기록함. 주요 기물과 표지 율법책·은·숫양과 숫염소·병기(9, 11, 17절). </desc>
