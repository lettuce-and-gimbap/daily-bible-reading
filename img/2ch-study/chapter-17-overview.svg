<text x="111" y="457" font-size="19" fill="#182c37" font-weight="400" text-anchor="start">왕을 섬기는 군 지휘관과 군대를 기록함</text>
<text x="40" y="518" font-size="17" fill="#415560" font-weight="400" text-anchor="start">장면과 기물은 본문을 따라 기호로 표시했어요.</text>
