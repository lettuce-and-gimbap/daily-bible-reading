<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 31장 · 헌물과 성전 곳간의 운영</title>
<desc id="description">주요 장소 예루살렘 성전 곳간·유다와 이스라엘 성읍. 본문의 흐름 1절 절기를 마친 백성이 우상 시설을 철거함 / 2–4절 제사장과 레위인의 반열과 몫을 정함 / 5–10절 백성이 첫 열매와 십일조를 모음 / 11–21절 곳간을 준비하고 담당자를 세워 나눔. 주요 기물과 표지 주상·아세라 목상·첫 열매·십일조·곳간(1, 5–12절). </desc>
