<svg xmlns="http://www.w3.org/2000/svg" width="820" height="492" viewBox="0 0 820 492" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 1장 · 기브온에서 지혜를 구한 솔로몬</title>
<desc id="description">주요 장소 기브온 산당·예루살렘·애굽. 본문의 흐름 1–6절 기브온에서 번제를 드림 / 7–12절 솔로몬이 지혜와 지식을 구하고 응답을 받음 / 13–17절 병거와 말이 늘고 교역이 이루어짐. 주요 기물과 표지 모세의 회막·놋 제단·언약궤·병거와 말(3–6, 14–17절). </desc>
