<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 3장 · 모리아산의 성전과 두 기둥</title>
<desc id="description">주요 장소 예루살렘 모리아산·현관·큰 전·지성소. 본문의 흐름 1–2절 오르난의 타작마당이 있던 곳에서 공사를 시작함 / 3–9절 성전 주요 공간을 짓고 금으로 입힘 / 8–14절 지성소에 두 그룹을 세우고 휘장을 만듦 / 15–17절 성전 앞 두 기둥에 이름을 붙임. 주요 기물과 표지 금 입힌 두 그룹·휘장·야긴과 보아스(10–17절). 기둥 높이와 세부 배치는 평행 본문과 함께 비교할 필요가 있음.</desc>
