<svg xmlns="http://www.w3.org/2000/svg" width="820" height="644" viewBox="0 0 820 644" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 36장 · 예루살렘의 멸망과 고레스의 선포</title>
<desc id="description">주요 장소 예루살렘·애굽·바벨론·바사. 본문의 흐름 1–4절 애굽 왕이 여호아하스를 폐위하고 여호야김을 세움 / 5–10절 느부갓네살이 왕들을 제압하고 기물을 가져감 / 11–16절 시드기야와 백성이 경고를 거부함 / 17–21절 성전과 성벽이 무너지고 생존자가 사로잡혀 감 / 22–23절 고레스가 예루살렘 성전 재건을 선포함. 주요 기물과 표지 은금 공물·쇠사슬·성전 기물·고레스의 조서(3, 6–7, 18, 22절). 고레스 원통 비문과 이 장의 예루살렘 재건 조서는 구분해 읽을 필요가 있음.</desc>
