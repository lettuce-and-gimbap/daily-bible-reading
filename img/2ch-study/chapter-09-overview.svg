<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 9장 · 스바 여왕의 방문과 왕실의 부</title>
<desc id="description">주요 장소 스바·예루살렘·오빌·다시스·다윗성. 본문의 흐름 1–4절 스바 여왕이 어려운 질문을 가져옴 / 5–12절 솔로몬의 지혜를 확인하고 예물을 교환함 / 13–28절 금과 상아 및 교역으로 얻은 부를 기록함 / 29–31절 솔로몬이 죽고 르호보암이 뒤를 이음. 주요 기물과 표지 향품·보석·상아 왕좌·금 방패·병거(9, 15–19, 25절). 스바·오빌·다시스의 현대 위치를 도해에서 특정하지 않음.</desc>
