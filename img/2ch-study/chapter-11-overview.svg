<text x="564" y="391" font-size="18" fill="#182c37" font-weight="400" text-anchor="start">· 방패 · 창 · 송아지</text>
<text x="564" y="414" font-size="18" fill="#182c37" font-weight="400" text-anchor="start">우상(11–15절)</text>
