<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 11장 · 유다의 요새와 예루살렘으로 온 레위인</title>
<desc id="description">주요 장소 예루살렘·베들레헴·드고아·라기스 등 유다 요새. 본문의 흐름 1–4절 스마야의 말로 동족과 싸우려던 군대가 돌아감 / 5–12절 르호보암이 요새를 보강함 / 13–17절 제사장과 레위인 등이 유다로 옴 / 18–23절 르호보암이 가족과 아들들의 배치를 정함. 주요 기물과 표지 곡식·기름·포도주·방패·창·송아지 우상(11–15절). </desc>
