<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 7장 · 봉헌의 불과 하나님의 응답</title>
<desc id="description">주요 장소 예루살렘 성전·하맛 어귀에서 애굽 시내까지. 본문의 흐름 1–3절 불이 제물을 사르고 영광이 성전에 가득함 / 4–10절 회중이 제사와 절기를 지킴 / 11–16절 하나님이 기도와 돌이킴에 응답하겠다고 하심 / 17–22절 왕과 백성이 다른 신을 섬길 경우를 경고하심. 주요 기물과 표지 번제물·화목제물·다윗의 악기(1, 5–7절). </desc>
