<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 18장 · 미가야의 예언과 아합의 마지막 전투</title>
<desc id="description">주요 장소 사마리아 성문·길르앗 라못. 본문의 흐름 1–3절 아합이 여호사밧에게 출전을 청함 / 4–27절 미가야가 다른 선지자들과 달리 패배를 예고함 / 28–32절 여호사밧이 공격을 받다가 구출됨 / 33–34절 아합이 화살에 맞아 병거에서 죽음. 주요 기물과 표지 쇠 뿔·옥의 떡과 물·왕복·갑옷·활·병거(10, 26, 29–34절). </desc>
