<text x="564" y="340" font-size="18" fill="#182c37" font-weight="400" text-anchor="start">쇠 뿔 · 옥의 떡과 물</text>
<text x="564" y="363" font-size="18" fill="#182c37" font-weight="400" text-anchor="start">· 왕복 · 갑옷 · 활 ·</text>
<text x="564" y="386" font-size="18" fill="#182c37" font-weight="400" text-anchor="start">병거(10, 26,</text>
<text x="564" y="409" font-size="18" fill="#182c37" font-weight="400" text-anchor="start">29–34절)</text>
