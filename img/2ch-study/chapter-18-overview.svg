<text x="111" y="432" font-size="16" fill="#8a422c" font-weight="700" text-anchor="start">33–34절</text>
<text x="111" y="457" font-size="19" fill="#182c37" font-weight="400" text-anchor="start">아합이 화살에 맞아 병거에서 죽음</text>
<text x="40" y="518" font-size="17" fill="#415560" font-weight="400" text-anchor="start">장면과 기물은 본문을 따라 기호로 표시했어요.</text>
