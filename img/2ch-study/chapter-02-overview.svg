<title id="title">역대하 2장 · 두로와 성전 자재를 준비하다</title>
<desc id="description">주요 장소 두로·레바논·욥바·예루살렘. 본문의 흐름 1–2절 성전과 왕궁을 지을 일꾼을 준비함 / 3–10절 후람에게 장인과 목재를 요청함 / 11–16절 후람이 장인과 목재 운송을 약속함 / 17–18절 운반·채석·감독 인원을 배정함. 주요 기물과 표지 편지·목재·뗏목·밀·보리·포도주·기름(3–16절). </desc>
