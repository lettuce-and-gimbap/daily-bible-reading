<text x="564" y="368" font-size="18" fill="#182c37" font-weight="400" text-anchor="start">은 백 달란트 · 세일의</text>
<text x="564" y="391" font-size="18" fill="#182c37" font-weight="400" text-anchor="start">신상 · 성전과 궁의</text>
