<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 25장 · 에돔에서의 승리와 벧세메스에서의 패배</title>
<desc id="description">주요 장소 소금 골짜기·세일·벧세메스·예루살렘·라기스. 본문의 흐름 1–10절 아마샤가 고용한 이스라엘 군인을 돌려보냄 / 11–13절 세일 군대를 이기고 돌아옴 / 14–16절 에돔의 신상에 제사해 책망을 받음 / 17–28절 이스라엘에 패해 예루살렘 성벽이 무너짐. 주요 기물과 표지 은 백 달란트·세일의 신상·성전과 궁의 보물(6, 14, 24절). </desc>
