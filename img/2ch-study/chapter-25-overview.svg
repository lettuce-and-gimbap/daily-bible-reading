<text x="111" y="432" font-size="16" fill="#8a422c" font-weight="700" text-anchor="start">17–28절</text>
<text x="111" y="457" font-size="19" fill="#182c37" font-weight="400" text-anchor="start">이스라엘에 패해 예루살렘 성벽이 무너짐</text>
