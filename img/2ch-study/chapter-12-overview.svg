<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 12장 · 시삭의 침공과 놋 방패</title>
<desc id="description">주요 장소 애굽·유다의 요새·예루살렘. 본문의 흐름 1절 르호보암과 백성이 율법을 버림 / 2–4절 시삭이 유다 요새를 점령함 / 5–8절 왕과 지도자들이 스마야의 말에 자신을 낮춤 / 9–16절 보물을 빼앗겨 놋 방패를 새로 만듦. 주요 기물과 표지 병거·성전과 왕궁의 보물·금 방패와 놋 방패(3, 9–11절). </desc>
