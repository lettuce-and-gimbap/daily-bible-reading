<title id="title">역대하 23장 · 요아스의 즉위와 아달랴의 몰락</title>
<desc id="description">주요 장소 예루살렘 성전·말문 입구·바알 신당·왕궁. 본문의 흐름 1–7절 여호야다가 성전에서 왕을 세우기로 언약함 / 8–11절 요아스에게 왕관과 율법책을 줌 / 12–15절 아달랴가 성전 밖으로 끌려가 죽음 / 16–21절 바알 신당을 헐고 성전 직무를 정비함. 주요 기물과 표지 다윗의 창과 방패·왕관·율법책·나팔(9, 11, 13절). </desc>
