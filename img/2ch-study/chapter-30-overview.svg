<title id="title">역대하 30장 · 예루살렘에 모여 지킨 유월절</title>
<desc id="description">주요 장소 브엘세바에서 단까지·예루살렘·기드론 시내. 본문의 흐름 1–9절 왕이 유다와 이스라엘에 편지를 보냄 / 10–12절 순회 사절을 조롱하거나 초청을 받아들임 / 13–22절 절기를 지키고 히스기야가 회중을 위해 기도함 / 23–27절 절기를 연장하고 제사장들이 축복함. 주요 기물과 표지 초청 편지·철거한 제단·유월절 제물·무교병(1, 14–17, 21절). </desc>
