<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 16장 · 아사의 아람 동맹과 하나니의 책망</title>
<desc id="description">주요 장소 라마·다메섹·게바·미스바·다윗성. 본문의 흐름 1–6절 아람과 동맹해 라마 건축을 중단시킴 / 7–9절 하나니가 아람을 의지한 아사를 책망함 / 10절 아사가 선견자를 옥에 가둠 / 11–14절 발에 병이 든 아사가 죽고 장사됨. 주요 기물과 표지 성전과 왕궁의 은금·돌과 목재·향품(2, 6, 14절). </desc>
