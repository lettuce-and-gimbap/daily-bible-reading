<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 35장 · 요시야의 유월절과 므깃도 전투</title>
<desc id="description">주요 장소 예루살렘 성전·므깃도 골짜기·갈그미스. 본문의 흐름 1–6절 제사장과 레위인이 유월절을 준비함 / 7–15절 왕과 지도자가 제물을 내고 직무를 수행함 / 16–19절 회중이 유월절과 무교절을 지킴 / 20–27절 느고를 막다가 부상한 요시야가 죽음. 주요 기물과 표지 언약궤·유월절 제물·병거·화살(3, 7–9, 23–24절). </desc>
