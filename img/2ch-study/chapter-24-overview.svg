<svg xmlns="http://www.w3.org/2000/svg" width="820" height="562" viewBox="0 0 820 562" xml:lang="ko" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">역대하 24장 · 성전 수리와 요아스의 변절</title>
<desc id="description">주요 장소 예루살렘 성전 뜰·다윗성·왕들의 묘실. 본문의 흐름 1–14절 헌금 궤를 두고 모은 돈으로 성전을 수리함 / 15–16절 여호야다가 죽어 왕들의 묘실에 묻힘 / 17–22절 백성이 우상을 섬기고 스가랴가 죽임을 당함 / 23–27절 아람이 침공하고 신하들이 요아스를 죽임. 주요 기물과 표지 헌금 궤·은·성전 기구·던진 돌(8–14, 21절). </desc>
