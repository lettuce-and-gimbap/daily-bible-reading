<svg xmlns="http://www.w3.org/2000/svg" width="820" height="594" viewBox="0 0 820 594" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">삼상 30장 · 시글락 구출과 전리품 분배</title><desc id="desc">시글락·브솔 시내·아말렉 진영·유다 성읍들 / 1–8 불탄 시글락에서 다윗이 추격 여부를 물음 → 9–20 애굽 사람의 안내로 사로잡힌 이들을 되찾음 → 21–31 남은 자와도 전리품을 나누고 유다에 보냄 / 에봇·떡과 물·무화과와 건포도·가축 / 마지막 성읍 목록은 개역개정 30–31절, 개역한글 30절에 해당합니다.</desc>
<rect width="820" height="594" rx="20" fill="#f5f3eb"/>
<text x="34" y="36" font-size="19" fill="#27665e" font-weight="700">삼상 30장  ·  본문 도해</text>
<text x="34" y="77" font-size="32" fill="#173039" font-weight="700">시글락 구출과 전리품 분배</text>
<rect x="34" y="100" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="128" font-size="18" fill="#27665e" font-weight="700">주요 장소</text>
<text x="54" y="157" font-size="22" fill="#173039" font-weight="400">시글락·브솔 시내·아말렉 진영·유다 성읍들</text>
<text x="34" y="202" font-size="18" fill="#27665e" font-weight="700">본문의 흐름</text>
<rect x="34" y="215" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="247" font-size="19" fill="#27665e" font-weight="700">1–8절</text>
<text x="158" y="247" font-size="22" fill="#173039" font-weight="400">불탄 시글락에서 다윗이 추격 여부를 물음</text>
<path d="M410 270v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="286" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="318" font-size="19" fill="#27665e" font-weight="700">9–20절</text>
<text x="158" y="318" font-size="22" fill="#173039" font-weight="400">애굽 사람의 안내로 사로잡힌 이들을 되찾음</text>
<path d="M410 341v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="357" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="389" font-size="19" fill="#27665e" font-weight="700">21–31절</text>
<text x="158" y="389" font-size="22" fill="#173039" font-weight="400">남은 자와도 전리품을 나누고 유다에 보냄</text>
<rect x="34" y="426" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="454" font-size="18" fill="#27665e" font-weight="700">주요 기물·표지</text>
<text x="54" y="483" font-size="22" fill="#173039" font-weight="400">에봇·떡과 물·무화과와 건포도·가축</text>
<text x="34" y="522" font-size="18" fill="#6a4d32" font-weight="400">마지막 성읍 목록은 개역개정 30–31절, 개역한글 30절에 해당합니다.</text>
<text x="34" y="550" font-size="17" fill="#526862" font-weight="400">기록 사진은 장의 별도 그림에서 볼 수 있습니다.</text>
<text x="34" y="574" font-size="16" fill="#526862" font-weight="400">개역개정 4판·개역한글 대조 / 호크마 참고 / 지도 축척 없음</text>
</svg>
