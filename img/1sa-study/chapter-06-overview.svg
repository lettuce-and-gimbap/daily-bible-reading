<svg xmlns="http://www.w3.org/2000/svg" width="820" height="618" viewBox="0 0 820 618" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">삼상 6장 · 언약궤가 벧세메스로 돌아오다</title><desc id="desc">블레셋 땅·벧세메스·기럇여아림 / 1–9 배상 예물과 새 수레를 준비함 → 10–18 암소가 벧세메스로 가고 주민들이 제사함 → 19–21 심판을 겪고 궤를 데려가 달라고 청함 / 금 독종과 금 쥐·수레·암소·큰 돌 / 6:19의 사망자 수는 두 번역 모두 괄호가 있는 수를 제시하며 본문 전승에 이견이 있어 도식에 수를 넣지 않았습니다.</desc>
<rect width="820" height="618" rx="20" fill="#f5f3eb"/>
<text x="34" y="36" font-size="19" fill="#27665e" font-weight="700">삼상 6장  ·  본문 도해</text>
<text x="34" y="77" font-size="32" fill="#173039" font-weight="700">언약궤가 벧세메스로 돌아오다</text>
<rect x="34" y="100" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="128" font-size="18" fill="#27665e" font-weight="700">주요 장소</text>
<text x="54" y="157" font-size="22" fill="#173039" font-weight="400">블레셋 땅·벧세메스·기럇여아림</text>
<text x="34" y="202" font-size="18" fill="#27665e" font-weight="700">본문의 흐름</text>
<rect x="34" y="215" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="247" font-size="19" fill="#27665e" font-weight="700">1–9절</text>
<text x="158" y="247" font-size="22" fill="#173039" font-weight="400">배상 예물과 새 수레를 준비함</text>
<path d="M410 270v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="286" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="318" font-size="19" fill="#27665e" font-weight="700">10–18절</text>
<text x="158" y="318" font-size="22" fill="#173039" font-weight="400">암소가 벧세메스로 가고 주민들이 제사함</text>
<path d="M410 341v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="357" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="389" font-size="19" fill="#27665e" font-weight="700">19–21절</text>
<text x="158" y="389" font-size="22" fill="#173039" font-weight="400">심판을 겪고 궤를 데려가 달라고 청함</text>
<rect x="34" y="426" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="454" font-size="18" fill="#27665e" font-weight="700">주요 기물·표지</text>
<text x="54" y="483" font-size="22" fill="#173039" font-weight="400">금 독종과 금 쥐·수레·암소·큰 돌</text>
<text x="34" y="522" font-size="18" fill="#6a4d32" font-weight="400">6:19의 사망자 수는 두 번역 모두 괄호가 있는 수를 제시하며 본문 전승에</text>
<text x="34" y="546" font-size="18" fill="#6a4d32" font-weight="400">이견이 있어 도식에 수를 넣지 않았습니다.</text>
<text x="34" y="574" font-size="17" fill="#526862" font-weight="400">이 장에는 본문 도해를 제공합니다.</text>
<text x="34" y="598" font-size="16" fill="#526862" font-weight="400">개역개정 4판·개역한글 대조 / 호크마 참고 / 지도 축척 없음</text>
</svg>
