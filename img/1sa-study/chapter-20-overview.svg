<svg xmlns="http://www.w3.org/2000/svg" width="820" height="594" viewBox="0 0 820 594" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">삼상 20장 · 화살로 알린 작별</title><desc id="desc">들·사울의 초하루 잔치 자리·에셀 바위 / 1–23 요나단과 다윗이 언약과 신호를 정함 → 24–34 빈자리로 사울의 적의가 드러남 → 35–42 화살 신호를 보낸 뒤 두 사람이 작별함 / 활·화살·사울의 창 / 24절은 호크마 정리에 해설이 없어 두 번역 본문으로 확인했습니다.</desc>
<rect width="820" height="594" rx="20" fill="#f5f3eb"/>
<text x="34" y="36" font-size="19" fill="#27665e" font-weight="700">삼상 20장  ·  본문 도해</text>
<text x="34" y="77" font-size="32" fill="#173039" font-weight="700">화살로 알린 작별</text>
<rect x="34" y="100" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="128" font-size="18" fill="#27665e" font-weight="700">주요 장소</text>
<text x="54" y="157" font-size="22" fill="#173039" font-weight="400">들·사울의 초하루 잔치 자리·에셀 바위</text>
<text x="34" y="202" font-size="18" fill="#27665e" font-weight="700">본문의 흐름</text>
<rect x="34" y="215" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="247" font-size="19" fill="#27665e" font-weight="700">1–23절</text>
<text x="158" y="247" font-size="22" fill="#173039" font-weight="400">요나단과 다윗이 언약과 신호를 정함</text>
<path d="M410 270v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="286" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="318" font-size="19" fill="#27665e" font-weight="700">24–34절</text>
<text x="158" y="318" font-size="22" fill="#173039" font-weight="400">빈자리로 사울의 적의가 드러남</text>
<path d="M410 341v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="357" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="389" font-size="19" fill="#27665e" font-weight="700">35–42절</text>
<text x="158" y="389" font-size="22" fill="#173039" font-weight="400">화살 신호를 보낸 뒤 두 사람이 작별함</text>
<rect x="34" y="426" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="454" font-size="18" fill="#27665e" font-weight="700">주요 기물·표지</text>
<text x="54" y="483" font-size="22" fill="#173039" font-weight="400">활·화살·사울의 창</text>
<text x="34" y="522" font-size="18" fill="#6a4d32" font-weight="400">24절은 호크마 정리에 해설이 없어 두 번역 본문으로 확인했습니다.</text>
<text x="34" y="550" font-size="17" fill="#526862" font-weight="400">이 장에는 본문 도해를 제공합니다.</text>
<text x="34" y="574" font-size="16" fill="#526862" font-weight="400">개역개정 4판·개역한글 대조 / 호크마 참고 / 지도 축척 없음</text>
</svg>
