<svg xmlns="http://www.w3.org/2000/svg" width="820" height="594" viewBox="0 0 820 594" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">삼상 7장 · 미스바와 에벤에셀</title><desc id="desc">기럇여아림·미스바·벧갈·벧엘·길갈·라마 / 1–6 궤를 모신 뒤 백성이 우상을 버리고 모임 → 7–14 사무엘이 간구하고 승리 뒤 돌을 세움 → 15–17 사무엘이 여러 곳을 돌며 다스림 / 언약궤·어린양 번제·에벤에셀 기념 돌·제단 / 12절의 기념 돌과 4:1의 전장 지명이 같은 장소인지는 확실하지 않습니다.</desc>
<rect width="820" height="594" rx="20" fill="#f5f3eb"/>
<text x="34" y="36" font-size="19" fill="#27665e" font-weight="700">삼상 7장  ·  본문 도해</text>
<text x="34" y="77" font-size="32" fill="#173039" font-weight="700">미스바와 에벤에셀</text>
<rect x="34" y="100" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="128" font-size="18" fill="#27665e" font-weight="700">주요 장소</text>
<text x="54" y="157" font-size="22" fill="#173039" font-weight="400">기럇여아림·미스바·벧갈·벧엘·길갈·라마</text>
<text x="34" y="202" font-size="18" fill="#27665e" font-weight="700">본문의 흐름</text>
<rect x="34" y="215" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="247" font-size="19" fill="#27665e" font-weight="700">1–6절</text>
<text x="158" y="247" font-size="22" fill="#173039" font-weight="400">궤를 모신 뒤 백성이 우상을 버리고 모임</text>
<path d="M410 270v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="286" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="318" font-size="19" fill="#27665e" font-weight="700">7–14절</text>
<text x="158" y="318" font-size="22" fill="#173039" font-weight="400">사무엘이 간구하고 승리 뒤 돌을 세움</text>
<path d="M410 341v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="357" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="389" font-size="19" fill="#27665e" font-weight="700">15–17절</text>
<text x="158" y="389" font-size="22" fill="#173039" font-weight="400">사무엘이 여러 곳을 돌며 다스림</text>
<rect x="34" y="426" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="454" font-size="18" fill="#27665e" font-weight="700">주요 기물·표지</text>
<text x="54" y="483" font-size="22" fill="#173039" font-weight="400">언약궤·어린양 번제·에벤에셀 기념 돌·제단</text>
<text x="34" y="522" font-size="18" fill="#6a4d32" font-weight="400">12절의 기념 돌과 4:1의 전장 지명이 같은 장소인지는 확실하지 않습니다.</text>
<text x="34" y="550" font-size="17" fill="#526862" font-weight="400">이 장에는 본문 도해를 제공합니다.</text>
<text x="34" y="574" font-size="16" fill="#526862" font-weight="400">개역개정 4판·개역한글 대조 / 호크마 참고 / 지도 축척 없음</text>
</svg>
