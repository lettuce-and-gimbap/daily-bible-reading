<svg xmlns="http://www.w3.org/2000/svg" width="820" height="618" viewBox="0 0 820 618" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">삼상 4장 · 언약궤를 빼앗기다</title><desc id="desc">에벤에셀·아벡·실로 / 1–9 첫 패배 뒤 언약궤를 전장으로 가져옴 → 10–18 두 번째 패배, 궤를 빼앗기고 엘리가 죽음 → 19–22 이가봇이 태어남 / 언약궤·전령의 찢어진 옷·엘리의 의자 / 호크마 정리의 2–9절은 원주석 수록 공백 표시가 있어 두 번역 본문을 기준으로 삼았습니다.</desc>
<rect width="820" height="618" rx="20" fill="#f5f3eb"/>
<text x="34" y="36" font-size="19" fill="#27665e" font-weight="700">삼상 4장  ·  본문 도해</text>
<text x="34" y="77" font-size="32" fill="#173039" font-weight="700">언약궤를 빼앗기다</text>
<rect x="34" y="100" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="128" font-size="18" fill="#27665e" font-weight="700">주요 장소</text>
<text x="54" y="157" font-size="22" fill="#173039" font-weight="400">에벤에셀·아벡·실로</text>
<text x="34" y="202" font-size="18" fill="#27665e" font-weight="700">본문의 흐름</text>
<rect x="34" y="215" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="247" font-size="19" fill="#27665e" font-weight="700">1–9절</text>
<text x="158" y="247" font-size="22" fill="#173039" font-weight="400">첫 패배 뒤 언약궤를 전장으로 가져옴</text>
<path d="M410 270v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="286" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="318" font-size="19" fill="#27665e" font-weight="700">10–18절</text>
<text x="158" y="318" font-size="22" fill="#173039" font-weight="400">두 번째 패배, 궤를 빼앗기고 엘리가 죽음</text>
<path d="M410 341v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="357" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="389" font-size="19" fill="#27665e" font-weight="700">19–22절</text>
<text x="158" y="389" font-size="22" fill="#173039" font-weight="400">이가봇이 태어남</text>
<rect x="34" y="426" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="454" font-size="18" fill="#27665e" font-weight="700">주요 기물·표지</text>
<text x="54" y="483" font-size="22" fill="#173039" font-weight="400">언약궤·전령의 찢어진 옷·엘리의 의자</text>
<text x="34" y="522" font-size="18" fill="#6a4d32" font-weight="400">호크마 정리의 2–9절은 원주석 수록 공백 표시가 있어 두 번역 본문을</text>
<text x="34" y="546" font-size="18" fill="#6a4d32" font-weight="400">기준으로 삼았습니다.</text>
<text x="34" y="574" font-size="17" fill="#526862" font-weight="400">기록 사진은 장의 별도 그림에서 볼 수 있습니다.</text>
<text x="34" y="598" font-size="16" fill="#526862" font-weight="400">개역개정 4판·개역한글 대조 / 호크마 참고 / 지도 축척 없음</text>
</svg>
