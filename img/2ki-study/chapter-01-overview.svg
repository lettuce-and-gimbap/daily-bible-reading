<rect x="34" y="344" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="358" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="382" font-size="17" fill="#334F74" font-weight="700">9–16절</text>
<text x="170" y="383" font-size="23" fill="#182832" font-weight="400">두 부대가 불에 타고 셋째 지휘관은 자비를 청함</text>
<path d="M410 410v14m-5 -6 5 6 5 -6" fill="none" stroke="#334F74" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="429" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="443" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="467" font-size="17" fill="#334F74" font-weight="700">17–18절</text>
<text x="170" y="468" font-size="23" fill="#182832" font-weight="400">아하시야가 죽고 여호람이 뒤를 이음</text>
<rect x="34" y="512" width="752" height="84" rx="12" fill="#E4EBF4"/>
<text x="54" y="541" font-size="18" fill="#334F74" font-weight="700">주요 기물과 표지</text>
<text x="54" y="574" font-size="23" fill="#182832" font-weight="400">다락 난간·침상·가죽 띠</text>
