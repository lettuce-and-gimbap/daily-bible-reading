<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 23장 · 요시야의 언약 갱신과 유월절</title>
<desc id="desc">주요 장소: 예루살렘·기드론·도벳·벧엘·므깃도·립나. 본문의 흐름: 1–14 율법책을 읽고 언약을 맺은 뒤 우상을 없앰 → 15–27 벧엘 제단을 헐고 예루살렘에서 유월절을 지킴 → 28–37 요시야가 죽고 애굽이 유다 왕위에 개입함. 주요 기물과 표지: 언약책·우상 숭배 기구·벧엘 제단·은금 벌금.</desc>
