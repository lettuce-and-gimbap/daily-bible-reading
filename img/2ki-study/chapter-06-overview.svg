<svg xmlns="http://www.w3.org/2000/svg" width="820" height="642" viewBox="0 0 820 642" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 6장 · 요단의 도끼와 사마리아의 두 위기</title>
<desc id="desc">주요 장소: 요단·도단·사마리아. 본문의 흐름: 1–7 엘리사가 물에 빠진 도끼 쇠를 떠오르게 함 → 8–23 도단을 포위한 아람군을 사마리아로 이끌어 먹여 보냄 → 24–33 벤하닷의 포위로 사마리아에 심한 기근이 닥침. 주요 기물과 표지: 도끼 쇠·나뭇가지·불말과 불병거·굵은 베.</desc>
<rect x="0" y="0" width="820" height="642" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#334F74" font-weight="700">열왕기하 6장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">요단의 도끼와 사마리아의 두 위기</text>
<rect x="711" y="28" width="75" height="75" rx="14" fill="#E4EBF4"/>
<path transform="translate(725 41) scale(2.85)" d="M2 2h11l3 3-3 3H9v8H6V8H2z" fill="#334F74" fill-rule="evenodd"/>
<rect x="34" y="126" width="752" height="84" rx="12" fill="#E4EBF4"/>
