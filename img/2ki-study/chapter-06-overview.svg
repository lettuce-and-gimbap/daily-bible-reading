<rect x="50" y="358" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="382" font-size="17" fill="#334F74" font-weight="700">8–23절</text>
<text x="170" y="383" font-size="23" fill="#182832" font-weight="400">도단을 포위한 아람군을 사마리아로 이끌어 먹여</text>
<text x="170" y="414" font-size="23" fill="#182832" font-weight="400">보냄</text>
