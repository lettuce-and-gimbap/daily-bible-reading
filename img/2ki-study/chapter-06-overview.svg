<rect x="34" y="450" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="464" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="488" font-size="17" fill="#334F74" font-weight="700">24–33절</text>
<text x="170" y="489" font-size="23" fill="#182832" font-weight="400">벤하닷의 포위로 사마리아에 심한 기근이 닥침</text>
<rect x="34" y="533" width="752" height="84" rx="12" fill="#E4EBF4"/>
<text x="54" y="562" font-size="18" fill="#334F74" font-weight="700">주요 기물과 표지</text>
<text x="54" y="595" font-size="23" fill="#182832" font-weight="400">도끼 쇠·나뭇가지·불말과 불병거·굵은 베</text>
