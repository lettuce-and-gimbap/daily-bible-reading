<rect x="34" y="259" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="273" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="297" font-size="17" fill="#334F74" font-weight="700">1–7절</text>
<text x="170" y="298" font-size="23" fill="#182832" font-weight="400">엘리사가 물에 빠진 도끼 쇠를 떠오르게 함</text>
