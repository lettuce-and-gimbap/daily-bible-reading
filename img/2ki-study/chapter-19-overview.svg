<text x="59" y="382" font-size="17" fill="#334F74" font-weight="700">14–34절</text>
<text x="170" y="383" font-size="23" fill="#182832" font-weight="400">왕이 편지를 펴고 기도하자 구원의 말씀이 전해짐</text>
