<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 19장 · 히스기야의 기도와 앗수르의 철수</title>
<desc id="desc">주요 장소: 예루살렘 성전·립나·니느웨. 본문의 흐름: 1–13 히스기야가 이사야에게 사람을 보내고 위협이 반복됨 → 14–34 왕이 편지를 펴고 기도하자 구원의 말씀이 전해짐 → 35–37 앗수르 진영이 타격을 받고 산헤립이 돌아감. 주요 기물과 표지: 굵은 베·산헤립의 편지·농사의 표징.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#334F74" font-weight="700">열왕기하 19장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">히스기야의 기도와 앗수르의 철수</text>
