<svg xmlns="http://www.w3.org/2000/svg" width="820" height="642" viewBox="0 0 820 642" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 5장 · 나아만의 치유와 게하시의 탐욕</title>
<desc id="desc">주요 장소: 아람·이스라엘 왕궁·엘리사의 집·요단. 본문의 흐름: 1–12 포로 소녀의 말로 나아만이 엘리사를 찾음 → 13–19 요단에서 씻고 나은 나아만의 예물을 엘리사가 사양함 → 20–27 게하시가 몰래 예물을 받고 병에 걸림. 주요 기물과 표지: 왕의 편지·은금·옷·나귀 두 마리에 실을 흙.</desc>
<rect x="0" y="0" width="820" height="642" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#334F74" font-weight="700">열왕기하 5장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">나아만의 치유와 게하시의 탐욕</text>
<rect x="711" y="28" width="75" height="75" rx="14" fill="#E4EBF4"/>
<path transform="translate(725 41) scale(2.85)" d="M0 3h5v2h5V3h6v2h-6v2H5V5H0zM0 10h5v2h5v-2h6v2h-6v2H5v-2H0z" fill="#334F74" fill-rule="evenodd"/>
<rect x="34" y="126" width="752" height="84" rx="12" fill="#E4EBF4"/>
<text x="54" y="155" font-size="18" fill="#334F74" font-weight="700">주요 장소</text>
<text x="54" y="188" font-size="23" fill="#182832" font-weight="400">아람·이스라엘 왕궁·엘리사의 집·요단</text>
<text x="34" y="244" font-size="18" fill="#334F74" font-weight="700">본문의 흐름</text>
<rect x="34" y="259" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="273" width="97" height="34" rx="9" fill="#E4EBF4"/>
