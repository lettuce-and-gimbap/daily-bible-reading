<text x="170" y="298" font-size="23" fill="#182832" font-weight="400">포로 소녀의 말로 나아만이 엘리사를 찾음</text>
<path d="M410 325v14m-5 -6 5 6 5 -6" fill="none" stroke="#334F74" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="344" width="752" height="84" rx="12" fill="#FFFDF8"/>
<rect x="50" y="358" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="382" font-size="17" fill="#334F74" font-weight="700">13–19절</text>
<text x="170" y="383" font-size="23" fill="#182832" font-weight="400">요단에서 씻고 나은 나아만의 예물을 엘리사가</text>
<text x="170" y="414" font-size="23" fill="#182832" font-weight="400">사양함</text>
<path d="M410 431v14m-5 -6 5 6 5 -6" fill="none" stroke="#334F74" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="450" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="464" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="488" font-size="17" fill="#334F74" font-weight="700">20–27절</text>
<text x="170" y="489" font-size="23" fill="#182832" font-weight="400">게하시가 몰래 예물을 받고 병에 걸림</text>
<rect x="34" y="533" width="752" height="84" rx="12" fill="#E4EBF4"/>
