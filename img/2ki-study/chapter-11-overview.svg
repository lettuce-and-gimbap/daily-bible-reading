<rect x="34" y="429" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="443" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="467" font-size="17" fill="#334F74" font-weight="700">17–21절</text>
<text x="170" y="468" font-size="23" fill="#182832" font-weight="400">언약을 맺고 바알 신당을 헌 뒤 왕궁에 들어감</text>
