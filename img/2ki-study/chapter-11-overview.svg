<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 11장 · 숨겨진 요아스의 즉위</title>
<desc id="desc">주요 장소: 예루살렘 성전·왕궁·말이 다니는 길·바알 신당. 본문의 흐름: 1–3 여호세바가 요아스를 숨겨 아달랴의 손에서 구함 → 4–16 여호야다가 요아스를 왕으로 세우고 아달랴가 죽음 → 17–21 언약을 맺고 바알 신당을 헌 뒤 왕궁에 들어감. 주요 기물과 표지: 다윗의 창과 방패·왕관·증거 문서·나팔.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#334F74" font-weight="700">열왕기하 11장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">숨겨진 요아스의 즉위</text>
