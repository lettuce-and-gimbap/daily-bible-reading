<text x="59" y="382" font-size="17" fill="#334F74" font-weight="700">4–16절</text>
<text x="170" y="383" font-size="23" fill="#182832" font-weight="400">여호야다가 요아스를 왕으로 세우고 아달랴가 죽음</text>
