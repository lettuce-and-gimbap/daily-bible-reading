<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 7장 · 텅 빈 아람 진영</title>
<desc id="desc">주요 장소: 사마리아 성문·아람 진영·요단으로 가는 길. 본문의 흐름: 1–2 엘리사가 이튿날 곡식 값이 내릴 것을 예고함 → 3–15 나병 환자 네 명이 빈 진영을 발견하고 소식을 전함 → 16–20 백성이 곡식을 얻고 불신한 장관은 성문에서 죽음. 주요 기물과 표지: 곡식·은금과 옷·정탐용 병거·버려진 군용품.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#334F74" font-weight="700">열왕기하 7장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">텅 빈 아람 진영</text>
