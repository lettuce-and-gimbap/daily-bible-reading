<svg xmlns="http://www.w3.org/2000/svg" width="820" height="642" viewBox="0 0 820 642" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 17장 · 사마리아의 함락과 주민 이주</title>
<desc id="desc">주요 장소: 사마리아·할라·하볼·메대·바벨론 등 이주 출발지. 본문의 흐름: 1–6 호세아의 반역 뒤 앗수르가 사마리아를 점령함 → 7–23 본문은 이스라엘의 멸망을 언약을 버린 결과로 설명함 → 24–41 이주민들이 여호와를 경외하면서 자기 신들도 섬김. 주요 기물과 표지: 산당·목상과 주상·이주민이 만든 신상.</desc>
<rect x="0" y="0" width="820" height="642" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#334F74" font-weight="700">열왕기하 17장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">사마리아의 함락과 주민 이주</text>
<rect x="711" y="28" width="75" height="75" rx="14" fill="#E4EBF4"/>
<path transform="translate(725 41) scale(2.85)" d="M0 3h3v3h3V3h4v3h3V3h3v13h-6v-5H6v5H0z" fill="#334F74" fill-rule="evenodd"/>
<rect x="34" y="126" width="752" height="84" rx="12" fill="#E4EBF4"/>
<text x="54" y="155" font-size="18" fill="#334F74" font-weight="700">주요 장소</text>
<text x="54" y="188" font-size="23" fill="#182832" font-weight="400">사마리아·할라·하볼·메대·바벨론 등 이주 출발지</text>
<text x="34" y="244" font-size="18" fill="#334F74" font-weight="700">본문의 흐름</text>
<rect x="34" y="259" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="273" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="297" font-size="17" fill="#334F74" font-weight="700">1–6절</text>
<text x="170" y="298" font-size="23" fill="#182832" font-weight="400">호세아의 반역 뒤 앗수르가 사마리아를 점령함</text>
<path d="M410 325v14m-5 -6 5 6 5 -6" fill="none" stroke="#334F74" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="344" width="752" height="84" rx="12" fill="#FFFDF8"/>
<rect x="50" y="358" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="382" font-size="17" fill="#334F74" font-weight="700">7–23절</text>
<text x="170" y="383" font-size="23" fill="#182832" font-weight="400">본문은 이스라엘의 멸망을 언약을 버린 결과로</text>
<text x="170" y="414" font-size="23" fill="#182832" font-weight="400">설명함</text>
<path d="M410 431v14m-5 -6 5 6 5 -6" fill="none" stroke="#334F74" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="450" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="464" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="488" font-size="17" fill="#334F74" font-weight="700">24–41절</text>
<text x="170" y="489" font-size="23" fill="#182832" font-weight="400">이주민들이 여호와를 경외하면서 자기 신들도 섬김</text>
<rect x="34" y="533" width="752" height="84" rx="12" fill="#E4EBF4"/>
<text x="54" y="562" font-size="18" fill="#334F74" font-weight="700">주요 기물과 표지</text>
<text x="54" y="595" font-size="23" fill="#182832" font-weight="400">산당·목상과 주상·이주민이 만든 신상</text>
</svg>
