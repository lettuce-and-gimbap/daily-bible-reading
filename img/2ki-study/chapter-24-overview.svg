<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 24장 · 여호야긴의 항복과 바벨론 이송</title>
<desc id="desc">주요 장소: 유다·예루살렘·바벨론·애굽 시내에서 유브라데까지. 본문의 흐름: 1–7 여호야김이 바벨론을 섬기다 반역함 → 8–16 여호야긴이 항복하고 백성과 보물이 옮겨짐 → 17–20 바벨론 왕이 시드기야를 세우고 그도 반역함. 주요 기물과 표지: 성전의 금 기물·왕궁 보물.</desc>
