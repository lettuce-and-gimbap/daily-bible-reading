<rect x="50" y="443" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="467" font-size="17" fill="#334F74" font-weight="700">22–25절</text>
<text x="170" y="468" font-size="23" fill="#182832" font-weight="400">요아스가 벤하닷을 세 차례 이기고 성읍을 되찾음</text>
