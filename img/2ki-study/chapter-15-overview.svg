<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 15장 · 왕위 교체와 앗수르의 진출</title>
<desc id="desc">주요 장소: 예루살렘·사마리아·디르사·딥사·갈릴리·납달리. 본문의 흐름: 1–7 아사랴가 병으로 별궁에 살고 요담이 백성을 다스림 → 8–31 북왕국의 왕위가 잇달아 바뀌고 앗수르가 침입함 → 32–38 요담이 유다 왕이 되고 적들의 위협이 시작됨. 주요 기물과 표지: 앗수르에 바친 은·성전 윗문.</desc>
