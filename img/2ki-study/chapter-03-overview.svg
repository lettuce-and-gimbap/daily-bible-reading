<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 3장 · 모압 원정과 골짜기의 물</title>
<desc id="desc">주요 장소: 사마리아·에돔 광야·모압·길하레셋. 본문의 흐름: 1–12 세 왕의 연합군이 물이 떨어지자 엘리사를 찾음 → 13–20 골짜기에 물이 찰 것이라는 말씀이 이루어짐 → 21–27 모압군이 물을 피로 오인하고 연합군이 모압을 침. 주요 기물과 표지: 모압의 양과 양털·거문고·골짜기의 도랑.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#334F74" font-weight="700">열왕기하 3장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">모압 원정과 골짜기의 물</text>
