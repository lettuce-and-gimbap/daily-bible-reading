<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 10장 · 아합 왕가와 바알 신당의 몰락</title>
<desc id="desc">주요 장소: 사마리아·이스르엘·벧에겟·바알 신당·단과 벧엘. 본문의 흐름: 1–14 아합 집안과 아하시야의 형제들이 죽임을 당함 → 15–28 예후가 여호나답과 함께 가서 바알 신당을 헒 → 29–36 금송아지는 남고 하사엘이 국경을 침범함. 주요 기물과 표지: 예후의 편지·광주리·제의용 옷·바알 목상·금송아지.</desc>
