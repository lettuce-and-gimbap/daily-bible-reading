<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 4장 · 엘리사와 네 가지 돌봄</title>
<desc id="desc">주요 장소: 과부의 집·수넴의 다락방·갈멜산·길갈. 본문의 흐름: 1–7 과부가 빈 그릇에 기름을 채워 빚을 갚음 → 8–37 수넴 여인이 얻은 아들이 죽었다가 살아남 → 38–44 해로운 국을 고치고 적은 떡으로 백 명을 먹임. 주요 기물과 표지: 기름 그릇·침상·등잔·지팡이·국솥·보리떡.</desc>
