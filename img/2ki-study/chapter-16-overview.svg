<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 16장 · 아하스와 다메섹 제단</title>
<desc id="desc">주요 장소: 예루살렘·다메섹·엘랏·기르. 본문의 흐름: 1–9 아하스가 앗수르에 은금을 보내 원군을 구함 → 10–16 다메섹 제단의 도면을 보내 예루살렘에 복제함 → 17–20 놋 기구와 성전 통로를 손봄. 주요 기물과 표지: 제단 도면·놋 제단·물두멍 받침·놋 바다와 받침 소.</desc>
