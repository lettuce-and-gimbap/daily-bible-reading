<text x="54" y="155" font-size="18" fill="#334F74" font-weight="700">주요 장소</text>
<text x="54" y="188" font-size="23" fill="#182832" font-weight="400">길갈·벧엘·여리고·요단·갈멜산·사마리아</text>
<text x="34" y="244" font-size="18" fill="#334F74" font-weight="700">본문의 흐름</text>
<rect x="34" y="259" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="273" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="297" font-size="17" fill="#334F74" font-weight="700">1–8절</text>
<text x="170" y="298" font-size="23" fill="#182832" font-weight="400">엘리야와 엘리사가 함께 요단을 건넘</text>
<path d="M410 325v14m-5 -6 5 6 5 -6" fill="none" stroke="#334F74" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="344" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="358" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="382" font-size="17" fill="#334F74" font-weight="700">9–18절</text>
<text x="170" y="383" font-size="23" fill="#182832" font-weight="400">엘리야가 올라가고 엘리사가 겉옷을 주움</text>
<path d="M410 410v14m-5 -6 5 6 5 -6" fill="none" stroke="#334F74" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="429" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="443" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="467" font-size="17" fill="#334F74" font-weight="700">19–25절</text>
<text x="170" y="468" font-size="23" fill="#182832" font-weight="400">여리고의 물이 고쳐지고 벧엘에서 조롱이 일어남</text>
<rect x="34" y="512" width="752" height="84" rx="12" fill="#E4EBF4"/>
