<svg xmlns="http://www.w3.org/2000/svg" width="820" height="435" viewBox="0 0 820 435" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">사마리아와 사르곤 2세의 비문</title>
<desc id="desc">왕실 비문 · 앗수르의 기록. ORACC RINAP 2 · 사르곤 2세의 비문. 사르곤 2세의 비문에도 사마리아 정복과 주민 이주가 나와요. 앗수르 기록은 왕의 업적을 내세우며, 본문은 포위와 멸망의 신학적 이유도 전해요. 원본 사진 대신 기호를 사용한 도해.</desc>
<metadata>https://oracc.museum.upenn.edu/rinap/downloads/Frame_RINAP_2.pdf</metadata>
<rect x="0" y="0" width="820" height="435" rx="20" fill="#F6F2E8"/>
<text x="34" y="45" font-size="20" fill="#705029" font-weight="700">왕실 비문 · 앗수르의 기록</text>
<text x="34" y="93" font-size="31" fill="#182832" font-weight="700">사마리아와 사르곤 2세의 비문</text>
<rect x="34" y="116" width="752" height="66" rx="12" fill="#ECE2CB"/>
<path transform="translate(53 133) scale(2)" d="M3 2h11v12H5v2H1v-3h2zm3 4v1h5V6zm0 4v1h5v-1z" fill="#705029" fill-rule="evenodd"/>
<text x="105" y="157" font-size="19" fill="#705029" font-weight="700">ORACC RINAP 2 · 사르곤 2세의 비문</text>
<text x="34" y="220" font-size="19" fill="#705029" font-weight="700">자료가 보여 주는 내용</text>
<text x="34" y="255" font-size="22" fill="#182832" font-weight="400">사르곤 2세의 비문에도 사마리아 정복과 주민 이주가 나와요.</text>
<text x="34" y="328" font-size="19" fill="#705029" font-weight="700">본문과 함께 읽을 때</text>
<text x="34" y="363" font-size="22" fill="#182832" font-weight="400">앗수르 기록은 왕의 업적을 내세우며, 본문은 포위와 멸망의 신학적</text>
<text x="34" y="393" font-size="22" fill="#182832" font-weight="400">이유도 전해요.</text>
</svg>
