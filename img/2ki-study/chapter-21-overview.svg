<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 21장 · 므낫세와 아몬 치하의 예루살렘</title>
<desc id="desc">주요 장소: 예루살렘·성전 두 뜰·웃사의 동산. 본문의 흐름: 1–9 므낫세가 산당을 복구하고 성전 안에 우상을 둠 → 10–18 선지자들이 예루살렘 심판을 경고함 → 19–26 아몬이 살해되고 백성이 요시야를 왕으로 세움. 주요 기물과 표지: 바알 제단·아세라 목상·하늘 군대의 제단·먹줄과 추의 비유.</desc>
