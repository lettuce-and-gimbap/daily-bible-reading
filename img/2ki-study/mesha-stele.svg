<svg xmlns="http://www.w3.org/2000/svg" width="820" height="435" viewBox="0 0 820 435" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">메사 석비와 모압·이스라엘의 충돌</title>
<desc id="desc">왕실 비문 · 모압의 기록. 루브르 박물관 · 메사 석비 AO 5066. 모압 왕 메사의 비문은 이스라엘의 지배와 모압의 영토 회복을 기록해요. 열왕기하 3장의 원정 경과와 세부 장면은 성경 본문에서 확인할 수 있어요. 원본 사진 대신 기호를 사용한 도해.</desc>
<metadata>https://collections.louvre.fr/en/ark%3A/53355/cl010120339</metadata>
<rect x="0" y="0" width="820" height="435" rx="20" fill="#F6F2E8"/>
<text x="34" y="45" font-size="20" fill="#705029" font-weight="700">왕실 비문 · 모압의 기록</text>
<text x="34" y="93" font-size="31" fill="#182832" font-weight="700">메사 석비와 모압·이스라엘의 충돌</text>
<rect x="34" y="116" width="752" height="66" rx="12" fill="#ECE2CB"/>
<path transform="translate(53 133) scale(2)" d="M3 2h11v12H5v2H1v-3h2zm3 4v1h5V6zm0 4v1h5v-1z" fill="#705029" fill-rule="evenodd"/>
<text x="105" y="157" font-size="19" fill="#705029" font-weight="700">루브르 박물관 · 메사 석비 AO 5066</text>
<text x="34" y="220" font-size="19" fill="#705029" font-weight="700">자료가 보여 주는 내용</text>
<text x="34" y="255" font-size="22" fill="#182832" font-weight="400">모압 왕 메사의 비문은 이스라엘의 지배와 모압의 영토 회복을</text>
<text x="34" y="285" font-size="22" fill="#182832" font-weight="400">기록해요.</text>
<text x="34" y="328" font-size="19" fill="#705029" font-weight="700">본문과 함께 읽을 때</text>
<text x="34" y="363" font-size="22" fill="#182832" font-weight="400">열왕기하 3장의 원정 경과와 세부 장면은 성경 본문에서 확인할 수</text>
<text x="34" y="393" font-size="22" fill="#182832" font-weight="400">있어요.</text>
</svg>
