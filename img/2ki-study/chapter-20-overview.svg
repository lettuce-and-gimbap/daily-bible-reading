<svg xmlns="http://www.w3.org/2000/svg" width="820" height="642" viewBox="0 0 820 642" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 20장 · 히스기야의 병과 바벨론 사절</title>
<desc id="desc">주요 장소: 예루살렘 왕궁·보물고·성읍 물길·바벨론. 본문의 흐름: 1–11 히스기야가 기도하고 회복 약속과 그림자 표징을 받음 → 12–19 사절에게 보물을 보인 뒤 바벨론 포로가 예고됨 → 20–21 물길 공사와 히스기야의 죽음을 기록함. 주요 기물과 표지: 무화과 반죽·아하스의 해시계·은금과 무기·못과 수도.</desc>
<rect x="0" y="0" width="820" height="642" rx="20" fill="#F6F2E8"/>
