<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 18장 · 히스기야의 개혁과 라기스에서 온 사절</title>
<desc id="desc">주요 장소: 예루살렘·사마리아·라기스·윗못 수도. 본문의 흐름: 1–12 히스기야의 개혁과 앞선 사마리아 함락을 기록함 → 13–16 산헤립이 유다에 오자 히스기야가 조공을 보냄 → 17–37 랍사게가 예루살렘 성벽 앞에서 항복을 요구함. 주요 기물과 표지: 느후스단·은과 금·벗긴 성전 문 금.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#334F74" font-weight="700">열왕기하 18장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">히스기야의 개혁과 라기스에서 온 사절</text>
