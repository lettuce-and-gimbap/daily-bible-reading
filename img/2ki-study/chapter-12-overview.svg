<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 12장 · 성전 수리와 요아스의 최후</title>
<desc id="desc">주요 장소: 예루살렘 성전·가드·밀로 궁. 본문의 흐름: 1–8 성전 수리가 늦어져 헌금 관리 방식을 바꿈 → 9–16 궤에 모은 은을 일꾼에게 건네 수리를 진행함 → 17–21 하사엘에게 보물을 보낸 뒤 요아스가 살해됨. 주요 기물과 표지: 뚜껑에 구멍을 뚫은 궤·헌금 은·성전과 왕궁의 금.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#334F74" font-weight="700">열왕기하 12장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">성전 수리와 요아스의 최후</text>
<rect x="711" y="28" width="75" height="75" rx="14" fill="#E4EBF4"/>
<path transform="translate(725 41) scale(2.85)" d="M2 2h11l3 3-3 3H9v8H6V8H2z" fill="#334F74" fill-rule="evenodd"/>
<rect x="34" y="126" width="752" height="84" rx="12" fill="#E4EBF4"/>
<text x="54" y="155" font-size="18" fill="#334F74" font-weight="700">주요 장소</text>
<text x="54" y="188" font-size="23" fill="#182832" font-weight="400">예루살렘 성전·가드·밀로 궁</text>
<text x="34" y="244" font-size="18" fill="#334F74" font-weight="700">본문의 흐름</text>
<rect x="34" y="259" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="273" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="297" font-size="17" fill="#334F74" font-weight="700">1–8절</text>
<text x="170" y="298" font-size="23" fill="#182832" font-weight="400">성전 수리가 늦어져 헌금 관리 방식을 바꿈</text>
