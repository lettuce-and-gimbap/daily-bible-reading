<svg xmlns="http://www.w3.org/2000/svg" width="820" height="435" viewBox="0 0 820 435" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">니느웨 궁전 부조에 새겨진 라기스</title>
<desc id="desc">궁전 부조 · 앗수르의 기록. 대영박물관 · 니느웨 남서 궁전 라기스 부조. 산헤립의 궁전 부조는 기원전 701년 라기스 공격과 함락을 묘사해요. 이 장면의 배경은 라기스예요. 본문은 라기스에서 예루살렘으로 간 사절도 전해요. 원본 사진 대신 기호를 사용한 도해.</desc>
<metadata>https://www.britishmuseum.org/sites/default/files/2019-09/Arab_World_Resource_Web.pdf</metadata>
<rect x="0" y="0" width="820" height="435" rx="20" fill="#F6F2E8"/>
<text x="34" y="45" font-size="20" fill="#705029" font-weight="700">궁전 부조 · 앗수르의 기록</text>
<text x="34" y="93" font-size="31" fill="#182832" font-weight="700">니느웨 궁전 부조에 새겨진 라기스</text>
<rect x="34" y="116" width="752" height="66" rx="12" fill="#ECE2CB"/>
<path transform="translate(53 133) scale(2)" d="M8 1l8 5v2H0V6zM2 9h2v5H2zm5 0h2v5H7zm5 0h2v5h-2zM0 15h16v2H0z" fill="#705029" fill-rule="evenodd"/>
<text x="105" y="157" font-size="19" fill="#705029" font-weight="700">대영박물관 · 니느웨 남서 궁전 라기스 부조</text>
<text x="34" y="220" font-size="19" fill="#705029" font-weight="700">자료가 보여 주는 내용</text>
<text x="34" y="255" font-size="22" fill="#182832" font-weight="400">산헤립의 궁전 부조는 기원전 701년 라기스 공격과 함락을 묘사해요.</text>
<text x="34" y="328" font-size="19" fill="#705029" font-weight="700">본문과 함께 읽을 때</text>
<text x="34" y="363" font-size="22" fill="#182832" font-weight="400">이 장면의 배경은 라기스예요. 본문은 라기스에서 예루살렘으로 간</text>
<text x="34" y="393" font-size="22" fill="#182832" font-weight="400">사절도 전해요.</text>
</svg>
