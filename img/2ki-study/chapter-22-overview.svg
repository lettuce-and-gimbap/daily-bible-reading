<text x="59" y="382" font-size="17" fill="#334F74" font-weight="700">8–13절</text>
<text x="170" y="383" font-size="23" fill="#182832" font-weight="400">힐기야가 발견한 책을 듣고 요시야가 옷을 찢음</text>
