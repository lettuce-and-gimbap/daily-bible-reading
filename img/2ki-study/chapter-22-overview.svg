<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 22장 · 율법책의 발견과 훌다의 말씀</title>
<desc id="desc">주요 장소: 예루살렘 왕궁·성전·둘째 구역. 본문의 흐름: 1–7 요시야가 성전 수리 자금을 일꾼에게 전달하게 함 → 8–13 힐기야가 발견한 책을 듣고 요시야가 옷을 찢음 → 14–20 훌다가 재앙과 요시야에게 주어진 말씀을 전함. 주요 기물과 표지: 수리 헌금·목재와 다듬은 돌·율법책·찢은 왕복.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#334F74" font-weight="700">열왕기하 22장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">율법책의 발견과 훌다의 말씀</text>
