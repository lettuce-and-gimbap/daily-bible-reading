<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기하 8장 · 수넴 여인의 귀환과 두 왕국의 변화</title>
<desc id="desc">주요 장소: 블레셋 땅·이스라엘 왕궁·다메섹·예루살렘·에돔·립나. 본문의 흐름: 1–6 피난에서 돌아온 여인이 집과 밭을 돌려받음 → 7–15 하사엘이 엘리사의 말을 듣고 벤하닷을 죽여 즉위함 → 16–29 유다의 여호람과 아하시야, 에돔 반란을 기록함. 주요 기물과 표지: 집과 밭·낙타에 실은 예물·물에 적신 이불·병거.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#334F74" font-weight="700">열왕기하 8장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">수넴 여인의 귀환과 두 왕국의 변화</text>
<rect x="711" y="28" width="75" height="75" rx="14" fill="#E4EBF4"/>
<path transform="translate(725 41) scale(2.85)" d="M0 7l5 2 3-6 3 6 5-2-2 8H2z" fill="#334F74" fill-rule="evenodd"/>
<rect x="34" y="126" width="752" height="84" rx="12" fill="#E4EBF4"/>
<text x="54" y="155" font-size="18" fill="#334F74" font-weight="700">주요 장소</text>
<text x="54" y="188" font-size="23" fill="#182832" font-weight="400">블레셋 땅·이스라엘 왕궁·다메섹·예루살렘·에돔·립나</text>
<text x="34" y="244" font-size="18" fill="#334F74" font-weight="700">본문의 흐름</text>
<rect x="34" y="259" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="273" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="297" font-size="17" fill="#334F74" font-weight="700">1–6절</text>
<text x="170" y="298" font-size="23" fill="#182832" font-weight="400">피난에서 돌아온 여인이 집과 밭을 돌려받음</text>
<path d="M410 325v14m-5 -6 5 6 5 -6" fill="none" stroke="#334F74" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="344" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="358" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="382" font-size="17" fill="#334F74" font-weight="700">7–15절</text>
<text x="170" y="383" font-size="23" fill="#182832" font-weight="400">하사엘이 엘리사의 말을 듣고 벤하닷을 죽여 즉위함</text>
<path d="M410 410v14m-5 -6 5 6 5 -6" fill="none" stroke="#334F74" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="429" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="443" width="97" height="34" rx="9" fill="#E4EBF4"/>
<text x="59" y="467" font-size="17" fill="#334F74" font-weight="700">16–29절</text>
<text x="170" y="468" font-size="23" fill="#182832" font-weight="400">유다의 여호람과 아하시야, 에돔 반란을 기록함</text>
<rect x="34" y="512" width="752" height="84" rx="12" fill="#E4EBF4"/>
<text x="54" y="541" font-size="18" fill="#334F74" font-weight="700">주요 기물과 표지</text>
<text x="54" y="574" font-size="23" fill="#182832" font-weight="400">집과 밭·낙타에 실은 예물·물에 적신 이불·병거</text>
</svg>
