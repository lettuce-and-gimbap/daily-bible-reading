<svg xmlns="http://www.w3.org/2000/svg" width="820" height="570" viewBox="0 0 820 570" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">삿 4장 · 드보라와 바락, 그리고 야엘</title><desc id="desc">하솔·하로셋 학고임·다볼 산·기손 강·야엘의 장막 / 1–10 야빈의 압제와 바락의 소집 → 11–16 다볼에서 내려온 바락이 시스라의 군대를 격파함 → 17–24 야엘의 장막에서 시스라가 죽음 / 철 병거·우유·장막 말뚝·망치</desc>
<rect width="820" height="570" rx="20" fill="#f5f3eb"/>
<text x="34" y="36" font-size="19" fill="#27665e" font-weight="700">삿 4장  ·  본문 도해</text>
<text x="34" y="77" font-size="32" fill="#173039" font-weight="700">드보라와 바락, 그리고 야엘</text>
<rect x="34" y="100" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="128" font-size="18" fill="#27665e" font-weight="700">주요 장소</text>
<text x="54" y="157" font-size="22" fill="#173039" font-weight="400">하솔·하로셋 학고임·다볼 산·기손 강·야엘의 장막</text>
<text x="34" y="202" font-size="18" fill="#27665e" font-weight="700">본문의 흐름</text>
<rect x="34" y="215" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="247" font-size="19" fill="#27665e" font-weight="700">1–10절</text>
<text x="158" y="247" font-size="22" fill="#173039" font-weight="400">야빈의 압제와 바락의 소집</text>
<path d="M410 270v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="286" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="318" font-size="19" fill="#27665e" font-weight="700">11–16절</text>
<text x="158" y="318" font-size="22" fill="#173039" font-weight="400">다볼에서 내려온 바락이 시스라의 군대를 격파함</text>
<path d="M410 341v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="357" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="389" font-size="19" fill="#27665e" font-weight="700">17–24절</text>
<text x="158" y="389" font-size="22" fill="#173039" font-weight="400">야엘의 장막에서 시스라가 죽음</text>
<rect x="34" y="426" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="454" font-size="18" fill="#27665e" font-weight="700">주요 기물·표지</text>
<text x="54" y="483" font-size="22" fill="#173039" font-weight="400">철 병거·우유·장막 말뚝·망치</text>
<text x="34" y="526" font-size="17" fill="#526862" font-weight="400">기록 사진은 장의 별도 그림에서 볼 수 있습니다.</text>
<text x="34" y="550" font-size="16" fill="#526862" font-weight="400">개역개정 4판·개역한글 대조 / 호크마 참고 / 지도 축척 없음</text>
</svg>
