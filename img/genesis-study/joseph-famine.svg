<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 276" role="img" aria-labelledby="joseph-famine-title joseph-famine-desc" xml:lang="ko">
  <title id="joseph-famine-title">풍년의 곡식으로 기근에 대비하다</title>
  <desc id="joseph-famine-desc">창세기 41:25–57. 요셉은 바로의 꿈을 해석하고 풍년의 곡식을 여러 성에 저장한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#557662"/>
    </marker>
  </defs>
  <rect width="704" height="276" rx="20" fill="#f7f4e9"/>
  <g font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="18" fill="#263e38">
    <text x="352" y="45" text-anchor="middle" font-size="26" font-weight="bold">풍년의 곡식으로 기근에 대비하다</text>
    <text x="352" y="75" text-anchor="middle" font-size="17">창세기 41:25–57</text>
    <rect x="26" y="111" width="200" height="102" rx="16" fill="#dcebdd"/>
    <text x="126" y="151" text-anchor="middle" font-size="20" font-weight="bold">풍년 7년</text>
    <text x="126" y="183" text-anchor="middle" font-size="16">곡식을 거두어 저장</text>
    <path d="M230 163h17" fill="none" stroke="#557662" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="252" y="111" width="200" height="102" rx="16" fill="#f7e8bf"/>
    <text x="352" y="151" text-anchor="middle" font-size="20" font-weight="bold">기근 7년</text>
    <text x="352" y="183" text-anchor="middle" font-size="16">저장한 곡식을 풀어 판매</text>
    <path d="M456 163h17" fill="none" stroke="#557662" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="478" y="111" width="200" height="102" rx="16" fill="#d9e8f2"/>
    <text x="578" y="151" text-anchor="middle" font-size="20" font-weight="bold">여러 나라</text>
    <text x="578" y="183" text-anchor="middle" font-size="16">곡식을 사러 애굽으로 옴</text>
    <text x="352" y="250" text-anchor="middle" font-size="18">요셉은 바로의 꿈을 해석하고 풍년의 곡식을 여러 성에 저장한다.</text>
  </g>
</svg>
