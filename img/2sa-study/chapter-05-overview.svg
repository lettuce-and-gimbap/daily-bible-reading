<svg xmlns="http://www.w3.org/2000/svg" width="820" height="618" viewBox="0 0 820 618" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">삼하 5장 · 헤브론의 언약과 다윗 성</title><desc id="desc">헤브론·예루살렘·시온·르바임 골짜기·게바에서 게셀까지 / 1–5 장로들이 언약을 맺고 다윗을 왕으로 세움 → 6–16 시온을 점령하고 다윗이 성에 거주함 → 17–25 르바임 골짜기의 두 차례 전투 / 시온 산성·밀로·백향목·블레셋 신상 / 5:8에서 개역개정 ‘물 긷는 데’와 개역한글의 ‘수구’의 실체는 불확실해 실제 침투 경로를 그리지 않았습니다.</desc>
<rect width="820" height="618" rx="20" fill="#f5f3eb"/>
<text x="34" y="36" font-size="19" fill="#27665e" font-weight="700">삼하 5장  ·  본문 도해</text>
<text x="34" y="77" font-size="32" fill="#173039" font-weight="700">헤브론의 언약과 다윗 성</text>
<rect x="34" y="100" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="128" font-size="18" fill="#27665e" font-weight="700">주요 장소</text>
<text x="54" y="157" font-size="22" fill="#173039" font-weight="400">헤브론·예루살렘·시온·르바임 골짜기·게바에서 게셀까지</text>
<text x="34" y="202" font-size="18" fill="#27665e" font-weight="700">본문의 흐름</text>
<rect x="34" y="215" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="247" font-size="19" fill="#27665e" font-weight="700">1–5절</text>
<text x="158" y="247" font-size="22" fill="#173039" font-weight="400">장로들이 언약을 맺고 다윗을 왕으로 세움</text>
<path d="M410 270v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="286" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="318" font-size="19" fill="#27665e" font-weight="700">6–16절</text>
<text x="158" y="318" font-size="22" fill="#173039" font-weight="400">시온을 점령하고 다윗이 성에 거주함</text>
<path d="M410 341v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="357" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="389" font-size="19" fill="#27665e" font-weight="700">17–25절</text>
<text x="158" y="389" font-size="22" fill="#173039" font-weight="400">르바임 골짜기의 두 차례 전투</text>
<rect x="34" y="426" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="454" font-size="18" fill="#27665e" font-weight="700">주요 기물·표지</text>
<text x="54" y="483" font-size="22" fill="#173039" font-weight="400">시온 산성·밀로·백향목·블레셋 신상</text>
<text x="34" y="522" font-size="18" fill="#6a4d32" font-weight="400">5:8에서 개역개정 ‘물 긷는 데’와 개역한글의 ‘수구’의 실체는 불확실해</text>
<text x="34" y="546" font-size="18" fill="#6a4d32" font-weight="400">실제 침투 경로를 그리지 않았습니다.</text>
<text x="34" y="574" font-size="17" fill="#526862" font-weight="400">기록 사진은 장의 별도 그림에서 볼 수 있습니다.</text>
<text x="34" y="598" font-size="16" fill="#526862" font-weight="400">개역개정 4판·개역한글 대조 / 호크마 참고 / 지도 축척 없음</text>
</svg>
