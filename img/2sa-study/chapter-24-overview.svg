<svg xmlns="http://www.w3.org/2000/svg" width="820" height="570" viewBox="0 0 820 570" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">삼하 24장 · 인구 조사에서 아라우나의 제단까지</title><desc id="desc">단에서 브엘세바까지·요단 동편·두로 쪽·예루살렘의 타작마당 / 1–9 요압 일행이 백성을 계수함 → 10–17 다윗이 자책하고 전염병 중에 백성을 위해 간구함 → 18–25 타작마당을 사서 제단을 쌓고 재앙이 그침 / 타작마당·소·타작 도구·은 오십 세겔·제단</desc>
<rect width="820" height="570" rx="20" fill="#f5f3eb"/>
<text x="34" y="36" font-size="19" fill="#27665e" font-weight="700">삼하 24장  ·  본문 도해</text>
<text x="34" y="77" font-size="32" fill="#173039" font-weight="700">인구 조사에서 아라우나의 제단까지</text>
<rect x="34" y="100" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="128" font-size="18" fill="#27665e" font-weight="700">주요 장소</text>
<text x="54" y="157" font-size="22" fill="#173039" font-weight="400">단에서 브엘세바까지·요단 동편·두로 쪽·예루살렘의 타작마당</text>
<text x="34" y="202" font-size="18" fill="#27665e" font-weight="700">본문의 흐름</text>
<rect x="34" y="215" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="247" font-size="19" fill="#27665e" font-weight="700">1–9절</text>
<text x="158" y="247" font-size="22" fill="#173039" font-weight="400">요압 일행이 백성을 계수함</text>
<path d="M410 270v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="286" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="318" font-size="19" fill="#27665e" font-weight="700">10–17절</text>
<text x="158" y="318" font-size="22" fill="#173039" font-weight="400">다윗이 자책하고 전염병 중에 백성을 위해 간구함</text>
<path d="M410 341v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="357" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="389" font-size="19" fill="#27665e" font-weight="700">18–25절</text>
<text x="158" y="389" font-size="22" fill="#173039" font-weight="400">타작마당을 사서 제단을 쌓고 재앙이 그침</text>
<rect x="34" y="426" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="454" font-size="18" fill="#27665e" font-weight="700">주요 기물·표지</text>
<text x="54" y="483" font-size="22" fill="#173039" font-weight="400">타작마당·소·타작 도구·은 오십 세겔·제단</text>
<text x="34" y="526" font-size="17" fill="#526862" font-weight="400">이 장에는 본문 도해를 제공합니다.</text>
<text x="34" y="550" font-size="16" fill="#526862" font-weight="400">개역개정 4판·개역한글 대조 / 호크마 참고 / 지도 축척 없음</text>
</svg>
