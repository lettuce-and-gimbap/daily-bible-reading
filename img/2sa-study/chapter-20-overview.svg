<svg xmlns="http://www.w3.org/2000/svg" width="820" height="618" viewBox="0 0 820 618" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">삼하 20장 · 세바의 반란과 아벨 성의 협상</title><desc id="desc">예루살렘·기브온 큰 바위·아벨 벧마아가 / 1–7 세바가 반란을 일으키고 추격대가 나섬 → 8–13 요압이 아마사를 죽이고 추격을 이어 감 → 14–26 지혜로운 여인이 성을 지키고 반란이 끝남 / 세바의 나팔·요압의 칼·성벽·공성 토루 / 호크마 정리의 8–9절과 11–26절에 해설 공백이 있어 두 번역 본문을 기준으로 삼았습니다.</desc>
<rect width="820" height="618" rx="20" fill="#f5f3eb"/>
<text x="34" y="36" font-size="19" fill="#27665e" font-weight="700">삼하 20장  ·  본문 도해</text>
<text x="34" y="77" font-size="32" fill="#173039" font-weight="700">세바의 반란과 아벨 성의 협상</text>
<rect x="34" y="100" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="128" font-size="18" fill="#27665e" font-weight="700">주요 장소</text>
<text x="54" y="157" font-size="22" fill="#173039" font-weight="400">예루살렘·기브온 큰 바위·아벨 벧마아가</text>
<text x="34" y="202" font-size="18" fill="#27665e" font-weight="700">본문의 흐름</text>
<rect x="34" y="215" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="247" font-size="19" fill="#27665e" font-weight="700">1–7절</text>
<text x="158" y="247" font-size="22" fill="#173039" font-weight="400">세바가 반란을 일으키고 추격대가 나섬</text>
<path d="M410 270v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="286" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="318" font-size="19" fill="#27665e" font-weight="700">8–13절</text>
<text x="158" y="318" font-size="22" fill="#173039" font-weight="400">요압이 아마사를 죽이고 추격을 이어 감</text>
<path d="M410 341v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="357" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="389" font-size="19" fill="#27665e" font-weight="700">14–26절</text>
<text x="158" y="389" font-size="22" fill="#173039" font-weight="400">지혜로운 여인이 성을 지키고 반란이 끝남</text>
<rect x="34" y="426" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="454" font-size="18" fill="#27665e" font-weight="700">주요 기물·표지</text>
<text x="54" y="483" font-size="22" fill="#173039" font-weight="400">세바의 나팔·요압의 칼·성벽·공성 토루</text>
<text x="34" y="522" font-size="18" fill="#6a4d32" font-weight="400">호크마 정리의 8–9절과 11–26절에 해설 공백이 있어 두 번역 본문을</text>
<text x="34" y="546" font-size="18" fill="#6a4d32" font-weight="400">기준으로 삼았습니다.</text>
<text x="34" y="574" font-size="17" fill="#526862" font-weight="400">이 장에는 본문 도해를 제공합니다.</text>
<text x="34" y="598" font-size="16" fill="#526862" font-weight="400">개역개정 4판·개역한글 대조 / 호크마 참고 / 지도 축척 없음</text>
</svg>
