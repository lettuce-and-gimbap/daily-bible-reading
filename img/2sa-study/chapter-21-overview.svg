<svg xmlns="http://www.w3.org/2000/svg" width="820" height="594" viewBox="0 0 820 594" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">삼하 21장 · 기근과 리스바, 블레셋 전투</title><desc id="desc">기브온·야베스 길르앗·셀라·곱·가드 / 1–9 기근의 원인을 묻고 기브온 사람들에게 일곱 명을 넘김 → 10–14 리스바가 시신을 지키고 다윗이 뼈를 이장함 → 15–22 블레셋 용사들과의 전투를 기록함 / 굵은 베·바위·사울과 요나단의 뼈·창 / 21:19의 골리앗 관련 구절은 두 번역 모두 골리앗의 아우 라흐미로 전합니다.</desc>
<rect width="820" height="594" rx="20" fill="#f5f3eb"/>
<text x="34" y="36" font-size="19" fill="#27665e" font-weight="700">삼하 21장  ·  본문 도해</text>
<text x="34" y="77" font-size="32" fill="#173039" font-weight="700">기근과 리스바, 블레셋 전투</text>
<rect x="34" y="100" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="128" font-size="18" fill="#27665e" font-weight="700">주요 장소</text>
<text x="54" y="157" font-size="22" fill="#173039" font-weight="400">기브온·야베스 길르앗·셀라·곱·가드</text>
<text x="34" y="202" font-size="18" fill="#27665e" font-weight="700">본문의 흐름</text>
<rect x="34" y="215" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="247" font-size="19" fill="#27665e" font-weight="700">1–9절</text>
<text x="158" y="247" font-size="22" fill="#173039" font-weight="400">기근의 원인을 묻고 기브온 사람들에게 일곱 명을 넘김</text>
<path d="M410 270v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="286" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="318" font-size="19" fill="#27665e" font-weight="700">10–14절</text>
<text x="158" y="318" font-size="22" fill="#173039" font-weight="400">리스바가 시신을 지키고 다윗이 뼈를 이장함</text>
<path d="M410 341v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="357" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="389" font-size="19" fill="#27665e" font-weight="700">15–22절</text>
<text x="158" y="389" font-size="22" fill="#173039" font-weight="400">블레셋 용사들과의 전투를 기록함</text>
<rect x="34" y="426" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="454" font-size="18" fill="#27665e" font-weight="700">주요 기물·표지</text>
<text x="54" y="483" font-size="22" fill="#173039" font-weight="400">굵은 베·바위·사울과 요나단의 뼈·창</text>
<text x="34" y="522" font-size="18" fill="#6a4d32" font-weight="400">21:19의 골리앗 관련 구절은 두 번역 모두 골리앗의 아우 라흐미로 전합니다.</text>
<text x="34" y="550" font-size="17" fill="#526862" font-weight="400">이 장에는 본문 도해를 제공합니다.</text>
<text x="34" y="574" font-size="16" fill="#526862" font-weight="400">개역개정 4판·개역한글 대조 / 호크마 참고 / 지도 축척 없음</text>
</svg>
