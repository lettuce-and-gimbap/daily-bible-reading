<svg xmlns="http://www.w3.org/2000/svg" width="820" height="594" viewBox="0 0 820 594" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">삼하 8장 · 주변 나라와 다윗의 행정</title><desc id="desc">블레셋·모압·소바·다메섹·하맛·소금 골짜기·에돔 / 1–8 블레셋·모압·소바·다메섹과 싸움 → 9–14 하맛 왕의 예물과 전리품 봉헌, 에돔 복속 → 15–18 다윗의 통치와 관리 명단 / 병거·금 방패·은과 금과 놋 그릇 / 8:13의 지명은 개역개정 ‘소금 골짜기’, 개역한글 ‘염곡’입니다.</desc>
<rect width="820" height="594" rx="20" fill="#f5f3eb"/>
<text x="34" y="36" font-size="19" fill="#27665e" font-weight="700">삼하 8장  ·  본문 도해</text>
<text x="34" y="77" font-size="32" fill="#173039" font-weight="700">주변 나라와 다윗의 행정</text>
<rect x="34" y="100" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="128" font-size="18" fill="#27665e" font-weight="700">주요 장소</text>
<text x="54" y="157" font-size="22" fill="#173039" font-weight="400">블레셋·모압·소바·다메섹·하맛·소금 골짜기·에돔</text>
<text x="34" y="202" font-size="18" fill="#27665e" font-weight="700">본문의 흐름</text>
<rect x="34" y="215" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="247" font-size="19" fill="#27665e" font-weight="700">1–8절</text>
<text x="158" y="247" font-size="22" fill="#173039" font-weight="400">블레셋·모압·소바·다메섹과 싸움</text>
<path d="M410 270v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="286" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="318" font-size="19" fill="#27665e" font-weight="700">9–14절</text>
<text x="158" y="318" font-size="22" fill="#173039" font-weight="400">하맛 왕의 예물과 전리품 봉헌, 에돔 복속</text>
<path d="M410 341v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="357" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="389" font-size="19" fill="#27665e" font-weight="700">15–18절</text>
<text x="158" y="389" font-size="22" fill="#173039" font-weight="400">다윗의 통치와 관리 명단</text>
<rect x="34" y="426" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="454" font-size="18" fill="#27665e" font-weight="700">주요 기물·표지</text>
<text x="54" y="483" font-size="22" fill="#173039" font-weight="400">병거·금 방패·은과 금과 놋 그릇</text>
<text x="34" y="522" font-size="18" fill="#6a4d32" font-weight="400">8:13의 지명은 개역개정 ‘소금 골짜기’, 개역한글 ‘염곡’입니다.</text>
<text x="34" y="550" font-size="17" fill="#526862" font-weight="400">이 장에는 본문 도해를 제공합니다.</text>
<text x="34" y="574" font-size="16" fill="#526862" font-weight="400">개역개정 4판·개역한글 대조 / 호크마 참고 / 지도 축척 없음</text>
</svg>
