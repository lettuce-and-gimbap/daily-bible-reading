<desc id="desc">에스더의 잔치 자리 · 왕궁 후원 · 하만의 집 / 에스더가 자기 민족을 살려 달라 청함 (1–6절) → 왕이 후원에 나갔다가 돌아옴 (7–8절) → 하만이 모르드개를 위해 세운 나무에 달림 (9–10절) / 잔치 자리 · 걸상 · 오십 규빗 나무</desc>
