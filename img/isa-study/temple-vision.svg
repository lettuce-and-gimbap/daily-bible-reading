<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">이사야 6장 · 성전의 환상</title><desc id="desc">높은 보좌와 향연을 상징으로 그린 창작 도해. 하나님이나 실제 성전의 모습을 복원한 그림이 아닙니다.</desc><rect width="800" height="450" rx="24" fill="#f6f1e5"/><path d="M115 360V118q0-30 30-30h510q30 0 30 30v242" fill="#e3d7bb" stroke="#ad9a7e" stroke-width="8"/><path d="M300 355V204q0-63 100-63t100 63v151" fill="#b59c7c"/><path d="M314 300h172v55H314z" fill="#88755e"/><path d="M205 355h390" stroke="#9b886f" stroke-width="10"/><path d="M360 130q-17-20 0-39 M400 120q-17-20 0-42 M440 130q-17-20 0-39" fill="none" stroke="#b6bdad" stroke-width="9" stroke-linecap="round"/><path d="M130 225q75-84 130 0 M540 225q55-84 130 0" fill="none" stroke="#c5a77e" stroke-width="10"/><text x="30" y="44" font-family="sans-serif" font-size="24" fill="#38554b">이사야 6장 · 보좌와 성전의 환상</text><text x="73" y="412" font-family="sans-serif" font-size="19" fill="#38554b">창작 도해 · 환상의 상징이며 실제 성전이나 하나님의 모습이 아닙니다</text></svg>
