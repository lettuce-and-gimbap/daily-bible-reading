<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">바벨론 강변에서 기억하는 시온</title><desc id="desc">수로와 나무에 걸린 수금의 개념도입니다. 강변의 정확한 위치와 악기 형태는 특정되지 않습니다.</desc><rect width="800" height="450" rx="24" fill="#eee5d6"/><circle cx="676" cy="112" r="48" fill="#dda976"/><path d="M0 284 Q170 250 330 290 T800 275 V450 H0Z" fill="#d5bb93"/><path d="M0 363 Q170 300 345 358 T800 337 V450 H0Z" fill="#86b4b6"/><path d="M0 391 Q150 343 300 386 T650 372" fill="none" stroke="#d3e4d9" stroke-width="6"/><path d="M273 335 Q280 235 252 155 M260 208 Q206 153 128 148 M254 198 Q319 145 383 157" fill="none" stroke="#6d5444" stroke-width="17" stroke-linecap="round"/><g fill="none" stroke="#849d77" stroke-width="8" stroke-linecap="round"><path d="M105 147q22 20 28 72m12-70q18 20 22 61m12-54q23 20 22 61m110-60q-14 29-10 64m34-65q-14 30-9 63m33-61q-7 27-3 55"/></g><g transform="translate(342 201)" stroke="#71503e" stroke-width="7" fill="none"><path d="M0 0 Q8 70 25 79 Q48 87 64 72 L70 0 M0 0 Q35 -12 70 0 M17 6v63 M29 4v72 M41 4v72 M53 5v66"/></g><text x="40" y="55" font-size="24" fill="#574b42" font-family="sans-serif">시편 137:1–4 · 바벨론의 강변</text><text x="408" y="246" font-size="19" fill="#574b42" font-family="sans-serif">나무에 걸린 수금</text><text x="40" y="428" font-size="18" fill="#385a5b" font-family="sans-serif">여러 강변의 정확한 위치는 본문에 명시되지 않음</text></svg>
