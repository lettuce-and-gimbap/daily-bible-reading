<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">시편 18:2 · 반석과 요새 (보호의 비유)</title><desc id="desc">반석과 요새와 방패를 나타낸 창작 도해. 본문의 시적 이미지이며 현장이나 유물의 복원이 아닙니다.</desc><rect width="800" height="450" rx="24" fill="#f6f1e4"/><path d="M30 340 L150 190 220 250 300 125 390 280 480 205 610 340Z" fill="#a89a82"/><path d="M260 190 V137 H290 V108 H320 V137 H350 V108 H380 V137 H408 V218Z" fill="#776b60"/><path d="M322 218 V174 Q335 155 350 174 V218" fill="#e5dcc6"/><path d="M500 240 L550 218 600 240 V290 Q590 320 550 340 Q510 320 500 290Z" fill="#c29c63" stroke="#705946" stroke-width="6"/><path d="M550 231 V323 M510 270 H590" stroke="#f1dfb4" stroke-width="5"/><text x="32" y="48" font-size="23" fill="#38554b" font-family="sans-serif">시편 18:2 · 반석과 요새 (보호의 비유)</text><rect x="20" y="399" width="760" height="38" rx="8" fill="#f6f1e4" fill-opacity=".88"/><text x="36" y="425" font-size="19" fill="#38554b" font-family="sans-serif">반석과 요새</text><text x="430" y="425" font-size="19" fill="#38554b" font-family="sans-serif">방패</text></svg>