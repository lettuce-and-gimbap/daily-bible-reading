<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">시편 46:2–4 · 흔들리는 산과 흐르는 시내 (시적 대비)</title><desc id="desc">요동하는 바다와 산와 성을 기쁘게 하는 시내를 나타낸 창작 도해. 본문의 시적 이미지이며 현장이나 유물의 복원이 아닙니다.</desc><rect width="800" height="450" rx="24" fill="#f6f1e4"/><path d="M0 322 L130 124 215 254 270 178 380 343Z" fill="#9d9386"/><path d="M30 345 Q110 310 170 345 T310 345 T450 345" stroke="#729fa8" stroke-width="13" fill="none"/><path d="M135 180 l-25 48 35 -12 -22 50" stroke="#f1e5cf" stroke-width="7" fill="none"/><path d="M475 302 V207 H510 V178 H545 V207 H579 V177 H614 V207 H645 V302Z" fill="#b8a582"/><path d="M535 302 V250 Q557 225 580 250 V302" fill="#6e7e75"/><path d="M420 350 Q500 300 580 350 T800 345 V450 H420Z" fill="#89c5c2"/><path d="M450 382 Q540 343 630 382 T800 376" stroke="#e8f2e5" stroke-width="7" fill="none"/><text x="32" y="48" font-size="23" fill="#38554b" font-family="sans-serif">시편 46:2–4 · 흔들리는 산과 흐르는 시내 (시적 대비)</text><rect x="20" y="399" width="760" height="38" rx="8" fill="#f6f1e4" fill-opacity=".88"/><text x="36" y="425" font-size="19" fill="#38554b" font-family="sans-serif">요동하는 바다와 산</text><text x="430" y="425" font-size="19" fill="#38554b" font-family="sans-serif">성을 기쁘게 하는 시내</text></svg>