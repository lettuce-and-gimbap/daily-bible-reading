<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">시편 119:105 · 길을 비추는 등 (말씀의 비유)</title><desc id="desc">등불와 길 · 등잔 형태는 예시를 나타낸 창작 도해. 본문의 시적 이미지이며 현장이나 유물의 복원이 아닙니다.</desc><rect width="800" height="450" rx="24" fill="#f6f1e4"/><path d="M0 450 Q155 310 360 345 Q575 375 800 210 V450Z" fill="#cbbb9e"/><path d="M22 421 Q195 340 350 365 Q570 405 765 258" stroke="#efe5ce" stroke-width="6" stroke-dasharray="14 14" fill="none"/><path d="M265 268 Q315 270 365 260 Q360 302 315 310 Q276 302 265 268Z" fill="#af7556" stroke="#77533e" stroke-width="5"/><path d="M355 268 L389 259 Q398 260 390 269 L365 279" fill="#af7556" stroke="#77533e" stroke-width="5"/><path d="M382 254 Q370 239 384 218 Q403 237 391 254Z" fill="#e6aa4f"/><path d="M382 210 l0 -26 M409 224 l20 -16 M351 224 l-18 -17" stroke="#e7b95e" stroke-width="5"/><text x="32" y="48" font-size="23" fill="#38554b" font-family="sans-serif">시편 119:105 · 길을 비추는 등 (말씀의 비유)</text><rect x="20" y="399" width="760" height="38" rx="8" fill="#f6f1e4" fill-opacity=".88"/><text x="36" y="425" font-size="19" fill="#38554b" font-family="sans-serif">등불</text><text x="430" y="425" font-size="19" fill="#38554b" font-family="sans-serif">길 · 등잔 형태는 예시</text></svg>