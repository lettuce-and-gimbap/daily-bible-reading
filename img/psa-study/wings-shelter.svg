<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">시편 91:4 · 날개 아래 피함 (보호의 비유)</title><desc id="desc">날개 아래 피하는 모습와 방패를 나타낸 창작 도해. 본문의 시적 이미지이며 현장이나 유물의 복원이 아닙니다.</desc><rect width="800" height="450" rx="24" fill="#f6f1e4"/><path d="M400 210 C340 110 170 100 110 180 Q130 300 295 310 Q340 310 400 250 Q460 310 505 310 Q670 300 690 180 C630 100 460 110 400 210Z" fill="#aa896d"/><path d="M125 190 Q225 280 360 240 M150 220 Q240 315 365 260 M675 190 Q575 280 440 240 M650 220 Q560 315 435 260" fill="none" stroke="#dfc7a4" stroke-width="8"/><circle cx="400" cy="265" r="17" fill="#5f7067"/><path d="M375 325 Q378 284 400 284 Q422 284 425 325Z" fill="#5f7067"/><path d="M520 270 L553 257 586 270 V302 Q580 321 553 333 Q526 321 520 302Z" fill="#bd9d65"/><text x="32" y="48" font-size="23" fill="#38554b" font-family="sans-serif">시편 91:4 · 날개 아래 피함 (보호의 비유)</text><rect x="20" y="399" width="760" height="38" rx="8" fill="#f6f1e4" fill-opacity=".88"/><text x="36" y="425" font-size="19" fill="#38554b" font-family="sans-serif">날개 아래 피하는 모습</text><text x="430" y="425" font-size="19" fill="#38554b" font-family="sans-serif">방패</text></svg>