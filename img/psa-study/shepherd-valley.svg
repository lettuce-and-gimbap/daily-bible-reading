<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">목자의 돌봄과 골짜기</title><desc id="desc">풀밭과 물, 골짜기와 목자의 도구로 시편 23편의 비유를 표현합니다. 실제 지형 재현이 아닙니다.</desc><rect width="800" height="450" rx="24" fill="#f2eee2"/><path d="M0 262 L160 110 285 265 430 105 800 298 V450 H0Z" fill="#adbbb0"/><path d="M240 276 L425 105 650 318 520 450 H323Z" fill="#708d83"/><path d="M0 316 Q165 244 312 320 T800 315 V450 H0Z" fill="#b7c99a"/><path d="M0 391 Q170 336 316 391 T630 385 Q735 365 800 382 V450 H0Z" fill="#8ac3c4"/><g fill="#fffaf0" stroke="#61766d" stroke-width="4"><ellipse cx="188" cy="310" rx="46" ry="29"/><circle cx="231" cy="307" r="16"/><path d="M162 333v18m42-18v18"/></g><path d="M584 313 V156 Q584 126 610 126 Q637 126 637 150" fill="none" stroke="#765443" stroke-width="13" stroke-linecap="round"/><path d="M657 322 L691 194" fill="none" stroke="#765443" stroke-width="13" stroke-linecap="round"/><text x="40" y="55" font-size="24" fill="#38554b" font-family="sans-serif">시편 23:1–4 · 목자의 비유</text><text x="64" y="431" font-size="19" fill="#38554b" font-family="sans-serif">풀밭과 물가</text><text x="334" y="282" font-size="19" fill="#fff" font-family="sans-serif">어두운 골짜기</text><text x="560" y="357" font-size="19" fill="#38554b" font-family="sans-serif">지팡이와 막대기</text></svg>
