<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">시편 42:1 · 시냇물을 찾는 사슴 (갈망의 비유)</title><desc id="desc">목마른 사슴와 시냇물를 나타낸 창작 도해. 본문의 시적 이미지이며 현장이나 유물의 복원이 아닙니다.</desc><rect width="800" height="450" rx="24" fill="#f6f1e4"/><path d="M0 330 Q220 290 400 340 T800 320 V450 H0Z" fill="#d2d7b2"/><path d="M0 385 Q200 340 370 387 T800 372 V450 H0Z" fill="#8dc4c5"/><path d="M190 250 Q250 210 320 240 L355 278 330 300 290 275 275 340 258 340 250 283 220 284 195 342 178 342 185 275Z" fill="#a67958"/><path d="M320 245 Q350 215 365 220 L382 245 365 259 343 260Z" fill="#a67958"/><circle cx="365" cy="236" r="4" fill="#343d35"/><path d="M375 272 Q400 285 426 275 M400 290 Q420 300 440 291" stroke="#edf6e9" stroke-width="5" fill="none"/><text x="32" y="48" font-size="23" fill="#38554b" font-family="sans-serif">시편 42:1 · 시냇물을 찾는 사슴 (갈망의 비유)</text><rect x="20" y="399" width="760" height="38" rx="8" fill="#f6f1e4" fill-opacity=".88"/><text x="36" y="425" font-size="19" fill="#38554b" font-family="sans-serif">목마른 사슴</text><text x="430" y="425" font-size="19" fill="#38554b" font-family="sans-serif">시냇물</text></svg>