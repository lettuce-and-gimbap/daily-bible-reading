<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">시편 84:3 · 제비의 보금자리 (성소를 향한 시)</title><desc id="desc">새의 보금자리와 성소는 상징적 표현를 나타낸 창작 도해. 본문의 시적 이미지이며 현장이나 유물의 복원이 아닙니다.</desc><rect width="800" height="450" rx="24" fill="#f6f1e4"/><path d="M90 345 V145 H710 V345" fill="#ded0ae"/><path d="M75 145 H725 L400 75Z" fill="#a58b70"/><path d="M150 345 V190 H190 V345 M610 345 V190 H650 V345" fill="#b6a080"/><path d="M315 330 V225 Q400 155 485 225 V330Z" fill="#879789"/><path d="M450 185 Q485 213 535 185 Q526 220 491 221 Q462 217 450 185" fill="#a77e5d"/><circle cx="481" cy="190" r="12" fill="#f6e2af"/><circle cx="508" cy="191" r="12" fill="#f6e2af"/><path d="M350 170 Q380 120 421 150 Q400 150 390 174 Q372 157 350 170Z" fill="#5c6f70"/><text x="32" y="48" font-size="23" fill="#38554b" font-family="sans-serif">시편 84:3 · 제비의 보금자리 (성소를 향한 시)</text><rect x="20" y="399" width="760" height="38" rx="8" fill="#f6f1e4" fill-opacity=".88"/><text x="36" y="425" font-size="19" fill="#38554b" font-family="sans-serif">새의 보금자리</text><text x="430" y="425" font-size="19" fill="#38554b" font-family="sans-serif">성소는 상징적 표현</text></svg>