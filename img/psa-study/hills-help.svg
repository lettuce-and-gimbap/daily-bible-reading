<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">시편 121:1–2 · 산을 향한 눈과 도움 (시적 이미지)</title><desc id="desc">산을 바라보는 순례자와 산의 정확한 위치는 미상를 나타낸 창작 도해. 본문의 시적 이미지이며 현장이나 유물의 복원이 아닙니다.</desc><rect width="800" height="450" rx="24" fill="#f6f1e4"/><circle cx="630" cy="120" r="42" fill="#e5ba72"/><path d="M0 337 L160 150 280 300 380 175 530 340Z" fill="#9aa99c"/><path d="M220 345 L430 140 590 290 660 230 800 350Z" fill="#7d958c"/><path d="M0 340 Q170 310 315 346 T800 330 V450 H0Z" fill="#c5ceaf"/><circle cx="200" cy="307" r="13" fill="#64766c"/><path d="M200 321 V367 M200 337 L175 350 M200 337 L221 319 M200 367 l-18 27 M200 367 l18 27" stroke="#64766c" stroke-width="9" stroke-linecap="round"/><text x="32" y="48" font-size="23" fill="#38554b" font-family="sans-serif">시편 121:1–2 · 산을 향한 눈과 도움 (시적 이미지)</text><rect x="20" y="399" width="760" height="38" rx="8" fill="#f6f1e4" fill-opacity=".88"/><text x="36" y="425" font-size="19" fill="#38554b" font-family="sans-serif">산을 바라보는 순례자</text><text x="430" y="425" font-size="19" fill="#38554b" font-family="sans-serif">산의 정확한 위치는 미상</text></svg>