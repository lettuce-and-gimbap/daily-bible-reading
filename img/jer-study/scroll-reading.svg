<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">예레미야 36장 · 두루마리와 말씀</title><desc id="desc">글이 적힌 두루마리와 불빛을 상징적으로 그린 창작 도해입니다. 실제 두루마리의 복원은 아닙니다.</desc><rect width="800" height="450" rx="24" fill="#f7f1e4"/><rect x="178" y="118" width="445" height="224" rx="17" fill="#f0e2bd" stroke="#987557" stroke-width="6"/><path d="M187 119v222M613 119v222" stroke="#987557" stroke-width="16" stroke-linecap="round"/><g stroke="#b6a285" stroke-width="5"><path d="M231 164h320M231 192h320M231 220h276M231 248h320M231 276h245"/></g><path d="M680 341q-24-27 0-60q30 32 0 60z" fill="#dfac62"/><text x="30" y="45" font-family="sans-serif" font-size="23" fill="#38554b">예레미야 36장 · 기록되고 다시 전해진 말씀</text><text x="74" y="410" font-family="sans-serif" font-size="19" fill="#38554b">창작 도해 · 두루마리와 불빛은 이야기를 돕는 상징</text></svg>
