<svg xmlns="http://www.w3.org/2000/svg" width="820" height="435" viewBox="0 0 820 435" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">바벨론 연대기의 예루살렘 점령 기록</title>
<desc id="desc">점토판 연대기 · 바벨론의 기록. CDLI · 대영박물관 BM 021946. 바벨론 연대기는 기원전 597년 예루살렘을 점령하고 왕을 교체한 일을 기록해요. 열왕기하 24장과 비교할 자료예요. 25장의 후속 함락과 성전 파괴는 별개의 사건이에요. 원본 사진 대신 기호를 사용한 도해.</desc>
<metadata>https://cdli.earth/artifacts/555785</metadata>
<rect x="0" y="0" width="820" height="435" rx="20" fill="#F6F2E8"/>
<text x="34" y="45" font-size="20" fill="#705029" font-weight="700">점토판 연대기 · 바벨론의 기록</text>
<text x="34" y="93" font-size="31" fill="#182832" font-weight="700">바벨론 연대기의 예루살렘 점령 기록</text>
<rect x="34" y="116" width="752" height="66" rx="12" fill="#ECE2CB"/>
<path transform="translate(53 133) scale(2)" d="M3 2h11v12H5v2H1v-3h2zm3 4v1h5V6zm0 4v1h5v-1z" fill="#705029" fill-rule="evenodd"/>
<text x="105" y="157" font-size="19" fill="#705029" font-weight="700">CDLI · 대영박물관 BM 021946</text>
<text x="34" y="220" font-size="19" fill="#705029" font-weight="700">자료가 보여 주는 내용</text>
<text x="34" y="255" font-size="22" fill="#182832" font-weight="400">바벨론 연대기는 기원전 597년 예루살렘을 점령하고 왕을 교체한</text>
<text x="34" y="285" font-size="22" fill="#182832" font-weight="400">일을 기록해요.</text>
<text x="34" y="328" font-size="19" fill="#705029" font-weight="700">본문과 함께 읽을 때</text>
<text x="34" y="363" font-size="22" fill="#182832" font-weight="400">열왕기하 24장과 비교할 자료예요. 25장의 후속 함락과 성전 파괴는</text>
<text x="34" y="393" font-size="22" fill="#182832" font-weight="400">별개의 사건이에요.</text>
</svg>
