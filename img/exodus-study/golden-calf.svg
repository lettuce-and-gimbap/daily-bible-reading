  <desc id="golden-calf-desc">출애굽기 32:1–20, 30–32. 백성은 모세를 기다리다 금송아지를 만들어 섬긴다. 모세는 산 아래에서 돌판을 깨뜨리고, 이후 백성의 죄를 두고 하나님께 간구한다.</desc>
