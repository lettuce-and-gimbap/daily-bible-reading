  <title id="sinai-covenant-title">시내 산에서 언약을 준비하다</title>
  <desc id="sinai-covenant-desc">출애굽기 19:1–20. 백성은 산 아래에서 준비하고 모세는 부르심을 따라 산으로 올라간다. 산 위에는 구름과 연기가 나타난다.</desc>
