<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 328" role="img" aria-labelledby="passover-night-title passover-night-desc" xml:lang="ko">
  <title id="passover-night-title">유월절 밤, 문에 바른 피</title>
  <desc id="passover-night-desc">출애굽기 12:3–14, 21–28. 어린양의 피를 문 위와 양쪽 문설주에 바르고, 집 안에서는 어린양과 무교병과 쓴 나물을 먹는다.</desc>
  <rect x="0" y="0" width="704" height="328" rx="20" fill="#f9f4e9"/>
  <g font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <g font-weight="700"><text x="352" y="43" text-anchor="middle" font-size="30" fill="#273c3d">유월절 밤, 문에 바른 피</text></g>
    <text x="352" y="76" text-anchor="middle" font-size="18" fill="#286b71">출애굽기 12:3–14, 21–28</text>
