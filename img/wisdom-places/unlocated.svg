<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">위치가 확정되지 않은 이름</title><desc id="desc">우스, 오빌, 다시스를 위치 미상으로 표시한 삽화. 각 이름 옆에 욥의 고향, 금, 먼 바닷길이라는 본문 단서가 있다.</desc>
<style>
