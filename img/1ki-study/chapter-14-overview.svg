<rect x="34" y="344" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="358" width="97" height="34" rx="9" fill="#E1EBE3"/>
<text x="59" y="382" font-size="17" fill="#225C52" font-weight="700">21–24절</text>
<text x="170" y="383" font-size="23" fill="#182832" font-weight="400">르호보암 치하 유다에 우상 숭배가 퍼짐</text>
<path d="M410 410v14m-5 -6 5 6 5 -6" fill="none" stroke="#225C52" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="429" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="443" width="97" height="34" rx="9" fill="#E1EBE3"/>
<text x="59" y="467" font-size="17" fill="#225C52" font-weight="700">25–31절</text>
<text x="170" y="468" font-size="23" fill="#182832" font-weight="400">시삭이 보물을 가져가고 놋 방패가 금 방패를 대신함</text>
