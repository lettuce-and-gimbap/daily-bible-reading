<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기상 14장 · 두 왕가에 닥친 심판</title>
<desc id="desc">주요 장소: 실로·디르사·예루살렘·여호와의 집. 본문의 흐름: 1–20 아히야가 여로보암 집의 심판을 전하고 왕자가 죽음 → 21–24 르호보암 치하 유다에 우상 숭배가 퍼짐 → 25–31 시삭이 보물을 가져가고 놋 방패가 금 방패를 대신함. 주요 기물과 표지: 떡·과자·꿀병·성전과 왕궁의 보물·금과 놋 방패.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#225C52" font-weight="700">열왕기상 14장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">두 왕가에 닥친 심판</text>
<rect x="711" y="28" width="75" height="75" rx="14" fill="#E1EBE3"/>
<path transform="translate(725 41) scale(2.85)" d="M0 3h3v3h3V3h4v3h3V3h3v13h-6v-5H6v5H0z" fill="#225C52" fill-rule="evenodd"/>
<rect x="34" y="126" width="752" height="84" rx="12" fill="#E1EBE3"/>
