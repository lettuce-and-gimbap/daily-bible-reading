<rect x="34" y="429" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="443" width="97" height="34" rx="9" fill="#E1EBE3"/>
<text x="59" y="467" font-size="17" fill="#225C52" font-weight="700">13–18절</text>
<text x="170" y="468" font-size="23" fill="#182832" font-weight="400">일꾼들이 목재와 돌을 준비함</text>
