<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기상 5장 · 두로와 맺은 목재 협정</title>
<desc id="desc">주요 장소: 두로·레바논·바다·성전 공사 터. 본문의 흐름: 1–6 솔로몬이 히람에게 성전 목재를 요청함 → 7–12 히람이 목재를 보내고 솔로몬이 식량을 댐 → 13–18 일꾼들이 목재와 돌을 준비함. 주요 기물과 표지: 백향목·잣나무·뗏목·밀과 기름·다듬은 돌.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#225C52" font-weight="700">열왕기상 5장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">두로와 맺은 목재 협정</text>
<rect x="711" y="28" width="75" height="75" rx="14" fill="#E1EBE3"/>
