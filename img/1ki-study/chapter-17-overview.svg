<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기상 17장 · 가뭄 속의 엘리야와 사르밧 과부</title>
<desc id="desc">주요 장소: 길르앗·그릿 시내·시돈의 사르밧·과부의 다락. 본문의 흐름: 1–7 엘리야가 가뭄을 알리고 그릿에서 먹을 것을 받음 → 8–16 과부가 음식을 나누고 가루와 기름이 이어짐 → 17–24 엘리야가 간구하자 과부의 아들이 살아남. 주요 기물과 표지: 까마귀가 가져온 떡과 고기·가루통·기름병·침상.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#225C52" font-weight="700">열왕기상 17장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">가뭄 속의 엘리야와 사르밧 과부</text>
<rect x="711" y="28" width="75" height="75" rx="14" fill="#E1EBE3"/>
