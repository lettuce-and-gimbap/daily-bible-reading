<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기상 8장 · 언약궤를 모시고 성전을 봉헌하다</title>
<desc id="desc">주요 장소: 다윗성 시온·예루살렘 성전·내소·제단 앞. 본문의 흐름: 1–13 궤를 내소로 옮기자 구름이 성전에 가득함 → 14–53 솔로몬이 백성을 축복하고 성전 봉헌 기도를 드림 → 54–66 회중을 다시 축복하고 제사와 절기를 지킴. 주요 기물과 표지: 언약궤·두 돌판·그룹·놋 제단·제물.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#225C52" font-weight="700">열왕기상 8장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">언약궤를 모시고 성전을 봉헌하다</text>
<rect x="711" y="28" width="75" height="75" rx="14" fill="#E1EBE3"/>
<path transform="translate(725 41) scale(2.85)" d="M8 1l8 5v2H0V6zM2 9h2v5H2zm5 0h2v5H7zm5 0h2v5h-2zM0 15h16v2H0z" fill="#225C52" fill-rule="evenodd"/>
<rect x="34" y="126" width="752" height="84" rx="12" fill="#E1EBE3"/>
<text x="54" y="155" font-size="18" fill="#225C52" font-weight="700">주요 장소</text>
<text x="54" y="188" font-size="23" fill="#182832" font-weight="400">다윗성 시온·예루살렘 성전·내소·제단 앞</text>
<text x="34" y="244" font-size="18" fill="#225C52" font-weight="700">본문의 흐름</text>
<rect x="34" y="259" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="273" width="97" height="34" rx="9" fill="#E1EBE3"/>
<text x="59" y="297" font-size="17" fill="#225C52" font-weight="700">1–13절</text>
<text x="170" y="298" font-size="23" fill="#182832" font-weight="400">궤를 내소로 옮기자 구름이 성전에 가득함</text>
<path d="M410 325v14m-5 -6 5 6 5 -6" fill="none" stroke="#225C52" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="344" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="358" width="97" height="34" rx="9" fill="#E1EBE3"/>
<text x="59" y="382" font-size="17" fill="#225C52" font-weight="700">14–53절</text>
<text x="170" y="383" font-size="23" fill="#182832" font-weight="400">솔로몬이 백성을 축복하고 성전 봉헌 기도를 드림</text>
<path d="M410 410v14m-5 -6 5 6 5 -6" fill="none" stroke="#225C52" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="429" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="443" width="97" height="34" rx="9" fill="#E1EBE3"/>
<text x="59" y="467" font-size="17" fill="#225C52" font-weight="700">54–66절</text>
<text x="170" y="468" font-size="23" fill="#182832" font-weight="400">회중을 다시 축복하고 제사와 절기를 지킴</text>
<rect x="34" y="512" width="752" height="84" rx="12" fill="#E1EBE3"/>
<text x="54" y="541" font-size="18" fill="#225C52" font-weight="700">주요 기물과 표지</text>
<text x="54" y="574" font-size="23" fill="#182832" font-weight="400">언약궤·두 돌판·그룹·놋 제단·제물</text>
