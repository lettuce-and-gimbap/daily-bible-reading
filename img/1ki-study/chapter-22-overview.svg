<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기상 22장 · 길르앗 라못과 아합의 죽음</title>
<desc id="desc">주요 장소: 사마리아 성문·길르앗 라못·에시온게벨. 본문의 흐름: 1–28 미가야가 아합의 출정에 불길한 예언을 전함 → 29–40 아합이 전투에서 화살에 맞아 죽음 → 41–53 여호사밧과 아하시야의 통치를 기록함. 주요 기물과 표지: 쇠 뿔·변장한 옷·활과 화살·병거·다시스 배.</desc>
