<svg xmlns="http://www.w3.org/2000/svg" width="820" height="435" viewBox="0 0 820 435" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">하솔과 므깃도의 발굴 유적</title>
<desc id="desc">발굴 유적 · 장소 자료. UNESCO 세계유산센터 · 세계유산 1108. 하솔과 므깃도에는 여러 시대의 도시 유구가 남아 있어요. 특정 유구를 솔로몬의 공사로 귀속하려면 별도의 연대 근거가 필요해요. 원본 사진 대신 기호를 사용한 도해.</desc>
<metadata>https://whc.unesco.org/en/list/1108/</metadata>
<rect x="0" y="0" width="820" height="435" rx="20" fill="#F6F2E8"/>
<text x="34" y="45" font-size="20" fill="#705029" font-weight="700">발굴 유적 · 장소 자료</text>
<text x="34" y="93" font-size="31" fill="#182832" font-weight="700">하솔과 므깃도의 발굴 유적</text>
<rect x="34" y="116" width="752" height="66" rx="12" fill="#ECE2CB"/>
<path transform="translate(53 133) scale(2)" d="M0 3h3v3h3V3h4v3h3V3h3v13h-6v-5H6v5H0z" fill="#705029" fill-rule="evenodd"/>
<text x="105" y="157" font-size="19" fill="#705029" font-weight="700">UNESCO 세계유산센터 · 세계유산 1108</text>
<text x="34" y="220" font-size="19" fill="#705029" font-weight="700">자료가 보여 주는 내용</text>
<text x="34" y="255" font-size="22" fill="#182832" font-weight="400">하솔과 므깃도에는 여러 시대의 도시 유구가 남아 있어요.</text>
<text x="34" y="328" font-size="19" fill="#705029" font-weight="700">본문과 함께 읽을 때</text>
<text x="34" y="363" font-size="22" fill="#182832" font-weight="400">특정 유구를 솔로몬의 공사로 귀속하려면 별도의 연대 근거가</text>
<text x="34" y="393" font-size="22" fill="#182832" font-weight="400">필요해요.</text>
</svg>
