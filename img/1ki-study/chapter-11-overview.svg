<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기상 11장 · 솔로몬의 배교와 왕국 분열 예고</title>
<desc id="desc">주요 장소: 예루살렘 앞 산·에돔·애굽·다메섹·다윗성. 본문의 흐름: 1–13 솔로몬이 다른 신들을 따르자 분열이 예고됨 → 14–25 하닷과 르손이 솔로몬의 대적이 됨 → 26–43 아히야가 여로보암에게 열 지파를 예고함. 주요 기물과 표지: 우상 산당·아히야가 열두 조각으로 찢은 새 옷.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#225C52" font-weight="700">열왕기상 11장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">솔로몬의 배교와 왕국 분열 예고</text>
