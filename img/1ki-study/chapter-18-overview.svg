<title id="title">열왕기상 18장 · 갈멜산의 제단과 가뭄의 끝</title>
<desc id="desc">주요 장소: 사마리아·갈멜산·기손 시내·이스르엘. 본문의 흐름: 1–19 오바댜가 엘리야를 만나고 아합이 백성을 모음 → 20–40 바알의 침묵 뒤 엘리야의 제단에 불이 내림 → 41–46 바다 쪽의 작은 구름 뒤 큰비가 내림. 주요 기물과 표지: 송아지·열두 돌·나무·물 항아리·도랑.</desc>
