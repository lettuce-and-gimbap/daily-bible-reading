<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기상 6장 · 솔로몬 성전의 구조</title>
<desc id="desc">주요 장소: 예루살렘 성전·현관·본당·내소·안뜰. 본문의 흐름: 1–10 본당과 현관, 둘레 골방을 지음 → 11–22 순종에 관한 말씀을 듣고 내소를 마련함 → 23–38 그룹과 문을 만들고 칠 년 만에 완공함. 주요 기물과 표지: 백향목 벽판·감람목 그룹·금 입힌 내소·조각한 문.</desc>
