<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기상 19장 · 호렙에서 다시 받은 사명</title>
<desc id="desc">주요 장소: 이스르엘·브엘세바·광야·호렙산·다메섹 길. 본문의 흐름: 1–8 엘리야가 피신하고 광야에서 음식을 받음 → 9–18 호렙에서 조용한 소리를 듣고 새 사명을 받음 → 19–21 엘리사가 소를 몰다가 부름을 받고 따름. 주요 기물과 표지: 로뎀나무·구운 떡·물병·겉옷·쟁기 도구.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#225C52" font-weight="700">열왕기상 19장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">호렙에서 다시 받은 사명</text>
<rect x="711" y="28" width="75" height="75" rx="14" fill="#E1EBE3"/>
<path transform="translate(725 41) scale(2.85)" d="M0 15l5-9 3 4 3-8 5 13z" fill="#225C52" fill-rule="evenodd"/>
