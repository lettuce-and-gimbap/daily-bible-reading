<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기상 16장 · 디르사에서 사마리아로</title>
<desc id="desc">주요 장소: 디르사·깁브돈·사마리아·여리고. 본문의 흐름: 1–14 바아사의 집이 심판을 받고 시므리가 엘라를 죽임 → 15–28 시므리가 몰락하고 오므리가 사마리아를 세움 → 29–34 아합이 바알을 섬기고 히엘이 여리고를 재건함. 주요 기물과 표지: 불탄 왕궁·땅값 은 두 달란트·바알 제단·아세라 목상.</desc>
