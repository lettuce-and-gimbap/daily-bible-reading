<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기상 15장 · 아사와 바아사의 대립</title>
<desc id="desc">주요 장소: 예루살렘·라마·다메섹·게바·미스바·깁브돈. 본문의 흐름: 1–15 아비얌 뒤에 아사가 즉위해 우상을 제거함 → 16–24 아사가 아람에 도움을 청해 라마 공사를 막음 → 25–34 바아사가 나답을 죽이고 여로보암 집을 끊음. 주요 기물과 표지: 아세라 우상·은금·라마에서 가져온 돌과 목재.</desc>
