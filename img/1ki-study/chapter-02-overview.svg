<text x="59" y="382" font-size="17" fill="#225C52" font-weight="700">13–35절</text>
<text x="170" y="383" font-size="23" fill="#182832" font-weight="400">아도니야와 요압이 죽고 아비아달은 파면됨</text>
<path d="M410 410v14m-5 -6 5 6 5 -6" fill="none" stroke="#225C52" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="429" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="443" width="97" height="34" rx="9" fill="#E1EBE3"/>
<text x="59" y="467" font-size="17" fill="#225C52" font-weight="700">36–46절</text>
<text x="170" y="468" font-size="23" fill="#182832" font-weight="400">시므이가 거주 조건을 어기고 처형됨</text>
