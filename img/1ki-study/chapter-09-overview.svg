<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기상 9장 · 성전 이후의 약속과 건축 사업</title>
<desc id="desc">주요 장소: 예루살렘·갈릴리·하솔·므깃도·게셀·에시온게벨. 본문의 흐름: 1–9 하나님이 왕조의 약속과 불순종의 결과를 말씀하심 → 10–23 히람과의 거래, 건축 사업과 노역을 기록함 → 24–28 성전 제사와 오빌 항해를 기록함. 주요 기물과 표지: 갈릴리의 스무 성읍·금·제물·선단.</desc>
