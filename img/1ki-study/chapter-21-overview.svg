<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기상 21장 · 나봇의 포도원</title>
<desc id="desc">주요 장소: 이스르엘 왕궁 곁 포도원·성읍 밖. 본문의 흐름: 1–7 나봇이 조상의 땅을 넘기기를 거절함 → 8–16 이세벨이 거짓 고발을 꾸미고 아합이 땅을 차지함 → 17–29 엘리야가 심판을 전하고 아합이 자신을 낮춤. 주요 기물과 표지: 왕의 인장을 찍은 편지·던진 돌·굵은 베.</desc>
