<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기상 13장 · 벧엘 제단 앞에서 전한 경고</title>
<desc id="desc">주요 장소: 유다·벧엘 제단·돌아가는 길·벧엘 무덤. 본문의 흐름: 1–10 하나님의 사람이 제단의 붕괴를 표징으로 보임 → 11–25 늙은 선지자에게 속아 돌아가 먹고 길에서 죽음 → 26–34 늙은 선지자가 장사하고 여로보암은 돌이키지 않음. 주요 기물과 표지: 갈라진 제단과 재·떡과 물·나귀·무덤.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#225C52" font-weight="700">열왕기상 13장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">벧엘 제단 앞에서 전한 경고</text>
<rect x="711" y="28" width="75" height="75" rx="14" fill="#E1EBE3"/>
<path transform="translate(725 41) scale(2.85)" d="M7 0l3 5v3l3-2 2 5-2 5H3l-2-4 2-6 2 3z" fill="#225C52" fill-rule="evenodd"/>
<rect x="34" y="126" width="752" height="84" rx="12" fill="#E1EBE3"/>
<text x="54" y="155" font-size="18" fill="#225C52" font-weight="700">주요 장소</text>
<text x="54" y="188" font-size="23" fill="#182832" font-weight="400">유다·벧엘 제단·돌아가는 길·벧엘 무덤</text>
<text x="34" y="244" font-size="18" fill="#225C52" font-weight="700">본문의 흐름</text>
<rect x="34" y="259" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="273" width="97" height="34" rx="9" fill="#E1EBE3"/>
<text x="59" y="297" font-size="17" fill="#225C52" font-weight="700">1–10절</text>
<text x="170" y="298" font-size="23" fill="#182832" font-weight="400">하나님의 사람이 제단의 붕괴를 표징으로 보임</text>
