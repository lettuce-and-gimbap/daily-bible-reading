<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기상 1장 · 솔로몬이 왕으로 세워지다</title>
<desc id="desc">주요 장소: 수넴·에느로겔·기혼·예루살렘 왕궁. 본문의 흐름: 1–10 아도니야가 왕위를 노리고 잔치를 엶 → 11–31 밧세바와 나단이 알리고 다윗이 계승을 확정함 → 32–53 기혼에서 솔로몬에게 기름을 붓자 잔치가 흩어짐. 주요 기물과 표지: 아도니야의 병거·왕의 노새·기름 뿔·나팔·제단 뿔.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#225C52" font-weight="700">열왕기상 1장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">솔로몬이 왕으로 세워지다</text>
<rect x="711" y="28" width="75" height="75" rx="14" fill="#E1EBE3"/>
<path transform="translate(725 41) scale(2.85)" d="M0 7l5 2 3-6 3 6 5-2-2 8H2z" fill="#225C52" fill-rule="evenodd"/>
<rect x="34" y="126" width="752" height="84" rx="12" fill="#E1EBE3"/>
<text x="54" y="155" font-size="18" fill="#225C52" font-weight="700">주요 장소</text>
<text x="54" y="188" font-size="23" fill="#182832" font-weight="400">수넴·에느로겔·기혼·예루살렘 왕궁</text>
<text x="34" y="244" font-size="18" fill="#225C52" font-weight="700">본문의 흐름</text>
<rect x="34" y="259" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="273" width="97" height="34" rx="9" fill="#E1EBE3"/>
<text x="59" y="297" font-size="17" fill="#225C52" font-weight="700">1–10절</text>
<text x="170" y="298" font-size="23" fill="#182832" font-weight="400">아도니야가 왕위를 노리고 잔치를 엶</text>
