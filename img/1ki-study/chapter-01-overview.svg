<rect x="50" y="358" width="97" height="34" rx="9" fill="#E1EBE3"/>
<text x="59" y="382" font-size="17" fill="#225C52" font-weight="700">11–31절</text>
<text x="170" y="383" font-size="23" fill="#182832" font-weight="400">밧세바와 나단이 알리고 다윗이 계승을 확정함</text>
<path d="M410 410v14m-5 -6 5 6 5 -6" fill="none" stroke="#225C52" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="429" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="443" width="97" height="34" rx="9" fill="#E1EBE3"/>
<text x="59" y="467" font-size="17" fill="#225C52" font-weight="700">32–53절</text>
<text x="170" y="468" font-size="23" fill="#182832" font-weight="400">기혼에서 솔로몬에게 기름을 붓자 잔치가 흩어짐</text>
<rect x="34" y="512" width="752" height="84" rx="12" fill="#E1EBE3"/>
<text x="54" y="541" font-size="18" fill="#225C52" font-weight="700">주요 기물과 표지</text>
<text x="54" y="574" font-size="23" fill="#182832" font-weight="400">아도니야의 병거·왕의 노새·기름 뿔·나팔·제단 뿔</text>
