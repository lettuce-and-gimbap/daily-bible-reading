<svg xmlns="http://www.w3.org/2000/svg" width="820" height="621" viewBox="0 0 820 621" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">열왕기상 4장 · 왕국의 행정과 솔로몬의 지혜</title>
<desc id="desc">주요 장소: 왕궁·열두 관할 구역·딥사에서 가사까지. 본문의 흐름: 1–19 신하와 열두 지방 관장이 왕국을 섬김 → 20–28 지방 관장이 달마다 궁중에 양식을 댐 → 29–34 솔로몬의 지혜를 들으러 사람들이 찾아옴. 주요 기물과 표지: 고운 가루·가축·병거와 말·잠언과 노래.</desc>
<rect x="0" y="0" width="820" height="621" rx="20" fill="#F6F2E8"/>
<text x="34" y="44" font-size="20" fill="#225C52" font-weight="700">열왕기상 4장 · 본문 도해</text>
<text x="34" y="91" font-size="32" fill="#182832" font-weight="700">왕국의 행정과 솔로몬의 지혜</text>
<rect x="711" y="28" width="75" height="75" rx="14" fill="#E1EBE3"/>
<path transform="translate(725 41) scale(2.85)" d="M7 17V4h2v13zM3 4l4 2v4L3 8zm10 0v4l-4 2V6zM2 9l5 2v4l-5-2zm12 0v4l-5 2v-4z" fill="#225C52" fill-rule="evenodd"/>
<rect x="34" y="126" width="752" height="84" rx="12" fill="#E1EBE3"/>
<text x="54" y="155" font-size="18" fill="#225C52" font-weight="700">주요 장소</text>
<text x="54" y="188" font-size="23" fill="#182832" font-weight="400">왕궁·열두 관할 구역·딥사에서 가사까지</text>
<text x="34" y="244" font-size="18" fill="#225C52" font-weight="700">본문의 흐름</text>
<rect x="34" y="259" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="273" width="97" height="34" rx="9" fill="#E1EBE3"/>
<text x="59" y="297" font-size="17" fill="#225C52" font-weight="700">1–19절</text>
<text x="170" y="298" font-size="23" fill="#182832" font-weight="400">신하와 열두 지방 관장이 왕국을 섬김</text>
<path d="M410 325v14m-5 -6 5 6 5 -6" fill="none" stroke="#225C52" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="344" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="358" width="97" height="34" rx="9" fill="#E1EBE3"/>
<text x="59" y="382" font-size="17" fill="#225C52" font-weight="700">20–28절</text>
<text x="170" y="383" font-size="23" fill="#182832" font-weight="400">지방 관장이 달마다 궁중에 양식을 댐</text>
<path d="M410 410v14m-5 -6 5 6 5 -6" fill="none" stroke="#225C52" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="429" width="752" height="63" rx="12" fill="#FFFDF8"/>
<rect x="50" y="443" width="97" height="34" rx="9" fill="#E1EBE3"/>
<text x="59" y="467" font-size="17" fill="#225C52" font-weight="700">29–34절</text>
<text x="170" y="468" font-size="23" fill="#182832" font-weight="400">솔로몬의 지혜를 들으러 사람들이 찾아옴</text>
<rect x="34" y="512" width="752" height="84" rx="12" fill="#E1EBE3"/>
<text x="54" y="541" font-size="18" fill="#225C52" font-weight="700">주요 기물과 표지</text>
<text x="54" y="574" font-size="23" fill="#182832" font-weight="400">고운 가루·가축·병거와 말·잠언과 노래</text>
</svg>
