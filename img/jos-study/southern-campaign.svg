<svg xmlns="http://www.w3.org/2000/svg" width="820" height="731" viewBox="0 0 820 731" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 10장 · 기브온 구원과 남부 성읍 (본문 도해)</title><desc id="desc">벧호론 비탈을 지나 아세가·막게다 쪽 / 우박 / 해와 달: 기브온·아얄론 / 야살의 책 / 다섯 왕이 숨음 / 굴 어귀를 큰 돌로 막음 / 나무와 돌 / 막게다 → 립나 → 라기스 → 에글론 → 헤브론 → 드빌 / 게셀 왕의 개입 / 가데스 바네아~가사, 고센~기브온 / 길갈 귀환 / 본문의 사건 순서 · 막게다 굴과 세부 이동로 미확정</desc>
<metadata>https://www.sefaria.org/Joshua.10</metadata>
<rect width="820" height="731" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 10장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">기브온 구원과 남부 성읍</text>
<rect x="38" y="124" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-15 0h28m-10-10L14 0 3 10"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–15절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">길갈에서 기브온으로</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">벧호론 비탈을 지나 아세가·막게다 쪽 / 우박 / 해와</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">달: 기브온·아얄론 / 야살의 책</text>
<rect x="38" y="292" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="351" r="29" fill="#dcece3"/>
<g transform="translate(87 351)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-17 12l4-11L-2-3l7 15Zm18 0L7 1l9 2 3 9ZM-8-3l3-10 12-2L13-3 7 1 0-3Z"/></g>
<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">16–27절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">막게다의 굴</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">다섯 왕이 숨음 / 굴 어귀를 큰 돌로 막음 / 나무와</text>
<text x="133" y="426" font-size="25" fill="#173039" font-weight="400">돌</text>
<rect x="38" y="460" width="744" height="189" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="519" r="29" fill="#dcece3"/>
<g transform="translate(87 519)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 13v-24h7v5h6v-5h6v5h6v-5h7v24Zm12 0V3h8v10"/></g>
<text x="133" y="492" font-size="19" fill="#28665e" font-weight="700">28–43절</text>
<text x="133" y="526" font-size="30" fill="#173039" font-weight="700">남부 성읍의 순서</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">막게다 → 립나 → 라기스 → 에글론 → 헤브론 →</text>
<text x="133" y="594" font-size="25" fill="#173039" font-weight="400">드빌 / 게셀 왕의 개입 / 가데스 바네아~가사,</text>
<text x="133" y="627" font-size="25" fill="#173039" font-weight="400">고센~기브온 / 길갈 귀환</text>
<text x="42" y="691" font-size="23" fill="#40544d" font-weight="400">본문의 사건 순서 · 막게다 굴과 세부 이동로 미확정</text>
</svg>
