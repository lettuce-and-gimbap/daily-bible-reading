<svg xmlns="http://www.w3.org/2000/svg" width="820" height="697" viewBox="0 0 820 697" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 20장 · 여섯 도피성과 보호 절차 (본문 도해)</title><desc id="desc">실수로 죽음을 일으킨 사람이 장로에게 사정을 말함 / 대제사장이 죽은 뒤 귀향 / 북: 갈릴리 게데스 / 중부: 세겜 / 남: 헤브론 / 베셀·길르앗 라못·바산 골란 / 이스라엘 사람과 거류민에게 적용 / 도피성 이름과 지역은 본문 기준 · 특히 동편 성읍의 세부 위치에 이견</desc>
<metadata>https://www.sefaria.org/Joshua.20</metadata>
<rect width="820" height="697" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 20장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">여섯 도피성과 보호 절차</text>
<rect x="38" y="124" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-8" cy="-8" r="5"/><circle cx="10" cy="-8" r="5"/><path d="M-17 13V7a9 9 0 0 1 18 0v6m0 0V7a9 9 0 0 1 18 0v6"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–6절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">성문 → 회중 재판</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">실수로 죽음을 일으킨 사람이 장로에게 사정을</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">말함 / 대제사장이 죽은 뒤 귀향</text>
<rect x="38" y="292" width="744" height="123" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="351" r="29" fill="#dcece3"/>
<g transform="translate(87 351)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 13v-24h7v5h6v-5h6v5h6v-5h7v24Zm12 0V3h8v10"/></g>
<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">7절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">요단 서쪽 세 곳</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">북: 갈릴리 게데스 / 중부: 세겜 / 남: 헤브론</text>
<rect x="38" y="427" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="486" r="29" fill="#dcece3"/>
<g transform="translate(87 486)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 13v-24h7v5h6v-5h6v5h6v-5h7v24Zm12 0V3h8v10"/></g>
<text x="133" y="459" font-size="19" fill="#28665e" font-weight="700">8–9절</text>
<text x="133" y="493" font-size="30" fill="#173039" font-weight="700">요단 동쪽 세 곳</text>
<text x="133" y="528" font-size="25" fill="#173039" font-weight="400">베셀·길르앗 라못·바산 골란 / 이스라엘 사람과</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">거류민에게 적용</text>
<text x="42" y="625" font-size="23" fill="#40544d" font-weight="400">도피성 이름과 지역은 본문 기준 · 특히 동편 성읍의 세부 위치에</text>
<text x="42" y="657" font-size="23" fill="#40544d" font-weight="400">이견</text>
</svg>
