<title id="title">수 12장 · 요단 양쪽의 왕 목록 (본문 도해)</title><desc id="desc">시혼: 헤스본·아르논·얍복 / 옥: 바산·아스다롯·에드레이 / 동편 지파의 기업 / 바알갓~할락 산 / 산지·평지·아라바·경사지·광야·네겝 / 여리고와 아이에서 디르사까지 / 전체 명단은 COVERAGE의 12장 항목 / 본문의 왕 목록 · 경계와 고대 성읍의 위치는 개별 검토 필요</desc>
