<svg xmlns="http://www.w3.org/2000/svg" width="820" height="730" viewBox="0 0 820 730" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 7장 · 아이 패배와 아간이 숨긴 물건 (본문 도해)</title><desc id="desc">정탐 뒤 공격했으나 스바림 쪽으로 패주 / 여호수아가 궤 앞에서 탄식 / 시날 옷 한 벌·은 이백 세겔·금 오십 세겔 / 지파부터 가문과 개인까지 좁혀 감 / 아간과 그에게 속한 것을 골짜기로 데려감 / 그 자리에 큰 돌무더기 / 아이의 현대 위치는 논쟁 중 · 물건과 돌무더기는 본문에 따른 도식</desc>
<metadata>https://www.sefaria.org/Joshua.7 | https://www.journals.uchicago.edu/doi/10.2307/1356277</metadata>
<rect width="820" height="730" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 7장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">아이 패배와 아간이 숨긴 물건</text>
<rect x="38" y="124" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 17C-6 7-13 4-13-5a13 13 0 1 1 26 0c0 9-7 12-13 22Z"/><circle cy="-5" r="4"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–9절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">벧아웬 곁, 벧엘 동쪽의 아이</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">정탐 뒤 공격했으나 스바림 쪽으로 패주 /</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">여호수아가 궤 앞에서 탄식</text>
<rect x="38" y="292" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="351" r="29" fill="#dcece3"/>
<g transform="translate(87 351)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-8-12h16L5-5c7 6 12 13 7 18-4 4-20 4-24 0-5-5 0-12 7-18Zm3 7H5"/></g>
<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">10–23절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">장막 아래 감춘 물건</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">시날 옷 한 벌·은 이백 세겔·금 오십 세겔 /</text>
<text x="133" y="426" font-size="25" fill="#173039" font-weight="400">지파부터 가문과 개인까지 좁혀 감</text>
<rect x="38" y="460" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="519" r="29" fill="#dcece3"/>
<g transform="translate(87 519)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-17 12l4-11L-2-3l7 15Zm18 0L7 1l9 2 3 9ZM-8-3l3-10 12-2L13-3 7 1 0-3Z"/></g>
<text x="133" y="492" font-size="19" fill="#28665e" font-weight="700">24–26절</text>
<text x="133" y="526" font-size="30" fill="#173039" font-weight="700">아골 골짜기</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">아간과 그에게 속한 것을 골짜기로 데려감 / 그</text>
<text x="133" y="594" font-size="25" fill="#173039" font-weight="400">자리에 큰 돌무더기</text>
<text x="42" y="658" font-size="23" fill="#40544d" font-weight="400">아이의 현대 위치는 논쟁 중 · 물건과 돌무더기는 본문에 따른</text>
<text x="42" y="690" font-size="23" fill="#40544d" font-weight="400">도식</text>
</svg>
