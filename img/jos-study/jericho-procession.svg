<svg xmlns="http://www.w3.org/2000/svg" width="820" height="664" viewBox="0 0 820 664" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 6장 · 여리고 성 돌기와 성벽 붕괴 (본문 도해)</title><desc id="desc">하루 한 바퀴 / 무장대·양각 나팔 일곱·언약궤·후위 / 일곱 바퀴 / 나팔과 함성 뒤 성벽이 무너짐 / 라합 가족을 이끌어 냄 / 은·금·놋·철 기물은 곳간으로 / 재건에 대한 저주 / 텔 에스술탄은 고대 여리고 유적 · 발굴 층위와 본문 사건의 연결은 논쟁 중</desc>
<metadata>https://www.sefaria.org/Joshua.6 | https://whc.unesco.org/en/list/1687/</metadata>
<rect width="820" height="664" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 6장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">여리고 성 돌기와 성벽 붕괴</text>
<rect x="38" y="124" width="744" height="123" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-14-9h28v19h-28zm-4 15h36M-18-9h36M-8-9l-3-8m19 8 3-8"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–14절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">여섯 날</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">하루 한 바퀴 / 무장대·양각 나팔 일곱·언약궤·후위</text>
<rect x="38" y="259" width="744" height="123" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="318" r="29" fill="#dcece3"/>
<g transform="translate(87 318)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 13v-24h7v5h6v-5h6v5h6v-5h7v24Zm12 0V3h8v10"/></g>
<text x="133" y="291" font-size="19" fill="#28665e" font-weight="700">15–21절</text>
<text x="133" y="325" font-size="30" fill="#173039" font-weight="700">일곱째 날</text>
<text x="133" y="360" font-size="25" fill="#173039" font-weight="400">일곱 바퀴 / 나팔과 함성 뒤 성벽이 무너짐</text>
<rect x="38" y="394" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="453" r="29" fill="#dcece3"/>
<g transform="translate(87 453)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-8" cy="-8" r="5"/><circle cx="10" cy="-8" r="5"/><path d="M-17 13V7a9 9 0 0 1 18 0v6m0 0V7a9 9 0 0 1 18 0v6"/></g>
<text x="133" y="426" font-size="19" fill="#28665e" font-weight="700">22–27절</text>
<text x="133" y="460" font-size="30" fill="#173039" font-weight="700">라합과 성읍의 결말</text>
<text x="133" y="495" font-size="25" fill="#173039" font-weight="400">라합 가족을 이끌어 냄 / 은·금·놋·철 기물은</text>
<text x="133" y="528" font-size="25" fill="#173039" font-weight="400">곳간으로 / 재건에 대한 저주</text>
<text x="42" y="592" font-size="23" fill="#40544d" font-weight="400">텔 에스술탄은 고대 여리고 유적 · 발굴 층위와 본문 사건의</text>
<text x="42" y="624" font-size="23" fill="#40544d" font-weight="400">연결은 논쟁 중</text>
</svg>
