<svg xmlns="http://www.w3.org/2000/svg" width="820" height="698" viewBox="0 0 820 698" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 14장 · 길갈에서 받은 헤브론 (본문 도해)</title><desc id="desc">엘르아살·여호수아·지파 족장들 / 제비 / 레위의 성읍과 목초지 / 길갈에서 요청 / 정탐 때 마흔 살 → 사십오 년 뒤 여든다섯 살 / 아낙 사람이 있는 산지를 요청 / 헤브론의 옛 이름은 기럇 아르바 / 고대 헤브론의 유적 비정과 갈렙 이야기의 세부 위치는 별개</desc>
<metadata>https://www.sefaria.org/Joshua.14 | https://whc.unesco.org/en/tentativelists/6949/</metadata>
<rect width="820" height="698" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 14장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">길갈에서 받은 헤브론</text>
<rect x="38" y="124" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-8" cy="-8" r="5"/><circle cx="10" cy="-8" r="5"/><path d="M-17 13V7a9 9 0 0 1 18 0v6m0 0V7a9 9 0 0 1 18 0v6"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–5절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">땅 분배를 맡은 사람들</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">엘르아살·여호수아·지파 족장들 / 제비 / 레위의</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">성읍과 목초지</text>
<rect x="38" y="292" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="351" r="29" fill="#dcece3"/>
<g transform="translate(87 351)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 17C-6 7-13 4-13-5a13 13 0 1 1 26 0c0 9-7 12-13 22Z"/><circle cy="-5" r="4"/></g>
<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">6–12절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">가데스 바네아의 약속 회고</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">길갈에서 요청 / 정탐 때 마흔 살 → 사십오 년 뒤</text>
<text x="133" y="426" font-size="25" fill="#173039" font-weight="400">여든다섯 살</text>
<rect x="38" y="460" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="519" r="29" fill="#dcece3"/>
<g transform="translate(87 519)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 13v-24h7v5h6v-5h6v5h6v-5h7v24Zm12 0V3h8v10"/></g>
<text x="133" y="492" font-size="19" fill="#28665e" font-weight="700">13–15절</text>
<text x="133" y="526" font-size="30" fill="#173039" font-weight="700">갈렙의 기업 헤브론</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">아낙 사람이 있는 산지를 요청 / 헤브론의 옛</text>
<text x="133" y="594" font-size="25" fill="#173039" font-weight="400">이름은 기럇 아르바</text>
<text x="42" y="658" font-size="23" fill="#40544d" font-weight="400">고대 헤브론의 유적 비정과 갈렙 이야기의 세부 위치는 별개</text>
</svg>
