<svg xmlns="http://www.w3.org/2000/svg" width="820" height="665" viewBox="0 0 820 665" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 9장 · 기브온의 위장과 조약 (본문 도해)</title><desc id="desc">산지·평지·레바논 맞은편 해안의 왕들이 연합 / 낡은 자루와 포도주 가죽부대·옷·신 / 마른 빵 / 여호와께 묻지 않고 맹세 / 기브온·그비라·브에롯·기럇 여아림 / 맹세를 지키고 나무와 물을 맡김 / 기브온은 엘지브 유적과 연결 · 사절의 물건은 본문 도식</desc>
<metadata>https://www.sefaria.org/Joshua.9 | https://whc.unesco.org/en/tentativelists/6949/</metadata>
<rect width="820" height="665" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 9장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">기브온의 위장과 조약</text>
<rect x="38" y="124" width="744" height="123" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-8" cy="-8" r="5"/><circle cx="10" cy="-8" r="5"/><path d="M-17 13V7a9 9 0 0 1 18 0v6m0 0V7a9 9 0 0 1 18 0v6"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–6절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">길갈에 온 사절</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">산지·평지·레바논 맞은편 해안의 왕들이 연합</text>
<rect x="38" y="259" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="318" r="29" fill="#dcece3"/>
<g transform="translate(87 318)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-8-12h16L5-5c7 6 12 13 7 18-4 4-20 4-24 0-5-5 0-12 7-18Zm3 7H5"/></g>
<text x="133" y="291" font-size="19" fill="#28665e" font-weight="700">7–15절</text>
<text x="133" y="325" font-size="30" fill="#173039" font-weight="700">낡은 물건을 내보임</text>
<text x="133" y="360" font-size="25" fill="#173039" font-weight="400">낡은 자루와 포도주 가죽부대·옷·신 / 마른 빵 /</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">여호와께 묻지 않고 맹세</text>
<rect x="38" y="427" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="486" r="29" fill="#dcece3"/>
<g transform="translate(87 486)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 13v-24h7v5h6v-5h6v5h6v-5h7v24Zm12 0V3h8v10"/></g>
<text x="133" y="459" font-size="19" fill="#28665e" font-weight="700">16–27절</text>
<text x="133" y="493" font-size="30" fill="#173039" font-weight="700">가까운 네 성읍이 드러남</text>
<text x="133" y="528" font-size="25" fill="#173039" font-weight="400">기브온·그비라·브에롯·기럇 여아림 / 맹세를 지키고</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">나무와 물을 맡김</text>
<text x="42" y="625" font-size="23" fill="#40544d" font-weight="400">기브온은 엘지브 유적과 연결 · 사절의 물건은 본문 도식</text>
</svg>
