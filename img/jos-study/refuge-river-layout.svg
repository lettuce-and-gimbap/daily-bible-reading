<svg xmlns="http://www.w3.org/2000/svg" width="820" height="624" viewBox="0 0 820 624" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 20장 · 요단 양쪽의 여섯 도피성 (위치 관계도)</title><desc id="desc">수 20:7–9 · 본문의 지역에 따른 배치 왼쪽과 오른쪽은 요단을 기준으로 한다. 같은 높이에 놓인 도시의 위도는 서로 다를 수 있다. 특히 동편 도피성의 세부 위치에는 이견이 있다.</desc>
<metadata>https://www.sefaria.org/Joshua.20</metadata>
