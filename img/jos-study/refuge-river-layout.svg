<text x="38" y="511" font-size="23" fill="#40544d" font-weight="400">왼쪽과 오른쪽은 요단을 기준으로 한다. 같은 높이에 놓인 도시의</text>
<text x="38" y="543" font-size="23" fill="#40544d" font-weight="400">위도는 서로 다를 수 있다.</text>
<text x="38" y="575" font-size="23" fill="#40544d" font-weight="400">특히 동편 도피성의 세부 위치에는 이견이 있다.</text>
