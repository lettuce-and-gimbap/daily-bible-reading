<svg xmlns="http://www.w3.org/2000/svg" width="820" height="698" viewBox="0 0 820 698" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 19장 · 여섯 지파와 여호수아의 기업 (본문 도해)</title><desc id="desc">시므온: 유다 안 / 스불론: 사릿 일대 / 잇사갈: 이스르엘·다볼에서 요단 / 아셀: 갈멜·시돈·두로 / 납달리: 긴네렛·하솔 / 단: 소라·아얄론·욥바 맞은편 및 레셈 / 여호수아가 딤낫 세라를 받음 / 실로 회막 문 앞에서 제비 분배를 마침 / 지파별 상세 목록은 COVERAGE의 19장 항목 · 현대 경계 미표시</desc>
<metadata>https://www.sefaria.org/Joshua.19</metadata>
<rect width="820" height="698" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 19장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">여섯 지파와 여호수아의 기업</text>
<rect x="38" y="124" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 17C-6 7-13 4-13-5a13 13 0 1 1 26 0c0 9-7 12-13 22Z"/><circle cy="-5" r="4"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–23절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">시므온·스불론·잇사갈</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">시므온: 유다 안 / 스불론: 사릿 일대 / 잇사갈:</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">이스르엘·다볼에서 요단</text>
<rect x="38" y="292" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="351" r="29" fill="#dcece3"/>
<g transform="translate(87 351)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 13v-24h7v5h6v-5h6v5h6v-5h7v24Zm12 0V3h8v10"/></g>
<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">24–48절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">아셀·납달리·단</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">아셀: 갈멜·시돈·두로 / 납달리: 긴네렛·하솔 / 단:</text>
<text x="133" y="426" font-size="25" fill="#173039" font-weight="400">소라·아얄론·욥바 맞은편 및 레셈</text>
<rect x="38" y="460" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="519" r="29" fill="#dcece3"/>
<g transform="translate(87 519)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m-18 12 17-25L18 12Zm10 0 7-12 8 12"/></g>
<text x="133" y="492" font-size="19" fill="#28665e" font-weight="700">49–51절</text>
<text x="133" y="526" font-size="30" fill="#173039" font-weight="700">딤낫 세라와 실로</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">여호수아가 딤낫 세라를 받음 / 실로 회막 문</text>
<text x="133" y="594" font-size="25" fill="#173039" font-weight="400">앞에서 제비 분배를 마침</text>
<text x="42" y="658" font-size="23" fill="#40544d" font-weight="400">지파별 상세 목록은 COVERAGE의 19장 항목 · 현대 경계 미표시</text>
</svg>
