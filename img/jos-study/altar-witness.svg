<svg xmlns="http://www.w3.org/2000/svg" width="820" height="665" viewBox="0 0 820 665" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 22장 · 요단 가의 큰 제단과 화해 (본문 도해)</title><desc id="desc">귀향하는 두 지파 반 / 가축·은·금·놋·철·의복을 나눔 / 서편 지파는 실로에 집결 / 비느하스와 열 대표 / 브올과 아간을 상기 / 번제를 위한 제단이 아니라 후대에 전할 증거라고 설명 / 조사단이 돌아가 보고 / 제단의 정확한 위치는 미상 · 본문에서 설명하는 용도 중심</desc>
<metadata>https://www.sefaria.org/Joshua.22</metadata>
<rect width="820" height="665" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 22장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">요단 가의 큰 제단과 화해</text>
<rect x="38" y="124" width="744" height="123" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-15 0h28m-10-10L14 0 3 10"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–9절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">실로에서 길르앗으로</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">귀향하는 두 지파 반 / 가축·은·금·놋·철·의복을 나눔</text>
<rect x="38" y="259" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="318" r="29" fill="#dcece3"/>
<g transform="translate(87 318)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-17 12l4-11L-2-3l7 15Zm18 0L7 1l9 2 3 9ZM-8-3l3-10 12-2L13-3 7 1 0-3Z"/></g>
<text x="133" y="291" font-size="19" fill="#28665e" font-weight="700">10–20절</text>
<text x="133" y="325" font-size="30" fill="#173039" font-weight="700">요단가 제단과 조사</text>
<text x="133" y="360" font-size="25" fill="#173039" font-weight="400">서편 지파는 실로에 집결 / 비느하스와 열 대표 /</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">브올과 아간을 상기</text>
<rect x="38" y="427" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="486" r="29" fill="#dcece3"/>
<g transform="translate(87 486)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-8" cy="-8" r="5"/><circle cx="10" cy="-8" r="5"/><path d="M-17 13V7a9 9 0 0 1 18 0v6m0 0V7a9 9 0 0 1 18 0v6"/></g>
<text x="133" y="459" font-size="19" fill="#28665e" font-weight="700">21–34절</text>
<text x="133" y="493" font-size="30" fill="#173039" font-weight="700">서로의 증거</text>
<text x="133" y="528" font-size="25" fill="#173039" font-weight="400">번제를 위한 제단이 아니라 후대에 전할 증거라고</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">설명 / 조사단이 돌아가 보고</text>
<text x="42" y="625" font-size="23" fill="#40544d" font-weight="400">제단의 정확한 위치는 미상 · 본문에서 설명하는 용도 중심</text>
</svg>
