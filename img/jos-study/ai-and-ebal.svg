<svg xmlns="http://www.w3.org/2000/svg" width="820" height="730" viewBox="0 0 820 730" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 8장 · 아이 전투에서 에발 산 낭독까지 (본문 도해)</title><desc id="desc">아이와 벧엘 사이 서쪽에 매복 / 북쪽에 진을 치고 골짜기를 사이에 둠 / 단창을 드는 신호 / 성읍의 연기 / 성문 어귀의 돌무더기 / 쇠 연장으로 다듬지 않은 돌 제단 / 돌에 기록한 율법 / 궤 양편에서 낭독 / 아이의 위치는 논쟁 중 · 현존 구조물을 본문의 에발 산 제단으로 확정할 수 없음</desc>
<metadata>https://www.sefaria.org/Joshua.8 | https://www.journals.uchicago.edu/doi/10.2307/1356277 | https://whc.unesco.org/en/tentativelists/5706/</metadata>
<rect width="820" height="730" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 8장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">아이 전투에서 에발 산 낭독까지</text>
<rect x="38" y="124" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-15 0h28m-10-10L14 0 3 10"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–17절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">아이 주변의 배치</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">아이와 벧엘 사이 서쪽에 매복 / 북쪽에 진을 치고</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">골짜기를 사이에 둠</text>
<rect x="38" y="292" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="351" r="29" fill="#dcece3"/>
<g transform="translate(87 351)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 13v-24h7v5h6v-5h6v5h6v-5h7v24Zm12 0V3h8v10"/></g>
<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">18–29절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">단창 신호와 전투 결말</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">단창을 드는 신호 / 성읍의 연기 / 성문 어귀의</text>
<text x="133" y="426" font-size="25" fill="#173039" font-weight="400">돌무더기</text>
<rect x="38" y="460" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="519" r="29" fill="#dcece3"/>
<g transform="translate(87 519)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 13c-5-4-11-5-17-4v-23c6-1 12 0 17 4 5-4 11-5 17-4V9c-6-1-12 0-17 4Zm0 0v-23"/></g>
<text x="133" y="492" font-size="19" fill="#28665e" font-weight="700">30–35절</text>
<text x="133" y="526" font-size="30" fill="#173039" font-weight="700">에발 산과 그리심 산</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">쇠 연장으로 다듬지 않은 돌 제단 / 돌에 기록한</text>
<text x="133" y="594" font-size="25" fill="#173039" font-weight="400">율법 / 궤 양편에서 낭독</text>
<text x="42" y="658" font-size="23" fill="#40544d" font-weight="400">아이의 위치는 논쟁 중 · 현존 구조물을 본문의 에발 산 제단으로</text>
<text x="42" y="690" font-size="23" fill="#40544d" font-weight="400">확정할 수 없음</text>
</svg>
