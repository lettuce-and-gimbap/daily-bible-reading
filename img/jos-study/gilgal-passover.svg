<svg xmlns="http://www.w3.org/2000/svg" width="820" height="697" viewBox="0 0 820 697" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 5장 · 길갈의 할례와 유월절 (본문 도해)</title><desc id="desc">부싯돌 칼 / 기브앗 하아랄롯 / 진영에서 회복 / 첫째 달 열나흘 저녁 / 무교병·볶은 곡식 / 만나가 멎음 / 칼을 든 여호와의 군대 지휘관 / 여호수아가 신을 벗음 / 길갈과 할례 장소의 정확한 위치 미확정 · 사물은 본문에 따른 도식</desc>
<metadata>https://www.sefaria.org/Joshua.5</metadata>
<rect width="820" height="697" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 5장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">길갈의 할례와 유월절</text>
<rect x="38" y="124" width="744" height="123" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-17 12l4-11L-2-3l7 15Zm18 0L7 1l9 2 3 9ZM-8-3l3-10 12-2L13-3 7 1 0-3Z"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–9절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">할례 / 길갈</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">부싯돌 칼 / 기브앗 하아랄롯 / 진영에서 회복</text>
<rect x="38" y="259" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="318" r="29" fill="#dcece3"/>
<g transform="translate(87 318)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-8-12h16L5-5c7 6 12 13 7 18-4 4-20 4-24 0-5-5 0-12 7-18Zm3 7H5"/></g>
<text x="133" y="291" font-size="19" fill="#28665e" font-weight="700">10–12절</text>
<text x="133" y="325" font-size="30" fill="#173039" font-weight="700">유월절 / 여리고 평지</text>
<text x="133" y="360" font-size="25" fill="#173039" font-weight="400">첫째 달 열나흘 저녁 / 무교병·볶은 곡식 / 만나가</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">멎음</text>
<rect x="38" y="427" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="486" r="29" fill="#dcece3"/>
<g transform="translate(87 486)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 17C-6 7-13 4-13-5a13 13 0 1 1 26 0c0 9-7 12-13 22Z"/><circle cy="-5" r="4"/></g>
<text x="133" y="459" font-size="19" fill="#28665e" font-weight="700">13–15절</text>
<text x="133" y="493" font-size="30" fill="#173039" font-weight="700">여리고 가까이</text>
<text x="133" y="528" font-size="25" fill="#173039" font-weight="400">칼을 든 여호와의 군대 지휘관 / 여호수아가 신을</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">벗음</text>
<text x="42" y="625" font-size="23" fill="#40544d" font-weight="400">길갈과 할례 장소의 정확한 위치 미확정 · 사물은 본문에 따른</text>
<text x="42" y="657" font-size="23" fill="#40544d" font-weight="400">도식</text>
</svg>
