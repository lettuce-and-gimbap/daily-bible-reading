<svg xmlns="http://www.w3.org/2000/svg" width="820" height="698" viewBox="0 0 820 698" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 16장 · 요셉 자손과 에브라임의 경계 (본문 도해)</title><desc id="desc">요단과 여리고 샘 → 벧엘·루스 → 아다롯·아래 벧호론·게셀 → 바다 / 아다롯 앗달·윗 벧호론·믹므다·다아낫 실로·야노아 / 나아라·요단 / 답부아·가나 시내 / 므낫세 땅 안에도 에브라임 성읍 / 게셀 주민은 남아 노역함 / 본문의 경계 표지 개념도 · 현대 경계와 동일시하지 않음</desc>
<metadata>https://www.sefaria.org/Joshua.16</metadata>
<rect width="820" height="698" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 16장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">요셉 자손과 에브라임의 경계</text>
<rect x="38" y="124" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-15 0h28m-10-10L14 0 3 10"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–4절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">요셉 자손의 경계</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">요단과 여리고 샘 → 벧엘·루스 → 아다롯·아래</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">벧호론·게셀 → 바다</text>
<rect x="38" y="292" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="351" r="29" fill="#dcece3"/>
<g transform="translate(87 351)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 17C-6 7-13 4-13-5a13 13 0 1 1 26 0c0 9-7 12-13 22Z"/><circle cy="-5" r="4"/></g>
<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">5–9절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">에브라임의 경계 표지</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">아다롯 앗달·윗 벧호론·믹므다·다아낫 실로·야노아 /</text>
<text x="133" y="426" font-size="25" fill="#173039" font-weight="400">나아라·요단 / 답부아·가나 시내</text>
<rect x="38" y="460" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="519" r="29" fill="#dcece3"/>
<g transform="translate(87 519)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 13v-24h7v5h6v-5h6v5h6v-5h7v24Zm12 0V3h8v10"/></g>
<text x="133" y="492" font-size="19" fill="#28665e" font-weight="700">10절</text>
<text x="133" y="526" font-size="30" fill="#173039" font-weight="700">게셀에서 남은 주민</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">므낫세 땅 안에도 에브라임 성읍 / 게셀 주민은</text>
<text x="133" y="594" font-size="25" fill="#173039" font-weight="400">남아 노역함</text>
<text x="42" y="658" font-size="23" fill="#40544d" font-weight="400">본문의 경계 표지 개념도 · 현대 경계와 동일시하지 않음</text>
</svg>
