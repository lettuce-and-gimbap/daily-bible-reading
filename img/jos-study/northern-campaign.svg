<svg xmlns="http://www.w3.org/2000/svg" width="820" height="731" viewBox="0 0 820 731" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 11장 · 메롬 물가와 하솔 (본문 도해)</title><desc id="desc">하솔·마돈·시므론·악삽 / 긴네롯 남쪽 아라바·돌의 고지 / 메롬 물가 / 추격: 시돈·미스르봇마임·미스바 골짜기 / 말과 병거가 등장 / 하솔을 불태움 / 다른 언덕 성읍들과 구분 / 할락 산~바알갓 / 헤브론·드빌·아납 / 아낙 자손은 가사·가드·아스돗에 남음 / 메롬 물가의 위치와 하솔 파괴층의 주체는 확정하기 어려움</desc>
<metadata>https://www.sefaria.org/Joshua.11 | https://archaeology.huji.ac.il/tel-hazor</metadata>
<rect width="820" height="731" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 11장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">메롬 물가와 하솔</text>
<rect x="38" y="124" width="744" height="189" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-8" cy="-8" r="5"/><circle cx="10" cy="-8" r="5"/><path d="M-17 13V7a9 9 0 0 1 18 0v6m0 0V7a9 9 0 0 1 18 0v6"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–9절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">북부 왕들의 집결</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">하솔·마돈·시므론·악삽 / 긴네롯 남쪽 아라바·돌의</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">고지 / 메롬 물가 / 추격: 시돈·미스르봇마임·미스바</text>
<text x="133" y="291" font-size="25" fill="#173039" font-weight="400">골짜기</text>
<rect x="38" y="325" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="384" r="29" fill="#dcece3"/>
<g transform="translate(87 384)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 13v-24h7v5h6v-5h6v5h6v-5h7v24Zm12 0V3h8v10"/></g>
<text x="133" y="357" font-size="19" fill="#28665e" font-weight="700">10–15절</text>
<text x="133" y="391" font-size="30" fill="#173039" font-weight="700">하솔에 돌아옴</text>
<text x="133" y="426" font-size="25" fill="#173039" font-weight="400">말과 병거가 등장 / 하솔을 불태움 / 다른 언덕</text>
<text x="133" y="459" font-size="25" fill="#173039" font-weight="400">성읍들과 구분</text>
<rect x="38" y="493" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="552" r="29" fill="#dcece3"/>
<g transform="translate(87 552)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 17C-6 7-13 4-13-5a13 13 0 1 1 26 0c0 9-7 12-13 22Z"/><circle cy="-5" r="4"/></g>
<text x="133" y="525" font-size="19" fill="#28665e" font-weight="700">16–23절</text>
<text x="133" y="559" font-size="30" fill="#173039" font-weight="700">정복 범위와 남은 곳</text>
<text x="133" y="594" font-size="25" fill="#173039" font-weight="400">할락 산~바알갓 / 헤브론·드빌·아납 / 아낙 자손은</text>
<text x="133" y="627" font-size="25" fill="#173039" font-weight="400">가사·가드·아스돗에 남음</text>
<text x="42" y="691" font-size="23" fill="#40544d" font-weight="400">메롬 물가의 위치와 하솔 파괴층의 주체는 확정하기 어려움</text>
</svg>
