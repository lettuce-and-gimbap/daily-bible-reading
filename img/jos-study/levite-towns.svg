<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">20–33절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">나머지 그핫 10곳 · 게르손 13곳</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">그핫: 에브라임·단·므낫세 / 게르손:</text>
<text x="133" y="426" font-size="25" fill="#173039" font-weight="400">바산·잇사갈·아셀·납달리</text>
