<svg xmlns="http://www.w3.org/2000/svg" width="820" height="697" viewBox="0 0 820 697" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 21장 · 레위 성읍 48곳과 목초지 (본문 도해)</title><desc id="desc">실로에서 요청 / 헤브론 성읍·목초지와 갈렙의 밭·촌락을 구분 / 그핫: 에브라임·단·므낫세 / 게르손: 바산·잇사갈·아셀·납달리 / 스불론·르우벤·갓에서 받음 / 약속 성취와 안식 선언 / 전체 목록은 COVERAGE의 21장 항목 · 역본 간 성읍 표기·각주 참고</desc>
<metadata>https://www.sefaria.org/Joshua.21</metadata>
