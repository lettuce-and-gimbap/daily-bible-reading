<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–19절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">아론 자손 13곳</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">실로에서 요청 / 헤브론 성읍·목초지와 갈렙의</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">밭·촌락을 구분</text>
