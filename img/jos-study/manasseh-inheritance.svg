<svg xmlns="http://www.w3.org/2000/svg" width="820" height="698" viewBox="0 0 820 698" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 17장 · 므낫세 분깃과 숲의 개척 (본문 도해)</title><desc id="desc">마길의 길르앗·바산 / 슬로브핫의 다섯 딸이 기업을 받음 / 서쪽 열 분깃 / 세겜·믹므닷·엔답부아·가나 시내 / 벧 스안·이블르암·돌·엔돌·다아낙·므깃도 / 요셉 자손의 추가 분깃 요청 / 삼림 개척 / 벧 스안·이스르엘 골짜기의 철 병거 / 철 병거는 본문 표현 · 이 구절에 해당하는 실물 확인 없음</desc>
<metadata>https://www.sefaria.org/Joshua.17</metadata>
<rect width="820" height="698" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 17장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">므낫세 분깃과 숲의 개척</text>
<rect x="38" y="124" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-8" cy="-8" r="5"/><circle cx="10" cy="-8" r="5"/><path d="M-17 13V7a9 9 0 0 1 18 0v6m0 0V7a9 9 0 0 1 18 0v6"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–6절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">요단 동쪽과 서쪽 분깃</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">마길의 길르앗·바산 / 슬로브핫의 다섯 딸이 기업을</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">받음 / 서쪽 열 분깃</text>
<rect x="38" y="292" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="351" r="29" fill="#dcece3"/>
<g transform="translate(87 351)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 17C-6 7-13 4-13-5a13 13 0 1 1 26 0c0 9-7 12-13 22Z"/><circle cy="-5" r="4"/></g>
<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">7–13절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">서쪽 경계와 따로 속한 성읍</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">세겜·믹므닷·엔답부아·가나 시내 / 벧</text>
<text x="133" y="426" font-size="25" fill="#173039" font-weight="400">스안·이블르암·돌·엔돌·다아낙·므깃도</text>
<rect x="38" y="460" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="519" r="29" fill="#dcece3"/>
<g transform="translate(87 519)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 15V-3m0 5c-11 0-15-6-15-12 8 0 15 4 15 12Zm0-4c1-9 8-13 15-13-1 7-5 13-15 13Z"/></g>
<text x="133" y="492" font-size="19" fill="#28665e" font-weight="700">14–18절</text>
<text x="133" y="526" font-size="30" fill="#173039" font-weight="700">산림과 철 병거</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">요셉 자손의 추가 분깃 요청 / 삼림 개척 / 벧</text>
<text x="133" y="594" font-size="25" fill="#173039" font-weight="400">스안·이스르엘 골짜기의 철 병거</text>
<text x="42" y="658" font-size="23" fill="#40544d" font-weight="400">철 병거는 본문 표현 · 이 구절에 해당하는 실물 확인 없음</text>
</svg>
