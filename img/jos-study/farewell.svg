<svg xmlns="http://www.w3.org/2000/svg" width="820" height="632" viewBox="0 0 820 632" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 23장 · 여호수아의 고별 권면 (본문 도해)</title><desc id="desc">이미 받은 땅과 남은 민족 / 요단에서 해 지는 쪽 대해까지 / 율법을 지키고 여호와를 사랑하라는 권면 / 올무·덫·채찍·가시의 비유 / 약속 성취와 경고 / 연설의 정확한 장소는 23장에 적혀 있지 않음</desc>
<metadata>https://www.sefaria.org/Joshua.23</metadata>
<rect width="820" height="632" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 23장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">여호수아의 고별 권면</text>
<rect x="38" y="124" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-8" cy="-8" r="5"/><circle cx="10" cy="-8" r="5"/><path d="M-17 13V7a9 9 0 0 1 18 0v6m0 0V7a9 9 0 0 1 18 0v6"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–5절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">안식 뒤 모인 지도자들</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">이미 받은 땅과 남은 민족 / 요단에서 해 지는 쪽</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">대해까지</text>
<rect x="38" y="292" width="744" height="123" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="351" r="29" fill="#dcece3"/>
<g transform="translate(87 351)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 13c-5-4-11-5-17-4v-23c6-1 12 0 17 4 5-4 11-5 17-4V9c-6-1-12 0-17 4Zm0 0v-23"/></g>
<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">6–11절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">모세의 율법책</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">율법을 지키고 여호와를 사랑하라는 권면</text>
<rect x="38" y="427" width="744" height="123" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="486" r="29" fill="#dcece3"/>
<g transform="translate(87 486)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 15V-3m0 5c-11 0-15-6-15-12 8 0 15 4 15 12Zm0-4c1-9 8-13 15-13-1 7-5 13-15 13Z"/></g>
<text x="133" y="459" font-size="19" fill="#28665e" font-weight="700">12–16절</text>
<text x="133" y="493" font-size="30" fill="#173039" font-weight="700">언약을 어길 때</text>
<text x="133" y="528" font-size="25" fill="#173039" font-weight="400">올무·덫·채찍·가시의 비유 / 약속 성취와 경고</text>
<text x="42" y="592" font-size="23" fill="#40544d" font-weight="400">연설의 정확한 장소는 23장에 적혀 있지 않음</text>
