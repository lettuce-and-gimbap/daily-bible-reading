<svg xmlns="http://www.w3.org/2000/svg" width="820" height="665" viewBox="0 0 820 665" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 2장 · 라합의 집과 정탐꾼의 귀환 (본문 도해)</title><desc id="desc">성벽의 집 / 지붕의 삼대 아래에 숨김 / 추격대는 요단 나루로 / 창문으로 줄을 타고 탈출 / 붉은 줄은 집 안 가족을 위한 표 / 산에서 사흘을 숨은 뒤 요단을 다시 건너 보고 / 집과 표의 형태는 상징 · 나루와 은신처의 정확한 위치 미상</desc>
<metadata>https://www.sefaria.org/Joshua.2</metadata>
<rect width="820" height="665" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 2장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">라합의 집과 정탐꾼의 귀환</text>
<rect x="38" y="124" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 13v-24h7v5h6v-5h6v5h6v-5h7v24Zm12 0V3h8v10"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–7절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">싯딤에서 여리고로</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">성벽의 집 / 지붕의 삼대 아래에 숨김 / 추격대는</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">요단 나루로</text>
<rect x="38" y="292" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="351" r="29" fill="#dcece3"/>
<g transform="translate(87 351)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-13-12h26v16h-26zm15 16c0 8 8 6 8 12M0-12V4"/></g>
<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">8–21절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">창문에 남길 표</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">창문으로 줄을 타고 탈출 / 붉은 줄은 집 안 가족을</text>
<text x="133" y="426" font-size="25" fill="#173039" font-weight="400">위한 표</text>
<rect x="38" y="460" width="744" height="123" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="519" r="29" fill="#dcece3"/>
<g transform="translate(87 519)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 17C-6 7-13 4-13-5a13 13 0 1 1 26 0c0 9-7 12-13 22Z"/><circle cy="-5" r="4"/></g>
<text x="133" y="492" font-size="19" fill="#28665e" font-weight="700">22–24절</text>
<text x="133" y="526" font-size="30" fill="#173039" font-weight="700">산지에서 싯딤 쪽으로</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">산에서 사흘을 숨은 뒤 요단을 다시 건너 보고</text>
<text x="42" y="625" font-size="23" fill="#40544d" font-weight="400">집과 표의 형태는 상징 · 나루와 은신처의 정확한 위치 미상</text>
</svg>
