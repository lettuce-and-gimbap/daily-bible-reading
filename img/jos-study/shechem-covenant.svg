<svg xmlns="http://www.w3.org/2000/svg" width="820" height="763" viewBox="0 0 820 763" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 24장 · 세겜의 언약과 세 매장 기록 (본문 도해)</title><desc id="desc">큰 강 건너 → 가나안·세일 → 애굽·홍해·광야 → 요단 동쪽·모압 → 여리고 / 이방 신을 버리라는 요청과 백성의 응답 / 율법책에 기록 / 성소 곁 나무 아래 증거의 돌 / 여호수아: 가아스 산 북쪽 딤낫 세라 / 요셉의 유해: 세겜에서 야곱이 산 밭 / 엘르아살: 에브라임 산지(새번역: 기브아) / 텔 발라타는 고대 세겜 유적 · 언약의 돌과 본문의 무덤은 사진으로 확인할 수 없음</desc>
<metadata>https://www.sefaria.org/Joshua.24 | https://whc.unesco.org/en/tentativelists/6949/</metadata>
<rect width="820" height="763" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 24장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">세겜의 언약과 세 매장 기록</text>
<rect x="38" y="124" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 17C-6 7-13 4-13-5a13 13 0 1 1 26 0c0 9-7 12-13 22Z"/><circle cy="-5" r="4"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–13절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">세겜에서 돌아본 여정</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">큰 강 건너 → 가나안·세일 → 애굽·홍해·광야 →</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">요단 동쪽·모압 → 여리고</text>
<rect x="38" y="292" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="351" r="29" fill="#dcece3"/>
<g transform="translate(87 351)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 13c-5-4-11-5-17-4v-23c6-1 12 0 17 4 5-4 11-5 17-4V9c-6-1-12 0-17 4Zm0 0v-23"/></g>
<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">14–28절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">언약의 기록과 큰 돌</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">이방 신을 버리라는 요청과 백성의 응답 / 율법책에</text>
<text x="133" y="426" font-size="25" fill="#173039" font-weight="400">기록 / 성소 곁 나무 아래 증거의 돌</text>
<rect x="38" y="460" width="744" height="189" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="519" r="29" fill="#dcece3"/>
<g transform="translate(87 519)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-17 12l4-11L-2-3l7 15Zm18 0L7 1l9 2 3 9ZM-8-3l3-10 12-2L13-3 7 1 0-3Z"/></g>
<text x="133" y="492" font-size="19" fill="#28665e" font-weight="700">29–33절</text>
<text x="133" y="526" font-size="30" fill="#173039" font-weight="700">세 곳의 매장</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">여호수아: 가아스 산 북쪽 딤낫 세라 / 요셉의 유해:</text>
<text x="133" y="594" font-size="25" fill="#173039" font-weight="400">세겜에서 야곱이 산 밭 / 엘르아살: 에브라임</text>
<text x="133" y="627" font-size="25" fill="#173039" font-weight="400">산지(새번역: 기브아)</text>
<text x="42" y="691" font-size="23" fill="#40544d" font-weight="400">텔 발라타는 고대 세겜 유적 · 언약의 돌과 본문의 무덤은</text>
<text x="42" y="723" font-size="23" fill="#40544d" font-weight="400">사진으로 확인할 수 없음</text>
</svg>
