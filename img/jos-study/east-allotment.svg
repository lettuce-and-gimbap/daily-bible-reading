<svg xmlns="http://www.w3.org/2000/svg" width="820" height="698" viewBox="0 0 820 698" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 13장 · 남은 땅과 요단 동편의 기업 (본문 도해)</title><desc id="desc">블레셋 다섯 도시·그술·시돈·레바논 방면 / 서쪽 아홉 지파 반에게 분배 명령 / 아르논과 아로엘·메드바·헤스본 / 점술가 발람의 죽음도 회고 / 갓: 길르앗과 요단 동편 / 므낫세: 바산·야일의 고을 / 레위에게 별도 영토 없음 / 요단 동편 군별 목록은 COVERAGE의 13장 항목</desc>
<metadata>https://www.sefaria.org/Joshua.13</metadata>
<rect width="820" height="698" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 13장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">남은 땅과 요단 동편의 기업</text>
<rect x="38" y="124" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 17C-6 7-13 4-13-5a13 13 0 1 1 26 0c0 9-7 12-13 22Z"/><circle cy="-5" r="4"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–7절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">점령이 남은 지역</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">블레셋 다섯 도시·그술·시돈·레바논 방면 / 서쪽</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">아홉 지파 반에게 분배 명령</text>
<rect x="38" y="292" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="351" r="29" fill="#dcece3"/>
<g transform="translate(87 351)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16-9q8-6 16 0t16 0M-16 0q8-6 16 0t16 0m-32 9q8-6 16 0t16 0"/></g>
<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">8–23절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">동편 전체와 르우벤</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">아르논과 아로엘·메드바·헤스본 / 점술가 발람의</text>
<text x="133" y="426" font-size="25" fill="#173039" font-weight="400">죽음도 회고</text>
<rect x="38" y="460" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="519" r="29" fill="#dcece3"/>
<g transform="translate(87 519)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 13v-24h7v5h6v-5h6v5h6v-5h7v24Zm12 0V3h8v10"/></g>
<text x="133" y="492" font-size="19" fill="#28665e" font-weight="700">24–33절</text>
<text x="133" y="526" font-size="30" fill="#173039" font-weight="700">갓과 동쪽 므낫세 반 지파</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">갓: 길르앗과 요단 동편 / 므낫세: 바산·야일의 고을</text>
<text x="133" y="594" font-size="25" fill="#173039" font-weight="400">/ 레위에게 별도 영토 없음</text>
<text x="42" y="658" font-size="23" fill="#40544d" font-weight="400">요단 동편 군별 목록은 COVERAGE의 13장 항목</text>
</svg>
