<svg xmlns="http://www.w3.org/2000/svg" width="820" height="698" viewBox="0 0 820 698" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 4장 · 요단 가운데와 길갈의 돌 (본문 도해)</title><desc id="desc">각 지파에서 한 사람이 제사장들이 서 있던 곳의 돌을 멤 / 제사장들이 섰던 자리에 여호수아가 돌을 세움 / 궤가 나오자 물이 돌아옴 / 첫째 달 열흘, 여리고 동쪽 길갈 진영 / 다음 세대의 질문에 답하는 표징 / 길갈 진영의 정확한 위치 미확정 · 돌의 형태는 상징</desc>
<metadata>https://www.sefaria.org/Joshua.4</metadata>
<rect width="820" height="698" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 4장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">요단 가운데와 길갈의 돌</text>
<rect x="38" y="124" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-17 12l4-11L-2-3l7 15Zm18 0L7 1l9 2 3 9ZM-8-3l3-10 12-2L13-3 7 1 0-3Z"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–8절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">열두 지파가 고른 돌</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">각 지파에서 한 사람이 제사장들이 서 있던 곳의</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">돌을 멤</text>
<rect x="38" y="292" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="351" r="29" fill="#dcece3"/>
<g transform="translate(87 351)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-14-9h28v19h-28zm-4 15h36M-18-9h36M-8-9l-3-8m19 8 3-8"/></g>
<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">9–18절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">강 가운데의 돌</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">제사장들이 섰던 자리에 여호수아가 돌을 세움 /</text>
<text x="133" y="426" font-size="25" fill="#173039" font-weight="400">궤가 나오자 물이 돌아옴</text>
<rect x="38" y="460" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="519" r="29" fill="#dcece3"/>
<g transform="translate(87 519)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-17 12l4-11L-2-3l7 15Zm18 0L7 1l9 2 3 9ZM-8-3l3-10 12-2L13-3 7 1 0-3Z"/></g>
<text x="133" y="492" font-size="19" fill="#28665e" font-weight="700">19–24절</text>
<text x="133" y="526" font-size="30" fill="#173039" font-weight="700">길갈에 세운 돌</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">첫째 달 열흘, 여리고 동쪽 길갈 진영 / 다음 세대의</text>
<text x="133" y="594" font-size="25" fill="#173039" font-weight="400">질문에 답하는 표징</text>
<text x="42" y="658" font-size="23" fill="#40544d" font-weight="400">길갈 진영의 정확한 위치 미확정 · 돌의 형태는 상징</text>
</svg>
