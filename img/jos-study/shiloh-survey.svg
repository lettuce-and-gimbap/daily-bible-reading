<svg xmlns="http://www.w3.org/2000/svg" width="820" height="698" viewBox="0 0 820 698" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 18장 · 실로의 회막과 베냐민의 기업 (본문 도해)</title><desc id="desc">일곱 지파에서 셋씩 / 성읍을 일곱 구획으로 책에 기록 / 실로에서 제비 / 요단·여리고 → 루스·아래 벧호론 → 기럇 여아림 → 힌놈 골짜기·보한의 돌 → 염해 / 여리고·벧엘·기브온·여부스 등을 포함 / 전체 목록은 COVERAGE의 18장 항목 / 조사 기록의 원본은 남아 있지 않으며 경계선은 개략적인 순서</desc>
<metadata>https://www.sefaria.org/Joshua.18</metadata>
<rect width="820" height="698" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 18장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">실로의 회막과 베냐민의 기업</text>
<rect x="38" y="124" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
<g transform="translate(87 183)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m-18 12 17-25L18 12Zm10 0 7-12 8 12"/></g>
<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–10절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">회막을 세운 실로</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">일곱 지파에서 셋씩 / 성읍을 일곱 구획으로 책에</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">기록 / 실로에서 제비</text>
<rect x="38" y="292" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="351" r="29" fill="#dcece3"/>
<g transform="translate(87 351)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-15 0h28m-10-10L14 0 3 10"/></g>
<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">11–20절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">유다와 요셉 사이</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">요단·여리고 → 루스·아래 벧호론 → 기럇 여아림 →</text>
<text x="133" y="426" font-size="25" fill="#173039" font-weight="400">힌놈 골짜기·보한의 돌 → 염해</text>
<rect x="38" y="460" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="519" r="29" fill="#dcece3"/>
<g transform="translate(87 519)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 13v-24h7v5h6v-5h6v5h6v-5h7v24Zm12 0V3h8v10"/></g>
<text x="133" y="492" font-size="19" fill="#28665e" font-weight="700">21–28절</text>
<text x="133" y="526" font-size="30" fill="#173039" font-weight="700">베냐민 성읍 12 + 14</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">여리고·벧엘·기브온·여부스 등을 포함 / 전체 목록은</text>
<text x="133" y="594" font-size="25" fill="#173039" font-weight="400">COVERAGE의 18장 항목</text>
<text x="42" y="658" font-size="23" fill="#40544d" font-weight="400">조사 기록의 원본은 남아 있지 않으며 경계선은 개략적인 순서</text>
</svg>
