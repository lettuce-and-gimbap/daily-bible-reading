<text x="133" y="156" font-size="19" fill="#28665e" font-weight="700">1–9절</text>
<text x="133" y="190" font-size="30" fill="#173039" font-weight="700">약속의 범위</text>
<text x="133" y="225" font-size="25" fill="#173039" font-weight="400">광야·레바논·유브라데·대해 / 요단을 건너라는</text>
<text x="133" y="258" font-size="25" fill="#173039" font-weight="400">명령과 율법책</text>
<rect x="38" y="292" width="744" height="123" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="351" r="29" fill="#dcece3"/>
<g transform="translate(87 351)" stroke="#28665e" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-15 0h28m-10-10L14 0 3 10"/></g>
<text x="133" y="324" font-size="19" fill="#28665e" font-weight="700">10–11절</text>
<text x="133" y="358" font-size="30" fill="#173039" font-weight="700">사흘 안에 준비</text>
<text x="133" y="393" font-size="25" fill="#173039" font-weight="400">관리들이 진영을 돌며 양식을 준비시킴</text>
<rect x="38" y="427" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="486" r="29" fill="#dcece3"/>
