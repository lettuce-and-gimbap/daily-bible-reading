<text x="133" y="459" font-size="19" fill="#28665e" font-weight="700">12–18절</text>
<text x="133" y="493" font-size="30" fill="#173039" font-weight="700">동편 지파의 응답</text>
<text x="133" y="528" font-size="25" fill="#173039" font-weight="400">가족과 가축은 동편에 / 무장한 형제들이 먼저 건너</text>
<text x="133" y="561" font-size="25" fill="#173039" font-weight="400">도움</text>
<text x="42" y="625" font-size="23" fill="#40544d" font-weight="400">본문의 약속 범위 개념도 · 당시 점령 면적과 구분</text>
