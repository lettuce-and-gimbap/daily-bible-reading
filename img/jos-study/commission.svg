<svg xmlns="http://www.w3.org/2000/svg" width="820" height="665" viewBox="0 0 820 665" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">수 1장 · 여호수아의 위임과 도하 준비 (본문 도해)</title><desc id="desc">광야·레바논·유브라데·대해 / 요단을 건너라는 명령과 율법책 / 관리들이 진영을 돌며 양식을 준비시킴 / 가족과 가축은 동편에 / 무장한 형제들이 먼저 건너 도움 / 본문의 약속 범위 개념도 · 당시 점령 면적과 구분</desc>
<metadata>https://www.sefaria.org/Joshua.1</metadata>
<rect width="820" height="665" rx="20" fill="#f5f3eb"/>
<text x="38" y="45" font-size="22" fill="#28665e" font-weight="700">여호수아 1장</text>
<text x="38" y="94" font-size="38" fill="#173039" font-weight="700">여호수아의 위임과 도하 준비</text>
<rect x="38" y="124" width="744" height="156" rx="15" fill="#fffdf7" stroke="#d6e2d8"/>
<circle cx="87" cy="183" r="29" fill="#dcece3"/>
