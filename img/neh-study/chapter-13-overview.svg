<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">느헤미야 13장 · 성전 창고와 안식일의 회복</title>
<desc id="desc">예루살렘 성전 골방과 성문 · 두로 · 아스돗·암몬·모압 / 율법을 읽고 도비야의 세간을 성전 골방에서 내보냄 (1–9절) → 레위인의 몫을 회복하고 안식일에 성문을 닫음 (10–22절) → 혼인과 제사장 가문의 문제를 바로잡고 봉사 직무를 정비함 (23–31절) / 성전 기물(9) · 곡식·포도주·기름(12) · 생선과 물품(16) / 고고학 배경 두로 항구 유적</desc>
<rect x="0" y="0" width="920" height="540" rx="20" fill="#f7f5ee"/>
<text x="36" y="39" font-size="19" fill="#684619" font-weight="700">느헤미야 13장 · 본문 도해</text>
<text x="36" y="82" font-size="34" fill="#1d2d35" font-weight="700">성전 창고와 안식일의 회복</text>
<rect x="36" y="105" width="848" height="78" rx="12" fill="#f1e5cf"/>
<text x="55" y="131" font-size="17" fill="#684619" font-weight="700">장소</text>
<text x="55" y="160" font-size="21" fill="#1d2d35">예루살렘 성전 골방과 성문 · 두로 · 아스돗·암몬·모압</text>
<text x="36" y="214" font-size="18" fill="#684619" font-weight="700">본문의 흐름</text>
<path d="M77 252v116" fill="none" stroke="#684619" stroke-width="2"/>
<rect x="98" y="228" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="252" r="6" fill="#684619"/>
<text x="117" y="259" font-size="18" fill="#684619" font-weight="700">1–9절</text>
<text x="216" y="259" font-size="20" fill="#1d2d35">율법을 읽고 도비야의 세간을 성전 골방에서 내보냄</text>
<rect x="98" y="286" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="310" r="6" fill="#684619"/>
<text x="117" y="317" font-size="18" fill="#684619" font-weight="700">10–22절</text>
<text x="216" y="317" font-size="20" fill="#1d2d35">레위인의 몫을 회복하고 안식일에 성문을 닫음</text>
