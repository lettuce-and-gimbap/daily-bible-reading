<circle cx="77" cy="368" r="6" fill="#684619"/>
<text x="117" y="375" font-size="18" fill="#684619" font-weight="700">23–31절</text>
<text x="216" y="375" font-size="20" fill="#1d2d35">혼인과 제사장 가문의 문제를 바로잡고 봉사 직무를 정비함</text>
<rect x="36" y="414" width="848" height="74" rx="12" fill="#f1e5cf"/>
<text x="55" y="440" font-size="17" fill="#684619" font-weight="700">기물·기록·표지</text>
<text x="55" y="468" font-size="20" fill="#1d2d35">성전 기물(9) · 곡식·포도주·기름(12) · 생선과 물품(16)</text>
<text x="36" y="519" font-size="16" fill="#684619">고고학 배경 · 두로 항구 유적</text>
