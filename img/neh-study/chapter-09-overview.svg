<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">느헤미야 9장 · 역사를 돌아보는 공동체 기도</title>
<desc id="desc">예루살렘 집회 · 기도에 회상된 애굽과 광야와 약속의 땅 / 금식하고 율법을 읽으며 죄를 자복함 (1–5절) → 창조와 출애굽부터 반복된 불순종과 하나님의 긍휼을 기억함 (6–31절) → 현재의 고통을 아뢰고 언약을 문서로 남김 (32–38절) / 굵은 베와 티끌(1) · 율법책(3) · 언약 문서와 인(38) / 고고학 배경 바사 시대 예루살렘의 인장과 인장 자국</desc>
<rect x="0" y="0" width="920" height="540" rx="20" fill="#f7f5ee"/>
<text x="36" y="39" font-size="19" fill="#684619" font-weight="700">느헤미야 9장 · 본문 도해</text>
<text x="36" y="82" font-size="34" fill="#1d2d35" font-weight="700">역사를 돌아보는 공동체 기도</text>
<rect x="36" y="105" width="848" height="78" rx="12" fill="#f1e5cf"/>
<text x="55" y="131" font-size="17" fill="#684619" font-weight="700">장소</text>
<text x="55" y="160" font-size="21" fill="#1d2d35">예루살렘 집회 · 기도에 회상된 애굽과 광야와 약속의 땅</text>
<text x="36" y="214" font-size="18" fill="#684619" font-weight="700">본문의 흐름</text>
<path d="M77 252v116" fill="none" stroke="#684619" stroke-width="2"/>
<rect x="98" y="228" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="252" r="6" fill="#684619"/>
<text x="117" y="259" font-size="18" fill="#684619" font-weight="700">1–5절</text>
<text x="216" y="259" font-size="20" fill="#1d2d35">금식하고 율법을 읽으며 죄를 자복함</text>
<rect x="98" y="286" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="310" r="6" fill="#684619"/>
<text x="117" y="317" font-size="18" fill="#684619" font-weight="700">6–31절</text>
<text x="216" y="317" font-size="20" fill="#1d2d35">창조와 출애굽부터 반복된 불순종과 하나님의 긍휼을 기억함</text>
<rect x="98" y="344" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="368" r="6" fill="#684619"/>
<text x="117" y="375" font-size="18" fill="#684619" font-weight="700">32–38절</text>
<text x="216" y="375" font-size="20" fill="#1d2d35">현재의 고통을 아뢰고 언약을 문서로 남김</text>
<rect x="36" y="414" width="848" height="74" rx="12" fill="#f1e5cf"/>
<text x="55" y="440" font-size="17" fill="#684619" font-weight="700">기물·기록·표지</text>
<text x="55" y="468" font-size="20" fill="#1d2d35">굵은 베와 티끌(1) · 율법책(3) · 언약 문서와 인(38)</text>
<text x="36" y="519" font-size="16" fill="#684619">고고학 배경 · 바사 시대 예루살렘의 인장과 인장 자국</text>
