<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">느헤미야 6장 · 위협 속에서 완공한 성벽</title>
<desc id="desc">오노 평지 · 예루살렘 성전 · 예루살렘 성벽 / 회동 요구와 봉하지 않은 편지의 모함을 거절함 (1–9절) → 성전에 들어가 숨으라는 제안을 물리침 (10–14절) → 오십이 일 만에 성벽을 완공하나 도비야의 편지는 이어짐 (15–19절) / 봉하지 않은 편지(5) · 성전 문(10) · 성벽(15) / 고고학 배경 바사 시대 예루살렘 성벽 연구</desc>
<rect x="0" y="0" width="920" height="540" rx="20" fill="#f7f5ee"/>
<text x="36" y="39" font-size="19" fill="#684619" font-weight="700">느헤미야 6장 · 본문 도해</text>
