<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">느헤미야 7장 · 성문 경비와 첫 귀환자 명부</title>
<desc id="desc">예루살렘 · 바벨론과 유다의 여러 성읍 / 성문을 달고 성의 책임자와 경비를 세움 (1–3절) → 주민이 적은 성을 위해 인구를 파악할 귀환 명부를 찾음 (4–5절) → 첫 귀환자들과 성전 봉사자, 예물과 정착을 기록함 (6–73절) / 성문과 빗장(1–3) · 계보 명부(5, 64) · 금과 은, 제사장 옷(70–72) / 고고학 배경 아케메네스 금화 다릭</desc>
<rect x="0" y="0" width="920" height="540" rx="20" fill="#f7f5ee"/>
<text x="36" y="39" font-size="19" fill="#684619" font-weight="700">느헤미야 7장 · 본문 도해</text>
<text x="36" y="82" font-size="34" fill="#1d2d35" font-weight="700">성문 경비와 첫 귀환자 명부</text>
<rect x="36" y="105" width="848" height="78" rx="12" fill="#f1e5cf"/>
<text x="55" y="131" font-size="17" fill="#684619" font-weight="700">장소</text>
<text x="55" y="160" font-size="21" fill="#1d2d35">예루살렘 · 바벨론과 유다의 여러 성읍</text>
<text x="36" y="214" font-size="18" fill="#684619" font-weight="700">본문의 흐름</text>
<path d="M77 252v116" fill="none" stroke="#684619" stroke-width="2"/>
<rect x="98" y="228" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="252" r="6" fill="#684619"/>
<text x="117" y="259" font-size="18" fill="#684619" font-weight="700">1–3절</text>
<text x="216" y="259" font-size="20" fill="#1d2d35">성문을 달고 성의 책임자와 경비를 세움</text>
<rect x="98" y="286" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="310" r="6" fill="#684619"/>
<text x="117" y="317" font-size="18" fill="#684619" font-weight="700">4–5절</text>
<text x="216" y="317" font-size="20" fill="#1d2d35">주민이 적은 성을 위해 인구를 파악할 귀환 명부를 찾음</text>
<rect x="98" y="344" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="368" r="6" fill="#684619"/>
<text x="117" y="375" font-size="18" fill="#684619" font-weight="700">6–73절</text>
<text x="216" y="375" font-size="20" fill="#1d2d35">첫 귀환자들과 성전 봉사자, 예물과 정착을 기록함</text>
<rect x="36" y="414" width="848" height="74" rx="12" fill="#f1e5cf"/>
<text x="55" y="440" font-size="17" fill="#684619" font-weight="700">기물·기록·표지</text>
<text x="55" y="468" font-size="20" fill="#1d2d35">성문과 빗장(1–3) · 계보 명부(5, 64) · 금과 은, 제사장 옷(70–72)</text>
<text x="36" y="519" font-size="16" fill="#684619">고고학 배경 · 아케메네스 금화 다릭</text>
</svg>
