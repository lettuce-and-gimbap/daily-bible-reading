<text x="55" y="440" font-size="17" fill="#684619" font-weight="700">기물·기록·표지</text>
<text x="55" y="468" font-size="20" fill="#1d2d35">언약의 인(1) · 삼분의 일 세겔(32) · 땔감과 예물(34–39)</text>
