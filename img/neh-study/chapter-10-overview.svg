<text x="36" y="39" font-size="19" fill="#684619" font-weight="700">느헤미야 10장 · 본문 도해</text>
<text x="36" y="82" font-size="34" fill="#1d2d35" font-weight="700">인봉한 언약과 성전 봉사</text>
