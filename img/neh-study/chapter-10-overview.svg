<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">느헤미야 10장 · 인봉한 언약과 성전 봉사</title>
<desc id="desc">예루살렘 · 하나님의 성전과 곳간 · 각 성읍 / 지도자들이 문서에 인을 치고 백성이 율법을 따르기로 맹세함 (1–29절) → 혼인과 안식일 거래에 관한 약속, 성전 비용 규정을 세움 (30–33절) → 제단의 땔감과 첫 소산과 십일조를 맡기기로 함 (34–39절) / 언약의 인(1) · 삼분의 일 세겔(32) · 땔감과 예물(34–39) / 고고학 배경 바사 시대 예루살렘의 인장과 인장 자국</desc>
