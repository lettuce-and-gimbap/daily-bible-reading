<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">느헤미야 5장 · 빚과 담보를 돌려주는 개혁</title>
<desc id="desc">유다의 밭과 집 · 예루살렘의 큰 집회 / 기근과 세금 때문에 재산을 담보로 잡힌 백성이 호소함 (1–5절) → 느헤미야가 귀족들을 책망하고 재산 반환을 약속받음 (6–13절) → 총독 몫을 요구하지 않고 사람들에게 식사를 제공함 (14–19절) / 밭·포도원·감람원·집(11) · 돈과 곡식(11) · 옷자락(13) / 고고학 배경 예루살렘 남동쪽 구릉 발굴</desc>
<rect x="0" y="0" width="920" height="540" rx="20" fill="#f7f5ee"/>
<text x="36" y="39" font-size="19" fill="#684619" font-weight="700">느헤미야 5장 · 본문 도해</text>
<text x="36" y="82" font-size="34" fill="#1d2d35" font-weight="700">빚과 담보를 돌려주는 개혁</text>
<rect x="36" y="105" width="848" height="78" rx="12" fill="#f1e5cf"/>
<text x="55" y="131" font-size="17" fill="#684619" font-weight="700">장소</text>
<text x="55" y="160" font-size="21" fill="#1d2d35">유다의 밭과 집 · 예루살렘의 큰 집회</text>
<text x="36" y="214" font-size="18" fill="#684619" font-weight="700">본문의 흐름</text>
<path d="M77 252v116" fill="none" stroke="#684619" stroke-width="2"/>
<rect x="98" y="228" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="252" r="6" fill="#684619"/>
<text x="117" y="259" font-size="18" fill="#684619" font-weight="700">1–5절</text>
<text x="216" y="259" font-size="20" fill="#1d2d35">기근과 세금 때문에 재산을 담보로 잡힌 백성이 호소함</text>
<rect x="98" y="286" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="310" r="6" fill="#684619"/>
<text x="117" y="317" font-size="18" fill="#684619" font-weight="700">6–13절</text>
<text x="216" y="317" font-size="20" fill="#1d2d35">느헤미야가 귀족들을 책망하고 재산 반환을 약속받음</text>
<rect x="98" y="344" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="368" r="6" fill="#684619"/>
<text x="117" y="375" font-size="18" fill="#684619" font-weight="700">14–19절</text>
<text x="216" y="375" font-size="20" fill="#1d2d35">총독 몫을 요구하지 않고 사람들에게 식사를 제공함</text>
<rect x="36" y="414" width="848" height="74" rx="12" fill="#f1e5cf"/>
<text x="55" y="440" font-size="17" fill="#684619" font-weight="700">기물·기록·표지</text>
<text x="55" y="468" font-size="20" fill="#1d2d35">밭·포도원·감람원·집(11) · 돈과 곡식(11) · 옷자락(13)</text>
<text x="36" y="519" font-size="16" fill="#684619">고고학 배경 · 예루살렘 남동쪽 구릉 발굴</text>
