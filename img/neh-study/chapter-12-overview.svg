<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">느헤미야 12장 · 성벽 위 두 감사 행렬</title>
<desc id="desc">예루살렘 성벽 · 분문 · 에브라임 문 · 감옥 문 · 성전 / 제사장과 레위인을 기록하고 봉헌식을 위해 모여 정결하게 함 (1–30절) → 두 감사 행렬이 성벽 위에서 갈라져 성전에서 만남 (31–43절) → 창고 책임자를 세우고 제사장과 레위인의 몫을 마련함 (44–47절) / 제금·비파·수금(27) · 나팔(35, 41) · 헌물과 첫 소산(44) / 고고학 배경 바사 시대 예루살렘 성벽 연구</desc>
<rect x="0" y="0" width="920" height="540" rx="20" fill="#f7f5ee"/>
<text x="36" y="39" font-size="19" fill="#684619" font-weight="700">느헤미야 12장 · 본문 도해</text>
<text x="36" y="82" font-size="34" fill="#1d2d35" font-weight="700">성벽 위 두 감사 행렬</text>
<rect x="36" y="105" width="848" height="78" rx="12" fill="#f1e5cf"/>
<text x="55" y="131" font-size="17" fill="#684619" font-weight="700">장소</text>
<text x="55" y="160" font-size="21" fill="#1d2d35">예루살렘 성벽 · 분문 · 에브라임 문 · 감옥 문 · 성전</text>
<text x="36" y="214" font-size="18" fill="#684619" font-weight="700">본문의 흐름</text>
<path d="M77 252v116" fill="none" stroke="#684619" stroke-width="2"/>
<rect x="98" y="228" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="252" r="6" fill="#684619"/>
<text x="117" y="259" font-size="18" fill="#684619" font-weight="700">1–30절</text>
<text x="216" y="259" font-size="20" fill="#1d2d35">제사장과 레위인을 기록하고 봉헌식을 위해 모여 정결하게 함</text>
<rect x="98" y="286" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="310" r="6" fill="#684619"/>
<text x="117" y="317" font-size="18" fill="#684619" font-weight="700">31–43절</text>
<text x="216" y="317" font-size="20" fill="#1d2d35">두 감사 행렬이 성벽 위에서 갈라져 성전에서 만남</text>
<rect x="98" y="344" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="368" r="6" fill="#684619"/>
<text x="117" y="375" font-size="18" fill="#684619" font-weight="700">44–47절</text>
<text x="216" y="375" font-size="20" fill="#1d2d35">창고 책임자를 세우고 제사장과 레위인의 몫을 마련함</text>
<rect x="36" y="414" width="848" height="74" rx="12" fill="#f1e5cf"/>
<text x="55" y="440" font-size="17" fill="#684619" font-weight="700">기물·기록·표지</text>
<text x="55" y="468" font-size="20" fill="#1d2d35">제금·비파·수금(27) · 나팔(35, 41) · 헌물과 첫 소산(44)</text>
<text x="36" y="519" font-size="16" fill="#684619">고고학 배경 · 바사 시대 예루살렘 성벽 연구</text>
