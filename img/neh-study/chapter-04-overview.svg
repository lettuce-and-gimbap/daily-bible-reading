<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">느헤미야 4장 · 공사와 경계를 병행하다</title>
<desc id="desc">예루살렘 성벽 · 성 뒤 낮고 넓은 곳 · 성 밖 마을 / 조롱을 받으며 기도하고 성벽을 절반 높이까지 쌓음 (1–6절) → 공격 소식에 파수꾼을 두고 가족별로 방어함 (7–15절) → 무장한 채 공사하며 나팔을 집결 신호로 정함 (16–23절) / 칼·창·활·방패(13, 16–18) · 나팔(18–20) / 고고학 배경 바사 시대 예루살렘 성벽 연구</desc>
<rect x="0" y="0" width="920" height="540" rx="20" fill="#f7f5ee"/>
<text x="36" y="39" font-size="19" fill="#684619" font-weight="700">느헤미야 4장 · 본문 도해</text>
<text x="36" y="82" font-size="34" fill="#1d2d35" font-weight="700">공사와 경계를 병행하다</text>
<rect x="36" y="105" width="848" height="78" rx="12" fill="#f1e5cf"/>
<text x="55" y="131" font-size="17" fill="#684619" font-weight="700">장소</text>
<text x="55" y="160" font-size="21" fill="#1d2d35">예루살렘 성벽 · 성 뒤 낮고 넓은 곳 · 성 밖 마을</text>
<text x="36" y="214" font-size="18" fill="#684619" font-weight="700">본문의 흐름</text>
<path d="M77 252v116" fill="none" stroke="#684619" stroke-width="2"/>
<rect x="98" y="228" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="252" r="6" fill="#684619"/>
<text x="117" y="259" font-size="18" fill="#684619" font-weight="700">1–6절</text>
<text x="216" y="259" font-size="20" fill="#1d2d35">조롱을 받으며 기도하고 성벽을 절반 높이까지 쌓음</text>
<rect x="98" y="286" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="310" r="6" fill="#684619"/>
<text x="117" y="317" font-size="18" fill="#684619" font-weight="700">7–15절</text>
<text x="216" y="317" font-size="20" fill="#1d2d35">공격 소식에 파수꾼을 두고 가족별로 방어함</text>
<rect x="98" y="344" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="368" r="6" fill="#684619"/>
<text x="117" y="375" font-size="18" fill="#684619" font-weight="700">16–23절</text>
<text x="216" y="375" font-size="20" fill="#1d2d35">무장한 채 공사하며 나팔을 집결 신호로 정함</text>
<rect x="36" y="414" width="848" height="74" rx="12" fill="#f1e5cf"/>
<text x="55" y="440" font-size="17" fill="#684619" font-weight="700">기물·기록·표지</text>
<text x="55" y="468" font-size="20" fill="#1d2d35">칼·창·활·방패(13, 16–18) · 나팔(18–20)</text>
<text x="36" y="519" font-size="16" fill="#684619">고고학 배경 · 바사 시대 예루살렘 성벽 연구</text>
