<circle cx="77" cy="310" r="6" fill="#684619"/>
<text x="117" y="317" font-size="18" fill="#684619" font-weight="700">9–12절</text>
<text x="216" y="317" font-size="20" fill="#1d2d35">지도자들이 백성에게 기뻐하며 음식을 나누라고 권함</text>
<rect x="98" y="344" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="368" r="6" fill="#684619"/>
<text x="117" y="375" font-size="18" fill="#684619" font-weight="700">13–18절</text>
<text x="216" y="375" font-size="20" fill="#1d2d35">나뭇가지로 초막을 짓고 절기 내내 율법을 읽음</text>
<rect x="36" y="414" width="848" height="74" rx="12" fill="#f1e5cf"/>
<text x="55" y="440" font-size="17" fill="#684619" font-weight="700">기물·기록·표지</text>
<text x="55" y="468" font-size="20" fill="#1d2d35">율법책(1–8) · 나무 강단(4) · 초막을 지을 나뭇가지(15)</text>
<text x="36" y="519" font-size="16" fill="#684619">고고학 배경 · 예루살렘 남동쪽 구릉 발굴</text>
