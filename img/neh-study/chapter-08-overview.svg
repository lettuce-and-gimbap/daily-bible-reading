<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">느헤미야 8장 · 율법 낭독과 초막절</title>
<desc id="desc">수문 앞 광장 · 에브라임 문 광장 · 성전 뜰과 지붕 / 에스라가 율법책을 읽고 레위인들이 뜻을 풀어 줌 (1–8절) → 지도자들이 백성에게 기뻐하며 음식을 나누라고 권함 (9–12절) → 나뭇가지로 초막을 짓고 절기 내내 율법을 읽음 (13–18절) / 율법책(1–8) · 나무 강단(4) · 초막을 지을 나뭇가지(15) / 고고학 배경 예루살렘 남동쪽 구릉 발굴</desc>
<rect x="0" y="0" width="920" height="540" rx="20" fill="#f7f5ee"/>
<text x="36" y="39" font-size="19" fill="#684619" font-weight="700">느헤미야 8장 · 본문 도해</text>
<text x="36" y="82" font-size="34" fill="#1d2d35" font-weight="700">율법 낭독과 초막절</text>
<rect x="36" y="105" width="848" height="78" rx="12" fill="#f1e5cf"/>
<text x="55" y="131" font-size="17" fill="#684619" font-weight="700">장소</text>
<text x="55" y="160" font-size="21" fill="#1d2d35">수문 앞 광장 · 에브라임 문 광장 · 성전 뜰과 지붕</text>
<text x="36" y="214" font-size="18" fill="#684619" font-weight="700">본문의 흐름</text>
<path d="M77 252v116" fill="none" stroke="#684619" stroke-width="2"/>
<rect x="98" y="228" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="252" r="6" fill="#684619"/>
<text x="117" y="259" font-size="18" fill="#684619" font-weight="700">1–8절</text>
<text x="216" y="259" font-size="20" fill="#1d2d35">에스라가 율법책을 읽고 레위인들이 뜻을 풀어 줌</text>
