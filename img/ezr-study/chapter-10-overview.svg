<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">에스라 10장 · 성전 앞 총회와 혼인 조사</title>
<desc id="desc">예루살렘 성전 앞 광장 · 여호하난의 방 · 유다와 베냐민 / 백성이 울며 해결을 제안하고 예루살렘 총회를 소집함 (1–8절) → 비 속에서 모인 백성이 동의하고 가문별 조사를 진행함 (9–17절) → 이방 여인과 혼인한 사람들의 명단을 기록함 (18–44절) / 소집 공고(7–8) · 속건제 숫양(19) · 조사 명단(18–44) / 고고학 배경 예루살렘 남동쪽 구릉 발굴</desc>
<rect x="0" y="0" width="920" height="540" rx="20" fill="#f7f5ee"/>
<text x="36" y="39" font-size="19" fill="#235f55" font-weight="700">에스라 10장 · 본문 도해</text>
<text x="36" y="82" font-size="34" fill="#1d2d35" font-weight="700">성전 앞 총회와 혼인 조사</text>
<rect x="36" y="105" width="848" height="78" rx="12" fill="#e1ede6"/>
<text x="55" y="131" font-size="17" fill="#235f55" font-weight="700">장소</text>
<text x="55" y="160" font-size="21" fill="#1d2d35">예루살렘 성전 앞 광장 · 여호하난의 방 · 유다와 베냐민</text>
<text x="36" y="214" font-size="18" fill="#235f55" font-weight="700">본문의 흐름</text>
<path d="M77 252v116" fill="none" stroke="#235f55" stroke-width="2"/>
<rect x="98" y="228" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="252" r="6" fill="#235f55"/>
<text x="117" y="259" font-size="18" fill="#235f55" font-weight="700">1–8절</text>
<text x="216" y="259" font-size="20" fill="#1d2d35">백성이 울며 해결을 제안하고 예루살렘 총회를 소집함</text>
<rect x="98" y="286" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="310" r="6" fill="#235f55"/>
<text x="117" y="317" font-size="18" fill="#235f55" font-weight="700">9–17절</text>
<text x="216" y="317" font-size="20" fill="#1d2d35">비 속에서 모인 백성이 동의하고 가문별 조사를 진행함</text>
<rect x="98" y="344" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="368" r="6" fill="#235f55"/>
<text x="117" y="375" font-size="18" fill="#235f55" font-weight="700">18–44절</text>
<text x="216" y="375" font-size="20" fill="#1d2d35">이방 여인과 혼인한 사람들의 명단을 기록함</text>
<rect x="36" y="414" width="848" height="74" rx="12" fill="#e1ede6"/>
<text x="55" y="440" font-size="17" fill="#235f55" font-weight="700">기물·기록·표지</text>
<text x="55" y="468" font-size="20" fill="#1d2d35">소집 공고(7–8) · 속건제 숫양(19) · 조사 명단(18–44)</text>
<text x="36" y="519" font-size="16" fill="#235f55">고고학 배경 · 예루살렘 남동쪽 구릉 발굴</text>
