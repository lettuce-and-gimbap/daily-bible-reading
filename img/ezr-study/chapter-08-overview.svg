<rect x="98" y="228" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="252" r="6" fill="#235f55"/>
<text x="117" y="259" font-size="18" fill="#235f55" font-weight="700">1–20절</text>
<text x="216" y="259" font-size="20" fill="#1d2d35">동행자들을 점검하고 레위인과 성전 봉사자를 부름</text>
