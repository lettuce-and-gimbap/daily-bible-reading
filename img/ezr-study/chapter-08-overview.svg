<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">에스라 8장 · 아하와에서 예루살렘까지</title>
<desc id="desc">아하와 강가 · 가시뱌 · 예루살렘 성전 / 동행자들을 점검하고 레위인과 성전 봉사자를 부름 (1–20절) → 금식해 안전을 구하고 예물을 달아 맡김 (21–30절) → 예루살렘에 도착해 예물을 다시 달아 인계함 (31–36절) / 은금과 성전 그릇(25–30, 33–34) · 왕의 조서(36) / 고고학 배경 아닥사스다 명문이 있는 은제 그릇</desc>
<rect x="0" y="0" width="920" height="540" rx="20" fill="#f7f5ee"/>
<text x="36" y="39" font-size="19" fill="#235f55" font-weight="700">에스라 8장 · 본문 도해</text>
<text x="36" y="82" font-size="34" fill="#1d2d35" font-weight="700">아하와에서 예루살렘까지</text>
<rect x="36" y="105" width="848" height="78" rx="12" fill="#e1ede6"/>
<text x="55" y="131" font-size="17" fill="#235f55" font-weight="700">장소</text>
<text x="55" y="160" font-size="21" fill="#1d2d35">아하와 강가 · 가시뱌 · 예루살렘 성전</text>
<text x="36" y="214" font-size="18" fill="#235f55" font-weight="700">본문의 흐름</text>
