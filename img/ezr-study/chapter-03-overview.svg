<text x="55" y="440" font-size="17" fill="#235f55" font-weight="700">기물·기록·표지</text>
<text x="55" y="468" font-size="20" fill="#1d2d35">제단(2–3) · 백향목(7) · 나팔과 제금(10)</text>
<text x="36" y="519" font-size="16" fill="#235f55">고고학 배경 · 두로 항구 유적</text>
