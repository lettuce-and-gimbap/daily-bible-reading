<circle cx="77" cy="368" r="6" fill="#235f55"/>
<text x="117" y="375" font-size="18" fill="#235f55" font-weight="700">10–13절</text>
<text x="216" y="375" font-size="20" fill="#1d2d35">성전 기초를 놓자 기쁨과 울음이 함께 터져 나옴</text>
