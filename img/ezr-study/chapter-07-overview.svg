<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">에스라 7장 · 에스라의 귀환과 왕의 위임</title>
<desc id="desc">바벨론 → 예루살렘 · 강 건너편 관할 지역 / 율법에 익숙한 에스라가 바벨론에서 예루살렘에 도착함 (1–10절) → 아닥사스다가 예배에 필요한 예물과 재정을 지원함 (11–24절) → 에스라에게 재판관을 세우고 율법을 가르칠 권한을 줌 (25–28절) / 왕의 조서(11) · 율법(14, 25) · 은금과 성전 그릇(15–19) / 고고학 배경 아닥사스다 명문이 있는 은제 그릇</desc>
<rect x="0" y="0" width="920" height="540" rx="20" fill="#f7f5ee"/>
<text x="36" y="39" font-size="19" fill="#235f55" font-weight="700">에스라 7장 · 본문 도해</text>
<text x="36" y="82" font-size="34" fill="#1d2d35" font-weight="700">에스라의 귀환과 왕의 위임</text>
<rect x="36" y="105" width="848" height="78" rx="12" fill="#e1ede6"/>
<text x="55" y="131" font-size="17" fill="#235f55" font-weight="700">장소</text>
<text x="55" y="160" font-size="21" fill="#1d2d35">바벨론 → 예루살렘 · 강 건너편 관할 지역</text>
<text x="36" y="214" font-size="18" fill="#235f55" font-weight="700">본문의 흐름</text>
<path d="M77 252v116" fill="none" stroke="#235f55" stroke-width="2"/>
<rect x="98" y="228" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="252" r="6" fill="#235f55"/>
<text x="117" y="259" font-size="18" fill="#235f55" font-weight="700">1–10절</text>
<text x="216" y="259" font-size="20" fill="#1d2d35">율법에 익숙한 에스라가 바벨론에서 예루살렘에 도착함</text>
<rect x="98" y="286" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="310" r="6" fill="#235f55"/>
<text x="117" y="317" font-size="18" fill="#235f55" font-weight="700">11–24절</text>
<text x="216" y="317" font-size="20" fill="#1d2d35">아닥사스다가 예배에 필요한 예물과 재정을 지원함</text>
<rect x="98" y="344" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="368" r="6" fill="#235f55"/>
<text x="117" y="375" font-size="18" fill="#235f55" font-weight="700">25–28절</text>
<text x="216" y="375" font-size="20" fill="#1d2d35">에스라에게 재판관을 세우고 율법을 가르칠 권한을 줌</text>
<rect x="36" y="414" width="848" height="74" rx="12" fill="#e1ede6"/>
<text x="55" y="440" font-size="17" fill="#235f55" font-weight="700">기물·기록·표지</text>
<text x="55" y="468" font-size="20" fill="#1d2d35">왕의 조서(11) · 율법(14, 25) · 은금과 성전 그릇(15–19)</text>
<text x="36" y="519" font-size="16" fill="#235f55">고고학 배경 · 아닥사스다 명문이 있는 은제 그릇</text>
</svg>
