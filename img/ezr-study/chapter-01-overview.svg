<circle cx="77" cy="310" r="6" fill="#235f55"/>
<text x="117" y="317" font-size="18" fill="#235f55" font-weight="700">5–6절</text>
<text x="216" y="317" font-size="20" fill="#1d2d35">귀환을 준비하는 이들에게 이웃이 예물을 보탬</text>
<rect x="98" y="344" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="368" r="6" fill="#235f55"/>
<text x="117" y="375" font-size="18" fill="#235f55" font-weight="700">7–11절</text>
<text x="216" y="375" font-size="20" fill="#1d2d35">성전 기물을 세스바살에게 넘겨줌</text>
<rect x="36" y="414" width="848" height="74" rx="12" fill="#e1ede6"/>
<text x="55" y="440" font-size="17" fill="#235f55" font-weight="700">기물·기록·표지</text>
<text x="55" y="468" font-size="20" fill="#1d2d35">조서(1) · 은과 금(4, 6) · 성전의 금은 그릇(7–11)</text>
<text x="36" y="519" font-size="16" fill="#235f55">고고학 배경 · 고레스 원통</text>
