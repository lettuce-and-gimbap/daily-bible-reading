<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">에스라 4장 · 성전과 성읍 재건에 대한 방해</title>
<desc id="desc">예루살렘 · 사마리아 · 바사 왕실 / 재건 참여를 거절당한 이들이 성전 공사를 방해함 (1–5절) → 후대 왕들에게 고발하고 성읍 공사를 강제로 멈추게 함 (6–23절) → 이야기가 다리오 제이년까지 멈춘 성전 공사로 돌아감 (24절) / 아람어로 쓴 편지(7) · 왕의 답신(17–22) / 고고학 배경 엘레판티네 아람어 청원서</desc>
<rect x="0" y="0" width="920" height="540" rx="20" fill="#f7f5ee"/>
<text x="36" y="39" font-size="19" fill="#235f55" font-weight="700">에스라 4장 · 본문 도해</text>
<text x="36" y="82" font-size="34" fill="#1d2d35" font-weight="700">성전과 성읍 재건에 대한 방해</text>
<rect x="36" y="105" width="848" height="78" rx="12" fill="#e1ede6"/>
<text x="55" y="131" font-size="17" fill="#235f55" font-weight="700">장소</text>
<text x="55" y="160" font-size="21" fill="#1d2d35">예루살렘 · 사마리아 · 바사 왕실</text>
<text x="36" y="214" font-size="18" fill="#235f55" font-weight="700">본문의 흐름</text>
<path d="M77 252v116" fill="none" stroke="#235f55" stroke-width="2"/>
<rect x="98" y="228" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="252" r="6" fill="#235f55"/>
<text x="117" y="259" font-size="18" fill="#235f55" font-weight="700">1–5절</text>
<text x="216" y="259" font-size="20" fill="#1d2d35">재건 참여를 거절당한 이들이 성전 공사를 방해함</text>
<rect x="98" y="286" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="310" r="6" fill="#235f55"/>
<text x="117" y="317" font-size="18" fill="#235f55" font-weight="700">6–23절</text>
<text x="216" y="317" font-size="20" fill="#1d2d35">후대 왕들에게 고발하고 성읍 공사를 강제로 멈추게 함</text>
<rect x="98" y="344" width="786" height="48" rx="10" fill="#fff"/>
<circle cx="77" cy="368" r="6" fill="#235f55"/>
<text x="117" y="375" font-size="18" fill="#235f55" font-weight="700">24절</text>
<text x="216" y="375" font-size="20" fill="#1d2d35">이야기가 다리오 제이년까지 멈춘 성전 공사로 돌아감</text>
<rect x="36" y="414" width="848" height="74" rx="12" fill="#e1ede6"/>
<text x="55" y="440" font-size="17" fill="#235f55" font-weight="700">기물·기록·표지</text>
<text x="55" y="468" font-size="20" fill="#1d2d35">아람어로 쓴 편지(7) · 왕의 답신(17–22)</text>
<text x="36" y="519" font-size="16" fill="#235f55">고고학 배경 · 엘레판티네 아람어 청원서</text>
</svg>
