<circle cx="77" cy="368" r="6" fill="#235f55"/>
<text x="117" y="375" font-size="18" fill="#235f55" font-weight="700">6–15절</text>
<text x="216" y="375" font-size="20" fill="#1d2d35">하나님의 은혜를 돌아보며 공동체의 죄를 고백함</text>
<rect x="36" y="414" width="848" height="74" rx="12" fill="#e1ede6"/>
<text x="55" y="440" font-size="17" fill="#235f55" font-weight="700">기물·기록·표지</text>
<text x="55" y="468" font-size="20" fill="#1d2d35">옷과 겉옷(3, 5) · 저녁 제사(4–5)</text>
<text x="36" y="519" font-size="16" fill="#235f55">고고학 배경 · 예루살렘 남동쪽 구릉 발굴</text>
