<svg xmlns="http://www.w3.org/2000/svg" width="820" height="594" viewBox="0 0 820 594" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title id="title">룻 3장 · 타작마당의 요청</title><desc id="desc">나오미의 집·보아스의 타작마당 / 1–5 나오미가 룻에게 타작마당으로 가라 함 → 6–13 룻이 보호를 청하고 보아스는 더 가까운 친족을 언급함 → 14–18 룻은 보리를 받고 돌아와 결정을 기다림 / 기름·겉옷 자락·보리 여섯 분량 / 3:15의 보리 분량은 단위가 명시되지 않습니다.</desc>
<rect width="820" height="594" rx="20" fill="#f5f3eb"/>
<text x="34" y="36" font-size="19" fill="#27665e" font-weight="700">룻 3장  ·  본문 도해</text>
<text x="34" y="77" font-size="32" fill="#173039" font-weight="700">타작마당의 요청</text>
<rect x="34" y="100" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="128" font-size="18" fill="#27665e" font-weight="700">주요 장소</text>
<text x="54" y="157" font-size="22" fill="#173039" font-weight="400">나오미의 집·보아스의 타작마당</text>
<text x="34" y="202" font-size="18" fill="#27665e" font-weight="700">본문의 흐름</text>
<rect x="34" y="215" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="247" font-size="19" fill="#27665e" font-weight="700">1–5절</text>
<text x="158" y="247" font-size="22" fill="#173039" font-weight="400">나오미가 룻에게 타작마당으로 가라 함</text>
<path d="M410 270v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="286" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="318" font-size="19" fill="#27665e" font-weight="700">6–13절</text>
<text x="158" y="318" font-size="22" fill="#173039" font-weight="400">룻이 보호를 청하고 보아스는 더 가까운 친족을 언급함</text>
<path d="M410 341v12m-5 -5 5 5 5 -5" fill="none" stroke="#27665e" stroke-width="2" stroke-linecap="round"/>
<rect x="34" y="357" width="752" height="53" rx="12" fill="#ffffff"/>
<text x="54" y="389" font-size="19" fill="#27665e" font-weight="700">14–18절</text>
<text x="158" y="389" font-size="22" fill="#173039" font-weight="400">룻은 보리를 받고 돌아와 결정을 기다림</text>
<rect x="34" y="426" width="752" height="75" rx="12" fill="#e5ece5"/>
<text x="54" y="454" font-size="18" fill="#27665e" font-weight="700">주요 기물·표지</text>
<text x="54" y="483" font-size="22" fill="#173039" font-weight="400">기름·겉옷 자락·보리 여섯 분량</text>
<text x="34" y="522" font-size="18" fill="#6a4d32" font-weight="400">3:15의 보리 분량은 단위가 명시되지 않습니다.</text>
<text x="34" y="550" font-size="17" fill="#526862" font-weight="400">기록 사진은 장의 별도 그림에서 볼 수 있습니다.</text>
<text x="34" y="574" font-size="16" fill="#526862" font-weight="400">개역개정 4판·개역한글 대조 / 호크마 참고 / 지도 축척 없음</text>
</svg>
