<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ee">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://daily-bible-reminder.gimbap-lettuce.workers.dev; base-uri 'none'; form-action 'none'">
  <title>훈련 자료 | Bible Reading</title>
  <style>
    :root{color-scheme:light;--ink:#26352d;--muted:#68756d;--green:#2f6f55;--soft:#e8f2eb;--paper:#f6f4ee;--card:#fffefa;--line:#dce3db;--danger:#9a3f35}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(900px,100% - 32px);margin:32px auto 80px}.brand{font-size:.85rem;color:var(--green);font-weight:700;letter-spacing:.04em}.hero{margin:8px 0 24px}.hero h1{font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.25;margin:.3rem 0}.hero p,.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 5px 18px #2335220b}.card h2{margin:0 0 8px;font-size:1.2rem}.btn{appearance:none;border:0;border-radius:10px;padding:10px 15px;background:var(--green);color:white;font:inherit;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.btn.secondary{background:var(--soft);color:var(--green)}.btn.danger{background:#f8e9e6;color:var(--danger)}.btn:disabled{opacity:.55;cursor:wait}.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:grid;gap:6px;max-width:420px;margin:16px 0}.field input{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:white}.status{padding:12px 14px;background:var(--soft);border-radius:12px;color:var(--green)}.status.error{background:#f8e9e6;color:var(--danger)}.small{font-size:.88rem}.qr-layout{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.qr-img{background:white;border:1px solid var(--line);border-radius:12px;padding:10px;width:240px;max-width:100%}.qr-img svg{display:block;width:100%;height:auto}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding:13px 0}.row:first-of-type{border-top:0}.row p{margin:0}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.label{font-size:.78rem;padding:2px 9px;border-radius:99px;background:#edf0ec;color:var(--muted)}.label.pending{background:#fff2d8;color:#805b13}.label.approved{background:var(--soft);color:var(--green)}.reader-list{padding:0;list-style:none}.lesson-grid{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:18px}.lesson-nav{display:grid;gap:6px;align-content:start}.lesson-nav button{justify-content:flex-start;text-align:left;background:transparent;color:var(--ink);border:1px solid transparent}.lesson-nav button.active{background:var(--soft);color:var(--green);border-color:var(--line)}.lesson-body{min-width:0}.lesson-body h1,.lesson-body h2,.lesson-body h3{line-height:1.35}.lesson-body p{margin:.65em 0}.lesson-body ul,.lesson-body ol{padding-left:1.5em}.lesson-body pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f2ec;border-radius:10px;padding:14px;font: .88rem/1.6 ui-monospace,monospace}.lesson-body blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid var(--green);background:var(--soft)}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.back{color:var(--green);font-weight:700;text-decoration:none}footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:36px}@media(max-width:650px){main{margin-top:20px}.card{padding:17px}.lesson-grid{grid-template-columns:1fr}.lesson-nav{display:flex;overflow:auto}.lesson-nav .btn{white-space:nowrap}.row{align-items:flex-start}.row-actions{flex-direction:column}.qr-img{width:210px}}
  </style>
</head>
<body>
<main>
  <div class="brand">BIBLE READING · 훈련 자료실</div>
  <header class="hero"><h1>제자훈련 자료</h1><p>관리자가 승인한 기기에서 자료를 읽을 수 있어요.</p></header>
  <div id="training-app" aria-live="polite"><section class="card"><p>자료실을 여는 중이에요…</p></section></div>
  <footer>접근 권한은 기기별로 관리되며, 관리자가 언제든 회수할 수 있어요.</footer>
</main>
<script src="js/vendor/qrcode-generator-1.4.4.js"></script>
<script src="js/features/training.js?v=3"></script>
</body>
</html>
