<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>경건생활</title>
  <meta name="description" content="갓피아 성경으로 매일 5장씩 성경을 통독하고, 오늘의 QT로 바로 들어가는 페이지">
  <meta name="theme-color" content="#2d6a55">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="경건생활">
  <link rel="icon" href="icons/favicon-48.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/base.css?v=50">
  <link rel="stylesheet" href="css/setup.css?v=50">
  <link rel="stylesheet" href="css/reader.css?v=50">
  <link rel="stylesheet" href="css/stats.css?v=50">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="#today">
        <img src="icons/icon-192.png" alt="" width="30" height="30">
        <span>경건생활</span>
      </a>
      <span class="streak-chip" id="streak-chip" hidden>🔥 <b>0</b>일</span>
    </div>
    <div class="topbar-right">
      <nav class="tabs" aria-label="메뉴">
        <a href="#today" data-route="today">통독</a>
        <a href="#qt" data-route="qt">QT</a>
        <a href="#stats" data-route="stats">관리</a>
      </nav>
      <button class="reload-btn" id="app-reload" aria-label="앱 새로 불러오기" title="앱 새로 불러오기">↻</button>
      <span class="app-sign" title="만든 사람: 벅수">
        <b id="app-ver">v</b>
        <small><svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><circle cx="10" cy="10" r="9.5" fill="#1f2a1f"/><circle cx="10" cy="10" r="7.6" fill="#fff"/><circle cx="10" cy="10" r="2.4" fill="#f2c230"/><circle cx="6.6" cy="8" r="1.5" fill="#e0533d"/><circle cx="13.2" cy="8.4" r="1.5" fill="#4caf50"/><circle cx="8" cy="13.4" r="1.4" fill="#f08a24"/><circle cx="12.6" cy="13" r="1.3" fill="#8d5a3b"/></svg>© 벅수</small>
      </span>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    성경 본문과 QT는 <a href="https://www.godpia.com/" target="_blank" rel="noopener">갓피아(GODpia)</a>에서 제공됩니다.
    기록은 이 브라우저에만 저장되니 <a href="#stats">관리</a>에서 로그인하거나 백업해 두세요.
  </footer>

  <!-- 순서가 중요: core(데이터·저장) → shared(공통) → features(화면별 기능) → main(시작) -->
  <script src="js/core/bible.js?v=50"></script>
  <script src="js/core/store.js?v=50"></script>
  <script src="js/core/config.js?v=50"></script>
  <script src="js/core/versecounts.js?v=50"></script>
  <script src="js/shared/state.js?v=50"></script>
  <script src="js/shared/godpia.js?v=50"></script>
  <script src="js/shared/ui.js?v=50"></script>
  <script src="js/features/setup.js?v=50"></script>
  <script src="js/features/reader.js?v=50"></script>
  <script src="js/features/verses.js?v=50"></script>
  <script src="js/features/picker.js?v=50"></script>
  <script src="js/features/memopick.js?v=50"></script>
  <script src="js/features/summary-data.js?v=50"></script>
  <script src="js/features/summary.js?v=50"></script>
  <script src="js/features/qt.js?v=50"></script>
  <script src="js/features/stats.js?v=50"></script>
  <script src="js/features/export.js?v=50"></script>
  <script src="js/features/reminder.js?v=50"></script>
  <script src="js/features/account.js?v=50"></script>
  <script src="js/features/celebrate.js?v=50"></script>
  <script src="js/main.js?v=50"></script>
  <script>document.getElementById("app-ver").textContent = "v" + (document.querySelector('script[src*="main.js"]').src.match(/v=(\d+)/) || [, "?"])[1];</script>
</body>
</html>
